# Perfetto config for a phone race: SurfaceFlinger frame timeline, GPU memory, power rails, process stats,
# scheduler and frequency events. `duration_ms` is edited per run; the buffer is 400 MB because
# sched_switch is about 3.6 MB a second. scripts/android-perf-trace.py reads the result.
buffers { size_kb: 400000 fill_policy: DISCARD }
buffers { size_kb: 16384 fill_policy: DISCARD }
data_sources { config { name: "android.surfaceflinger.frametimeline" target_buffer: 1 } }
data_sources { config { name: "android.gpu.memory" target_buffer: 1 } }
data_sources { config { name: "android.power" target_buffer: 1
  android_power_config { battery_poll_ms: 1000 collect_power_rails: true battery_counters: BATTERY_COUNTER_CAPACITY_PERCENT battery_counters: BATTERY_COUNTER_CURRENT } } }
data_sources { config { name: "linux.process_stats" target_buffer: 1 process_stats_config { scan_all_processes_on_start: false proc_stats_poll_ms: 1000 } } }
data_sources { config { name: "linux.ftrace" target_buffer: 0
  ftrace_config {
    ftrace_events: "sched/sched_switch"
    ftrace_events: "power/cpu_frequency"
    ftrace_events: "power/gpu_frequency"
    atrace_categories: "gfx"
    atrace_categories: "view"
    atrace_categories: "power"
    atrace_apps: "org.openantigrav.game"
  } } }
# The game's stderr, for scripts/android-fence-timeline.py --by-window.
data_sources { config { name: "android.log" target_buffer: 1 android_log_config { log_ids: LID_DEFAULT filter_tags: "RustStdoutStderr" } } }
duration_ms: 60000
