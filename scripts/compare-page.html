<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenAntiGrav comparison</title>
<style>
:root { color-scheme: dark; --bg:#111418; --panel:#1a1f26; --line:#2b323c; --fg:#e6e9ee; --dim:#98a2b0; --acc:#4da3ff; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,sans-serif; display:flex; min-height:100vh; }
nav { width:260px; flex:none; background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; height:100vh; position:sticky; top:0; }
nav h1 { font-size:15px; margin:0; padding:14px 14px 4px; }
nav p.intro { margin:0; padding:0 14px 10px; color:var(--dim); font-size:12px; }
nav h2 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:12px 14px 4px; }
nav a { display:block; padding:7px 14px; color:var(--fg); text-decoration:none; border-left:3px solid transparent; }
nav a:hover { background:#222933; }
nav a.on { border-left-color:var(--acc); background:#222933; }
main { flex:1; min-width:0; padding:12px 16px 40px; }
.tabs { display:flex; flex-wrap:wrap; gap:4px; margin:0 0 12px; border-bottom:1px solid var(--line); }
.tabs button { background:none; color:var(--dim); border:0; border-bottom:3px solid transparent; padding:9px 16px; font:inherit; font-size:15px; font-weight:600; cursor:pointer; }
.tabs button:hover { color:var(--fg); }
.tabs button.on { color:var(--fg); border-bottom-color:var(--acc); }
.tabs button span { color:var(--dim); font-weight:400; font-size:12px; margin-left:6px; }
.bar { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin-bottom:10px; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
.seg button { background:var(--panel); color:var(--fg); border:0; padding:7px 12px; font:inherit; cursor:pointer; border-right:1px solid var(--line); }
.seg button:last-child { border-right:0; }
.seg button.on { background:var(--acc); color:#04121f; font-weight:600; }
.seg button:disabled { opacity:.35; cursor:default; }
.stagewrap { position:relative; width:100%; }
.stage { position:relative; width:100%; background:#000; overflow:hidden; touch-action:pan-y; user-select:none; -webkit-user-select:none; }
.stage img { display:block; width:100%; height:100%; position:absolute; inset:0; object-fit:contain; pointer-events:none; -webkit-user-drag:none; }
.stage .tag { position:absolute; top:8px; padding:3px 8px; border-radius:4px; background:rgba(0,0,0,.6); font-size:12px; pointer-events:none; }
.stage .tag.l { left:8px; } .stage .tag.r { right:8px; }
.handle { position:absolute; top:0; bottom:0; width:44px; margin-left:-22px; cursor:ew-resize; touch-action:none; }
.handle::before { content:""; position:absolute; left:21px; top:0; bottom:0; width:2px; background:#fff; box-shadow:0 0 4px #000; }
.handle::after { content:"\25C0\25B6"; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:38px; height:38px; line-height:38px; font-size:11px; text-align:center; letter-spacing:-2px; border-radius:50%; background:#fff; color:#111; box-shadow:0 0 6px #000; }
.side { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.side figure { margin:0; } .side img { width:auto; height:auto; max-width:100%; display:block; margin:0 auto; background:#000; }
.side figcaption { color:var(--dim); font-size:12px; padding:3px 0; }
.onion[hidden] { display:none; }
.onion { display:flex; align-items:center; gap:10px; margin:10px 0 0; max-width:720px; }
.onion input { flex:1; height:32px; }
.cap { margin-top:14px; max-width:900px; }
.cap h3 { margin:0 0 6px; font-size:16px; }
.cap dl { display:grid; grid-template-columns:max-content 1fr; gap:2px 14px; margin:0; }
.cap h4 { margin:10px 0 2px; font-size:13px; } .cap dl.env { display:grid; grid-template-columns:max-content 1fr; gap:1px 12px; } .cap dt { color:var(--dim); } .cap abbr { text-decoration:underline dotted; cursor:help; } .cap dd { margin:0; } .cap dd.band-green { color:#4caf50; } .cap dd.band-amber { color:#e0a020; } .cap dd.band-red { color:#e5534b; } .cap dd[class^="band-"] { font-weight:600; }
.cap .note { margin-top:8px; color:var(--dim); }
.credits { display:flex; flex-wrap:wrap; gap:4px 18px; margin-top:6px; max-width:1600px; font-size:12px; color:var(--dim); }
.credits span b { color:var(--fg); font-weight:600; }
.credits[hidden] { display:none; }
.rights { margin:28px 0 0; padding-top:12px; border-top:1px solid var(--line); max-width:900px; font-size:12px; line-height:1.5; color:var(--dim); }
.warn { margin-top:8px; padding:6px 10px; border-left:3px solid #e0a030; background:#2a2316; max-width:900px; }
@media (max-width:760px) {
  body { display:block; }
  nav { width:auto; height:auto; position:static; border-right:0; border-bottom:1px solid var(--line); max-height:34vh; }
  main { padding:8px; }
  .side { grid-template-columns:1fr; }
  .seg button { padding:9px 10px; }
}
</style>
</head>
<body>
<nav id="nav"></nav>
<main>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="bar">
    <div class="seg" id="pairs"></div>
    <div class="seg" id="views"></div>
  </div>
  <div class="stagewrap"><div class="stage" id="stage"></div></div>
  <div class="credits" id="credits"></div>
  <div class="onion" id="onion" hidden><span>A</span><input type="range" id="opacity" min="0" max="100" value="50"><span>B</span><output id="opout">50%</output></div>
  <div class="cap" id="cap"></div>
  <footer class="rights" id="rights"><!--STATEMENT--></footer>
</main>
<script>
const DATA = /*DATA*/;
const VIEWS = [["split","Split"],["onion","Onion skin"],["side","Side by side"],["diff","Difference x2"]];
const NAMES = {original:"Original", before:"Ours (before)", ours:"Ours"};
const PAIRS = [["original","ours"],["before","ours"],["original","before"]];
const st = {id:null, pair:null, view:"split", split:50, opacity:50};
const $ = s => document.getElementById(s);
const entry = () => DATA.entries.find(e => e.id === st.id);
const pairsOf = e => PAIRS.filter(([a,b]) => e.images[a] && e.images[b]);
const pairName = ([a,b]) => NAMES[a] + " | " + NAMES[b];
// With no original, "before | ours" is the whole story: label it as before and after.
const sideName = (e, slot) => (slot === "before" && !e.images.original) ? "Before" : (slot === "ours" && !e.images.original ? "After" : NAMES[slot]);

// The credit under an image: title, platform, and whether it is the original or this engine.
function credit(e, slot) {
  const src = slot === "original" ? "Original game" : (slot === "before" ? "OpenAntiGrav engine, before" : "OpenAntiGrav engine");
  return e.game + " \u00b7 " + (e.platform || "platform not recorded") + " \u00b7 " + src;
}

const GAMES = [...new Set(DATA.entries.map(e => e.game))];
// The entry last shown per title, so a tab returns to where it was left.
const lastOf = {};

// One tab per title; the sidebar lists the selected title's pairs only.
function buildTabs() {
  const tabs = $("tabs"); tabs.innerHTML = "";
  for (const g of GAMES) {
    const b = document.createElement("button"); b.setAttribute("role", "tab"); b.dataset.game = g;
    const n = document.createElement("span"); n.textContent = DATA.entries.filter(x => x.game === g).length;
    b.append(g, n);
    b.onclick = () => select(lastOf[g] || DATA.entries.find(x => x.game === g).id);
    tabs.append(b);
  }
}

function buildNav(game) {
  const nav = $("nav");
  nav.innerHTML = "<h1></h1><p class=intro></p>";
  nav.dataset.game = game;
  nav.querySelector("h1").textContent = DATA.title;
  nav.querySelector("p").textContent = DATA.intro;
  const h = document.createElement("h2"); h.textContent = game; nav.append(h);
  for (const e of DATA.entries.filter(x => x.game === game)) {
    const a = document.createElement("a"); a.href = "#" + e.id; a.textContent = e.title; a.dataset.id = e.id; nav.append(a);
  }
}

function select(id) {
  const e = DATA.entries.find(x => x.id === id) || DATA.entries[0];
  st.id = e.id;
  const ps = pairsOf(e);
  if (!st.pair || !ps.some(p => p.join("|") === st.pair)) st.pair = ps[0].join("|");
  location.hash = e.id;
  render();
}

function render() {
  const e = entry();
  document.title = e.title + " - " + DATA.title;
  lastOf[e.game] = e.id;
  if ($("nav").dataset.game !== e.game) buildNav(e.game);
  document.querySelectorAll("#tabs button").forEach(b => { const on = b.dataset.game === e.game; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); });
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.id === e.id));
  const ps = pairsOf(e);
  $("pairs").innerHTML = "";
  for (const p of ps) {
    const b = document.createElement("button"); b.textContent = pairName(p).replace(/Ours \(before\) \| Ours/, "Before | After");
    if (!e.images.original) b.textContent = "Before | After";
    b.className = p.join("|") === st.pair ? "on" : ""; b.onclick = () => { st.pair = p.join("|"); render(); };
    $("pairs").append(b);
  }
  $("pairs").hidden = ps.length < 2;
  $("views").innerHTML = "";
  for (const [k, n] of VIEWS) {
    const b = document.createElement("button"); b.textContent = n; b.className = k === st.view ? "on" : "";
    b.onclick = () => { st.view = k; render(); }; $("views").append(b);
  }
  const [a, b] = st.pair.split("|");
  const [w, h] = e.size;
  const stage = $("stage");
  stage.style.aspectRatio = w + " / " + h;
  // Never wider than the frame itself: scaling down is fine, scaling up blurs it.
  stage.style.maxWidth = w + "px";
  stage.innerHTML = "";
  stage.onpointerdown = null;
  $("onion").hidden = st.view !== "onion";
  const imgA = src => { const i = document.createElement("img"); i.src = src; i.alt = ""; i.draggable = false; return i; };
  const tag = (txt, cls) => { const t = document.createElement("span"); t.className = "tag " + cls; t.textContent = txt; return t; };
  if (st.view === "split") {
    const under = imgA(e.images[b]), over = imgA(e.images[a]);
    const handle = document.createElement("div"); handle.className = "handle";
    const apply = () => { over.style.clipPath = "inset(0 " + (100 - st.split) + "% 0 0)"; handle.style.left = st.split + "%"; };
    stage.append(under, over, tag(sideName(e, a), "l"), tag(sideName(e, b), "r"), handle);
    apply();
    const move = ev => { const r = stage.getBoundingClientRect(); st.split = Math.max(0, Math.min(100, (ev.clientX - r.left) / r.width * 100)); apply(); };
    stage.onpointerdown = ev => { stage.setPointerCapture(ev.pointerId); move(ev); stage.onpointermove = move; stage.onpointerup = stage.onpointercancel = () => { stage.onpointermove = null; }; };
  } else if (st.view === "onion") {
    const under = imgA(e.images[a]), over = imgA(e.images[b]);
    over.style.opacity = st.opacity / 100;
    stage.append(under, over, tag(sideName(e, a) + " (A)", "l"), tag(sideName(e, b) + " (B)", "r"));
    $("opacity").value = st.opacity; $("opout").textContent = st.opacity + "%";
    $("opacity").oninput = ev => { st.opacity = +ev.target.value; over.style.opacity = st.opacity / 100; $("opout").textContent = st.opacity + "%"; };
  } else if (st.view === "side") {
    stage.style.aspectRatio = "auto";
    stage.style.maxWidth = (2 * w + 6) + "px";
    const g = document.createElement("div"); g.className = "side";
    for (const s of [a, b]) {
      const f = document.createElement("figure"); const c = document.createElement("figcaption"); c.textContent = sideName(e, s) + ": " + credit(e, s);
      f.append(imgA(e.images[s]), c); g.append(f);
      f.querySelector("img").style.position = "static";
    }
    stage.append(g);
  } else {
    stage.append(imgA(e.diffs[a + "|" + b]), tag("|" + sideName(e, a) + " - " + sideName(e, b) + "| x2", "l"));
  }
  const cr = $("credits"); cr.innerHTML = ""; cr.hidden = st.view === "side";
  for (const s of [a, b]) { const c = document.createElement("span"), l = document.createElement("b"); l.textContent = sideName(e, s) + ": "; c.append(l, credit(e, s)); cr.append(c); }
  const cap = $("cap"); cap.innerHTML = "";
  const h3 = document.createElement("h3"); h3.textContent = e.game + ": " + e.title; cap.append(h3);
  const dl = document.createElement("dl");
  const rows = [["Track", e.caption.track], ["Craft", e.caption.craft], ["State", e.caption.state], ["Setting", e.caption.setting]];
  for (const [k, v] of rows) if (v) { const dt = document.createElement("dt"), dd = document.createElement("dd"); dt.textContent = k; dd.textContent = v; dl.append(dt, dd); }
  cap.append(dl);
  const env = e.caption.environment;
  if (env) {
    const h = document.createElement("h4"); h.textContent = "Environment"; cap.append(h);
    const el = document.createElement("dl"); el.className = "env";
    for (const [key, label, hint] of ENV_FIELDS) {
      if (!env[key]) continue;
      const dt = document.createElement("dt"), dd = document.createElement("dd");
      if (hint) { const ab = document.createElement("abbr"); ab.title = hint; ab.textContent = label; dt.append(ab); } else dt.textContent = label;
      dd.textContent = env[key]; el.append(dt, dd);
      const band = metricBand(key, env[key]); if (band) { dd.className = "band-" + band[0]; dd.title = band[1]; }
    }
    cap.append(el);
  }
  if (e.note) { const n = document.createElement("div"); n.className = "note"; n.textContent = e.note; cap.append(n); }
  if (e.not_captured) { const n = document.createElement("div"); n.className = "warn"; n.textContent = "Original not captured: " + e.not_captured; cap.append(n); }
  if (e.size) { const n = document.createElement("div"); n.className = "note"; n.textContent = "compared at " + w + "x" + h; cap.append(n); }
}

// Green is close to the original, amber partly, red off; the bands are compare_env.METRIC_BANDS.
function metricBand(key, text) {
  const b = DATA.metric_bands && DATA.metric_bands[key], v = parseFloat(text);
  if (!b || isNaN(v)) return null;
  const lower = b.better === "lower";
  const name = lower ? (v <= b.green ? "green" : v <= b.amber ? "amber" : "red") : (v >= b.green ? "green" : v >= b.amber ? "amber" : "red");
  const op = lower ? "<=" : ">=";
  return [name, "green " + op + " " + b.green + ", amber " + op + " " + b.amber + ", red beyond (chosen bands)"];
}

const ENV_FIELDS = [
  ["profile", "Profile"], ["output", "Output"],
  ["original_emulator", "Original: emulator"], ["original_renderer", "Original: renderer"],
  ["captured_at", "Original captured"],
  ["ours_settings", "Ours: settings"], ["ours_exposure", "Ours: exposure"], ["rendered_at", "Ours rendered"],
  ["rmse", "RMSE", DATA.metric_hints.rmse], ["edge_ncc", "Edge correlation", DATA.metric_hints.edge_ncc],
  ["mean_grey", "Mean grey difference", DATA.metric_hints.mean_grey],
  ["build", "Build"], ["binary", "Binary"],
];

addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT") return;
  const i = DATA.entries.findIndex(e => e.id === st.id);
  if (ev.key === "ArrowDown" || ev.key === "j") select(DATA.entries[Math.min(i + 1, DATA.entries.length - 1)].id);
  else if (ev.key === "ArrowUp" || ev.key === "k") select(DATA.entries[Math.max(i - 1, 0)].id);
  else if (ev.key >= "1" && ev.key <= "4") { st.view = VIEWS[+ev.key - 1][0]; render(); }
  else if (ev.key === "ArrowLeft" && st.view === "split") { st.split = Math.max(0, st.split - 2); render(); }
  else if (ev.key === "ArrowRight" && st.view === "split") { st.split = Math.min(100, st.split + 2); render(); }
});
addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id !== st.id) select(id); });
{ const q = new URLSearchParams(location.search); if (VIEWS.some(v => v[0] === q.get("view"))) st.view = q.get("view"); if (q.get("split")) st.split = +q.get("split"); }
buildTabs();
select(location.hash.slice(1));
</script>
</body>
</html>
