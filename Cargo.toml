[workspace]
resolver = "3"
members = [
  "crates/2048",
  "crates/ai",
  "crates/assets",
  "crates/audio",
  "crates/core",
  "crates/disc",
  "crates/display",
  "crates/formats",
  "crates/fx",
  "crates/game",
  "crates/gameplay",
  "crates/gpu",
  "crates/hd",
  "crates/hud",
  "crates/input",
  "crates/livery",
  "crates/log",
  "crates/mesh",
  "crates/music",
  "crates/omega",
  "crates/physics",
  "crates/post",
  "crates/present",
  "crates/pulse",
  "crates/pure",
  "crates/race",
  "crates/raceplay",
  "crates/rcs",
  "crates/render",
  "crates/replay",
  "crates/shader-check",
  "crates/sound",
  "crates/source",
  "crates/tables",
  "crates/testdata",
  "crates/texture",
  "crates/title",
  "crates/tools",
  "crates/trace",
  "crates/ui",
  "crates/ui-screens",
  "crates/vex",
  "crates/video",
  "crates/view",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/topaxi/OpenAntiGrav"
rust-version = "1.88"

[workspace.dependencies]
oag-2048 = { path = "crates/2048" }
oag-ai = { path = "crates/ai" }
oag-assets = { path = "crates/assets" }
oag-audio = { path = "crates/audio" }
oag-core = { path = "crates/core" }
oag-disc = { path = "crates/disc" }
oag-display = { path = "crates/display" }
oag-formats = { path = "crates/formats" }
oag-fx = { path = "crates/fx" }
oag-gameplay = { path = "crates/gameplay" }
oag-gpu = { path = "crates/gpu" }
oag-shader-check = { path = "crates/shader-check" }
oag-hd = { path = "crates/hd" }
oag-hud = { path = "crates/hud" }
oag-log = { path = "crates/log" }
oag-input = { path = "crates/input" }
oag-livery = { path = "crates/livery" }
oag-mesh = { path = "crates/mesh" }
oag-music = { path = "crates/music" }
oag-sound = { path = "crates/sound" }
oag-source = { path = "crates/source" }
oag-omega = { path = "crates/omega" }
oag-physics = { path = "crates/physics" }
oag-pob = { path = "crates/pob" }
oag-post = { path = "crates/post" }
oag-present = { path = "crates/present" }
oag-pulse = { path = "crates/pulse" }
oag-pure = { path = "crates/pure" }
oag-race = { path = "crates/race" }
oag-raceplay = { path = "crates/raceplay" }
oag-rcs = { path = "crates/rcs" }
oag-render = { path = "crates/render" }
oag-replay = { path = "crates/replay" }
oag-testdata = { path = "crates/testdata" }
oag-tables = { path = "crates/tables" }
oag-texture = { path = "crates/texture" }
oag-title = { path = "crates/title" }
oag-trace = { path = "crates/trace" }
oag-ui = { path = "crates/ui" }
oag-ui-screens = { path = "crates/ui-screens" }
oag-vex = { path = "crates/vex" }
oag-video = { path = "crates/video" }
oag-weapons = { path = "crates/weapons" }

anyhow = "1"
# Two crates now: `oag-display` defines the settings vocabulary and `oag-game`
# reads and writes the file it lands in.
serde = { version = "1", features = ["derive"] }
toml = "1"
thiserror = "2"

# GPU rendering and windowing.
wgpu = "30"
winit = "0.30"
pollster = "1"

# Diagnostics. Everything that used to be a bare `println!`/`eprintln!` note
# about what the engine is doing goes through the `log` facade instead, so it
# carries a level and can be filtered with `RUST_LOG`.
#
# `env_logger` is a dependency of the **binaries alone** - a library never picks
# the sink. It is also deliberately absent from the simulation crates
# (`oag-core`, `oag-physics`, `oag-ai`, `oag-race`, `oag-weapons`, `oag-gameplay`), which log
# nothing at all: they take a snapshot in and emit one out, and a logger there
# would be a side effect the determinism tests cannot see.
#
# What stays a `println!` is a command's **output** rather than a note about it:
# `oag-unpack`'s tables, `oag-wad`'s listings, `oag-trace`'s CSV and summaries,
# `oag-view`'s reports, and the key hints the game prints to the terminal. Those
# are what a user redirects; routing them through a logger would stamp every
# line with a timestamp and a module path, and let `RUST_LOG` silence a
# program's whole reason for running.
log = "0.4"
env_logger = "0.11"

# Our own transcendentals, for the simulation only. `determinism.md` names
# bringing an implementation into `oag-core` as the fix when platform libm
# differences would otherwise reach simulation state; this is that
# implementation. A pure-Rust port of MUSL's libm, so it is the same code, and
# so the same bits, on every target we ship.
libm = "0.2"

# The AV1 decoder the movie cache is played back through: a Rust port of dav1d,
# so no C toolchain enters the build. `default-features = false` drops the `asm`
# feature, which would require `nasm`. See docs/architecture/adr/0008.
re_rav1d = { version = "0.1.3", default-features = false, features = [
  "bitdepth_8",
] }
clap = { version = "4", features = ["derive"] }
chd = "0.3"
bytemuck = "1"

# The MPEG decoder, for the container Wipeout HD keeps its music in. Reads how
# long a track is, its channel count and its rate, and decodes it to PCM.
#
# **In the build so that `ffmpeg` is not, for this codec.** `ffmpeg` is reserved
# for what we neither implement nor can take a light dependency on - ATRAC3+,
# which has no Rust decoder at all and which ADR-0019 puts out of process, and
# the video path. MP3 is neither, so it is decoded in process and Wipeout HD's
# music plays on a machine with no `ffmpeg` installed.
#
# **A library rather than our own.** `oag-formats` hand-rolls every *Wipeout*
# format because nothing else will; MPEG is a published standard whose failure
# mode is plausible-sounding noise, which is the same argument `miniz_oxide` and
# `re_rav1d` are here on.
#
# Pure Rust with no C toolchain, the bar those two are held to. **MPL-2.0**,
# unlike everything else here: a file-level copyleft that covers changes to its
# own sources and leaves this workspace's `MIT OR Apache-2.0` untouched by
# depending on it. `default-features = false` takes only the MP3 codec and
# demuxer, leaving the other twenty-odd formats and the SIMD paths out.
symphonia = { version = "0.6", default-features = false, features = ["mp3"] }

# The ATRAC9 decoder, for the Omega Collection's Wwise media: every `.wem` there
# is ATRAC9 (`oag_formats::wwise::wem`). ADR-0024's order applies and puts a
# library first: ATRAC9 is Sony's codec, not Wipeout's, so it may not be
# written here, and a pure-Rust decoder exists, so `ffmpeg` (which ADR-0019
# reserves for ATRAC3+, where none does) is not needed.
#
# **MIT, no dependencies of its own**, a port of LibAtrac9 (also MIT). Young
# and single-author, so it was measured before it was taken: on a stereo voice
# clip it and FFmpeg's independent decoder agree to within one least-significant
# bit on 99.75% of samples, up to polarity (one is the negation of the other),
# and `crates/game/tests/omega_wem_ground_truth.rs` decodes every `.wem` on the
# Omega archives with it. Its own README rates multi-channel "partial"; the
# four- and eight-channel files are measured there too.
atrac9dec = "0.9"

# Inflate, for the PS3 `.psarc` container. Pure Rust with no C toolchain, the
# same bar `re_rav1d` is held to. `oag-formats` hand-rolls every *Wipeout*
# format and the two checksums PNG needs, but deflate is a published standard
# whose failure mode is silent garbage, so this one is not worth rewriting.
# `default-features = false` drops `with-alloc`'s `simd` and the C-shim
# feature; `with-alloc` is what provides `decompress_to_vec_zlib`.
miniz_oxide = { version = "0.8", default-features = false, features = [
  "with-alloc",
] }

# `scalar-math` disables SIMD. Vectorised paths are free to reassociate and to
# differ between targets; the simulation must not. See docs/architecture/adr/0002.
glam = { version = "0.33", default-features = false, features = [
  "std",
  "scalar-math",
] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Determinism hazards. Every one of these can silently change results between
# targets or between runs; see docs/architecture/determinism.md.
float_arithmetic = "allow"     # enabled per-module in sim crates, not globally
suboptimal_flops = "allow"     # would suggest mul_add, which is contraction
imprecise_flops = "allow"

[profile.release]
debug = 1

# Link time, not compile time, is what the test gate spends on `oag-game`: it
# has 84 integration-test binaries, each statically linking wgpu, cpal and the
# rest of the composition root, and every edit to the library relinks all of
# them. Two settings cut one relink from 1,324 ms to 406 ms and the binary from
# 338 MB to 77 MB, measured on `hd_boot_ground_truth` on 2026-09-13:
#
# - `line-tables-only` keeps `file:line` in a panic backtrace, which is what a
#   failing test is read from, and drops the type and variable DWARF nobody
#   attaches a debugger to a test run for. `target/debug/deps` was 51 GB of
#   mostly that.
# - dev's default `lto = false` still runs thin-local LTO inside the link;
#   `"off"` is the setting that actually skips it.
#
# `[profile.test]` inherits both from `dev`. Neither touches `release`, which
# keeps its full `debug = 1` above.
#
# `incremental = false` is the third. Cargo's incremental mode splits a
# workspace member into 256 codegen units so it can reuse the unchanged ones,
# and at `opt-level = 2` that split keeps small `#[inline]` functions
# (`Vec3::from_array`, `Iterator::next`, ...) from being inlined across units:
# the simulation tests ran about 40% slower for it, measured 2026-10-01 in
# `docs/architecture/workspace-layout.md`. It also keeps `sccache` (the
# rustc-wrapper in `~/.cargo/config.toml`) from caching our own crates at all,
# because it refuses incremental invocations.
[profile.dev]
debug = "line-tables-only"
lto = "off"
incremental = false

# Behavioural verification runs the simulation for many thousands of ticks, and
# the ground-truth tests push whole discs through our own decoders. An
# unoptimised build makes both unusable.
#
# `package."*"` reaches dependencies *only* - never a workspace member - so the
# crates carrying those loops have to be named one by one. Leaving them out is
# not a small cost: naming them took `just test-data` from 11:27 to 6:35 and
# halved its CPU time, and `.config/nextest.toml`'s ordering took it to 3:17
# from there. See docs/architecture/workspace-layout.md for the measurement and
# for which crates are deliberately *not* here.
#
# `debug = false` for the same reason `line-tables-only` exists above, one step
# further: a failing test is read from the `file:line` of *our* frames, and
# nobody reads a wgpu or naga frame's line. The DWARF for third-party crates was
# more than half of a 91 MB test binary and of the sys time spent linking 130 of
# them. Our own crates keep `line-tables-only`.
[profile.dev.package."*"]
opt-level = 2
debug = false

# The simulation, driven for thousands of ticks per behavioural test.
[profile.dev.package.oag-core]
opt-level = 2
[profile.dev.package.oag-physics]
opt-level = 2
[profile.dev.package.oag-ai]
opt-level = 2
[profile.dev.package.oag-race]
opt-level = 2
[profile.dev.package.oag-gameplay]
opt-level = 2
[profile.dev.package.oag-weapons]
opt-level = 2

# The asset decode path: LZSS, the GS and GE texture swizzles, the `.vex` node
# walk, and the sector-at-a-time read under all of them.
[profile.dev.package.oag-disc]
opt-level = 2

# The picture vocabulary. Small, but every settings round-trip and every menu
# row reads it, so it is on the path of the front-end tests rather than off it.
[profile.dev.package.oag-display]
opt-level = 2
[profile.dev.package.oag-formats]
opt-level = 2
[profile.dev.package.oag-assets]
opt-level = 2

# The video path: demuxing a `.PMF`/`IPUF`/`.bik` and, with `av1` on, decoding
# the movie cache. `re_rav1d` is reached by `package."*"` above; this entry is
# for the demuxers around it, which walk a whole file a packet at a time.
[profile.dev.package.oag-video]
opt-level = 2

# The XML tables. A `handlingstats.xml` sweep parses every row on the disc, and
# the parser is a character-at-a-time walk with no allocation to hide behind.
[profile.dev.package.oag-tables]
opt-level = 2

# The pixel formats: the GS and GE palette walks, and the S3TC/PVRTC block
# decoders under `gtf` and `gxt`. Per-texel loops over a whole disc's worth.
[profile.dev.package.oag-texture]
opt-level = 2

# The `.vex` node walk: a whole circuit's tree, every payload in it, and
# the PS2 VIF1 packets under the batch headers.
[profile.dev.package.oag-vex]
opt-level = 2

# The `.pob` emitter walk: every particle system on a disc parsed and its
# bytes claimed, per emitter record.
[profile.dev.package.oag-pob]
opt-level = 2

# The RCSMODEL geometry walk: vertex declarations decoded per stream, and
# the material fragment programs beside them.
[profile.dev.package.oag-rcs]
opt-level = 2

# The front end: `menu_layout_ground_truth.rs` and `menu_skin.rs` decode a real
# sprite sheet and parse a whole title's front-end XML per test.
[profile.dev.package.oag-ui]
opt-level = 2

# The screens built on it: `endrace_screens_ground_truth.rs` and the other
# disc-backed tests parse a whole title's screen XML per test.
[profile.dev.package.oag-ui-screens]
opt-level = 2

# The HUD and the sprite sheet: `hud_layout_ground_truth.rs` and the HUD
# ground-truth tests decode real layouts and sheets per test.
[profile.dev.package.oag-hud]
opt-level = 2

# The race itself: `oag-raceplay` holds the whole front-to-back tick that
# `ai_roll_ground_truth`, `ram_ground_truth` and the other sim-driving tests run
# for thousands of ticks (it lived in `oag-game` until 2026-10-05, which keeps
# its own entry for the headless capture loop that drives it), and `oag-render`
# holds the particle systems the race steps with it. Both were the "left at 0"
# column of the table in `docs/architecture/workspace-layout.md` and were the
# largest unoptimised cost in `just test-data`. `opt-level` keeps IEEE
# semantics, so no state hash moves.
[profile.dev.package.oag-raceplay]
opt-level = 2
[profile.dev.package.oag-game]
opt-level = 2
[profile.dev.package.oag-render]
opt-level = 2

# The particle systems, exhaust, clouds and beams were `oag-render`'s hottest
# modules and moved to `oag-fx` on 2026-10-05; the race steps them every tick.
[profile.dev.package.oag-fx]
opt-level = 2

# The mesh pipeline and the post-processing chain were `oag-render`'s two
# hottest modules; the ground-truth tests that decode a whole model and run a
# pass over it keep the same opt-level they had there.
[profile.dev.package.oag-mesh]
opt-level = 2
[profile.dev.package.oag-post]
opt-level = 2
