[workspace]
resolver = "3"
members = [
  "crates/2048",
  "crates/ai",
  "crates/assets",
  "crates/audio",
  "crates/core",
  "crates/disc",
  "crates/formats",
  "crates/game",
  "crates/gameplay",
  "crates/hd",
  "crates/input",
  "crates/physics",
  "crates/pulse",
  "crates/pure",
  "crates/race",
  "crates/render",
  "crates/title",
  "crates/tools",
  "crates/trace",
  "crates/view",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/topaxi/OpenAntiGrav"
rust-version = "1.88"

[workspace.dependencies]
oag-2048 = { path = "crates/2048" }
oag-ai = { path = "crates/ai" }
oag-assets = { path = "crates/assets" }
oag-audio = { path = "crates/audio" }
oag-core = { path = "crates/core" }
oag-disc = { path = "crates/disc" }
oag-formats = { path = "crates/formats" }
oag-gameplay = { path = "crates/gameplay" }
oag-hd = { path = "crates/hd" }
oag-input = { path = "crates/input" }
oag-physics = { path = "crates/physics" }
oag-pulse = { path = "crates/pulse" }
oag-pure = { path = "crates/pure" }
oag-race = { path = "crates/race" }
oag-render = { path = "crates/render" }
oag-title = { path = "crates/title" }
oag-trace = { path = "crates/trace" }

anyhow = "1"
thiserror = "2"

# Diagnostics. Everything that used to be a bare `println!`/`eprintln!` note
# about what the engine is doing goes through the `log` facade instead, so it
# carries a level and can be filtered with `RUST_LOG`.
#
# `env_logger` is a dependency of the **binaries alone** - a library never picks
# the sink. It is also deliberately absent from the simulation crates
# (`oag-core`, `oag-physics`, `oag-ai`, `oag-race`, `oag-gameplay`), which log
# nothing at all: they take a snapshot in and emit one out, and a logger there
# would be a side effect the determinism tests cannot see.
#
# What stays a `println!` is a command's **output** rather than a note about it:
# `oag-unpack`'s tables, `oag-wad`'s listings, `oag-trace`'s CSV and summaries,
# `oag-view`'s reports, and the key hints the game prints to the terminal. Those
# are what a user redirects; routing them through a logger would stamp every
# line with a timestamp and a module path, and let `RUST_LOG` silence a
# program's whole reason for running.
log = "0.4"
env_logger = "0.11"

# Our own transcendentals, for the simulation only. `determinism.md` names
# bringing an implementation into `oag-core` as the fix when platform libm
# differences would otherwise reach simulation state; this is that
# implementation. A pure-Rust port of MUSL's libm, so it is the same code, and
# so the same bits, on every target we ship.
libm = "0.2"

# The AV1 decoder the movie cache is played back through: a Rust port of dav1d,
# so no C toolchain enters the build. `default-features = false` drops the `asm`
# feature, which would require `nasm`. See docs/architecture/adr/0008.
re_rav1d = { version = "0.1.3", default-features = false, features = [
  "bitdepth_8",
] }
clap = { version = "4", features = ["derive"] }
chd = "0.3"
bytemuck = "1"

# The MPEG decoder, for the container Wipeout HD keeps its music in. Reads how
# long a track is, its channel count and its rate, and decodes it to PCM.
#
# **In the build so that `ffmpeg` is not, for this codec.** `ffmpeg` is reserved
# for what we neither implement nor can take a light dependency on - ATRAC3+,
# which has no Rust decoder at all and which ADR-0019 puts out of process, and
# the video path. MP3 is neither, so it is decoded in process and Wipeout HD's
# music plays on a machine with no `ffmpeg` installed.
#
# **A library rather than our own.** `oag-formats` hand-rolls every *Wipeout*
# format because nothing else will; MPEG is a published standard whose failure
# mode is plausible-sounding noise, which is the same argument `miniz_oxide` and
# `re_rav1d` are here on.
#
# Pure Rust with no C toolchain, the bar those two are held to. **MPL-2.0**,
# unlike everything else here: a file-level copyleft that covers changes to its
# own sources and leaves this workspace's `MIT OR Apache-2.0` untouched by
# depending on it. `default-features = false` takes only the MP3 codec and
# demuxer, leaving the other twenty-odd formats and the SIMD paths out.
symphonia = { version = "0.6", default-features = false, features = ["mp3"] }

# Inflate, for the PS3 `.psarc` container. Pure Rust with no C toolchain, the
# same bar `re_rav1d` is held to. `oag-formats` hand-rolls every *Wipeout*
# format and the two checksums PNG needs, but deflate is a published standard
# whose failure mode is silent garbage, so this one is not worth rewriting.
# `default-features = false` drops `with-alloc`'s `simd` and the C-shim
# feature; `with-alloc` is what provides `decompress_to_vec_zlib`.
miniz_oxide = { version = "0.8", default-features = false, features = [
  "with-alloc",
] }

# `scalar-math` disables SIMD. Vectorised paths are free to reassociate and to
# differ between targets; the simulation must not. See docs/architecture/adr/0002.
glam = { version = "0.33", default-features = false, features = [
  "std",
  "scalar-math",
] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Determinism hazards. Every one of these can silently change results between
# targets or between runs; see docs/architecture/determinism.md.
float_arithmetic = "allow"     # enabled per-module in sim crates, not globally
suboptimal_flops = "allow"     # would suggest mul_add, which is contraction
imprecise_flops = "allow"

[profile.release]
debug = 1

# Behavioural verification runs the simulation for many thousands of ticks, and
# the ground-truth tests push whole discs through our own decoders. An
# unoptimised build makes both unusable.
#
# `package."*"` reaches dependencies *only* - never a workspace member - so the
# crates carrying those loops have to be named one by one. Leaving them out is
# not a small cost: naming them took `just test-data` from 11:27 to 6:35 and
# halved its CPU time, and `.config/nextest.toml`'s ordering took it to 3:17
# from there. See docs/architecture/workspace-layout.md for the measurement and
# for which crates are deliberately *not* here.
[profile.dev.package."*"]
opt-level = 2

# The simulation, driven for thousands of ticks per behavioural test.
[profile.dev.package.oag-core]
opt-level = 2
[profile.dev.package.oag-physics]
opt-level = 2
[profile.dev.package.oag-ai]
opt-level = 2
[profile.dev.package.oag-race]
opt-level = 2
[profile.dev.package.oag-gameplay]
opt-level = 2

# The asset decode path: LZSS, the GS and GE texture swizzles, the `.vex` node
# walk, and the sector-at-a-time read under all of them.
[profile.dev.package.oag-disc]
opt-level = 2
[profile.dev.package.oag-formats]
opt-level = 2
[profile.dev.package.oag-assets]
opt-level = 2
