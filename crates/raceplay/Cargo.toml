[package]
name = "oag-raceplay"
description = "A race from load to finish line: the front-to-back tick, the scene it draws and the effects it plays"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# One integration-test binary instead of one per `tests/*.rs`; see `tests/it.rs`.
autotests = false

# The tick loop with no renderer, no window and no disc. A binary of this crate
# because everything it runs is `oag_raceplay`: a headless server needs this
# crate and nothing from the composition root. See the binary's own module doc.
[[bin]]
name = "oag-headless-sim"
path = "src/bin/headless_sim.rs"

[dependencies]
# `Instant` that is std's own on native and `performance.now()` on the web,
# where `std::time::Instant::now` panics. See docs/tools/web.md.
web-time = "1.1.0"
oag-2048.workspace = true
oag-ai.workspace = true
oag-assets.workspace = true
oag-core.workspace = true
oag-ballisticng = { workspace = true, optional = true }
oag-disc.workspace = true
oag-display.workspace = true
oag-formats.workspace = true
oag-fx = { workspace = true, optional = true }
oag-gameplay.workspace = true
oag-gpu = { workspace = true, optional = true }
oag-hd.workspace = true
oag-hud = { workspace = true, optional = true }
oag-input = { workspace = true, optional = true }
oag-livery = { workspace = true, optional = true }
oag-mesh = { workspace = true, optional = true }
oag-modhost = { workspace = true, optional = true }
oag-physics.workspace = true
oag-pob.workspace = true
oag-post = { workspace = true, optional = true }
oag-present = { workspace = true, optional = true }
oag-pulse.workspace = true
oag-pure.workspace = true
oag-race.workspace = true
oag-rcs.workspace = true
oag-render = { workspace = true, optional = true }
oag-schema.workspace = true
oag-replay.workspace = true
oag-sound = { workspace = true, optional = true }
oag-source.workspace = true
oag-tables.workspace = true
oag-texture.workspace = true
oag-thread.workspace = true
oag-title.workspace = true
oag-trace.workspace = true
oag-trackfile.workspace = true
oag-unity = { workspace = true, optional = true }
oag-ui = { workspace = true, optional = true }
oag-ui-screens = { workspace = true, optional = true }
oag-vex.workspace = true
oag-weapons.workspace = true
anyhow.workspace = true
bytemuck = { workspace = true, features = ["derive"], optional = true }
png = { workspace = true, optional = true }
dirs = "7"
log.workspace = true
serde.workspace = true
toml.workspace = true
# `crate::pilots` writes a hand-authored pilot file back byte-for-byte; see its module doc.
toml_edit = "0.25"
wgpu = { workspace = true, optional = true }
winit = { workspace = true, optional = true }

[features]
default = ["view"]
# Everything a race draws and plays: the renderer, the effects, the HUD, the
# sound, the window types. Off, the crate is the simulation half alone - the
# tick, the load of what the simulation reads, the results - which is what the
# headless server (`oag-net`'s `oag-server`) links. See
# docs/architecture/workspace-layout.md, "The lean race".
view = [
    "dep:bytemuck",
    "dep:oag-fx",
    "dep:oag-gpu",
    "dep:oag-hud",
    "dep:oag-input",
    "dep:oag-livery",
    "dep:oag-mesh",
    "dep:oag-post",
    "dep:oag-present",
    "dep:oag-render",
    "dep:oag-sound",
    "dep:oag-ui",
    "dep:oag-ui-screens",
    "dep:png",
    "dep:wgpu",
    "dep:winit",
]
# BallisticNG Workshop tracks (`.wtrk`) as foreign circuits, through
# `oag-ballisticng` and `oag-unity`. Off by default and enabled by no build
# (maintainer, 2026-10-27: it does not render enough to ship); `just check`
# builds it so it does not rot. Own-format track files need none of it.
ballisticng = ["dep:oag-ballisticng", "dep:oag-unity"]
# Simulation mods: WebAssembly modules called once per tick through `oag-modhost`
# (wasmtime). Off by default; off, nothing of wasmtime is compiled or linked and a
# race offered a module says it was left out. See `crate::extensions`.
extensions = ["dep:oag-modhost"]
# See `oag-render`'s feature of the same name. Off by default.
perf-probe = ["view", "oag-render/perf-probe"]

[lints]
workspace = true

[dev-dependencies]
oag-audio.workspace = true
oag-omega.workspace = true
oag-schema = { workspace = true, features = ["validate"] }
oag-testdata.workspace = true
pollster.workspace = true
# The extension tests' guests, in the text format.
wat = "1.262.0"

[[test]]
name = "it_a_g"
path = "tests/it_a_g.rs"

[[test]]
name = "it_h_l"
path = "tests/it_h_l.rs"

[[test]]
name = "it_m_o"
path = "tests/it_m_o.rs"

[[test]]
name = "it_p_r"
path = "tests/it_p_r.rs"

[[test]]
name = "it_s_z"
path = "tests/it_s_z.rs"
