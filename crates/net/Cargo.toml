[package]
name = "oag-net"
description = "Network play: the wire messages, a transport with two channel kinds over WebTransport, and the authoritative server and predicting client around a race"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# One integration-test binary; see `tests/it.rs`.
autotests = false

# The headless authoritative server. A binary of this crate because everything
# it runs is `oag_raceplay` plus this crate's protocol. Built with this crate's
# default features it links `oag-raceplay` without `view`: no renderer, no
# window, no audio crate at all (`scripts/check-dependency-rules.py` holds it).
[[bin]]
name = "oag-server"
path = "src/bin/oag_server.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
log.workspace = true
oag-ai.workspace = true
oag-assets.workspace = true
oag-bytes.workspace = true
oag-core.workspace = true
oag-gameplay.workspace = true
oag-log.workspace = true
oag-physics.workspace = true
oag-race.workspace = true
oag-raceplay.workspace = true
oag-source.workspace = true
oag-title.workspace = true
web-time = "1.1.0"

# The native transport. QUIC through quinn with `web-transport-quinn`'s own
# pure-Rust provider (rind; no aws-lc C build, which would put cmake into the
# Android and iOS builds), and a self-signed ECDSA P-256 certificate minted per
# run (`rcgen` on `ring`, which also hashes it). Not on the web, where the
# browser's own `WebTransport` object is the transport (not built yet).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
url = "2"
web-transport-quinn = "0.14"

[features]
# The predicting client (`client`), which draws the race it predicts: the game
# turns it on, the server leaves it off. Its tests turn it on through the
# dev-dependency on this crate below.
client = ["oag-raceplay/view"]
# A host that cheats on purpose (`host::Cheat`), armed by `OAG_TEST_CHEAT`, so the tests can
# prove a cheat is caught. Only dev-dependencies turn it on; no shipped build has it.
test-cheats = []

[dev-dependencies]
oag-net = { path = ".", features = ["client", "test-cheats"] }
oag-replay.workspace = true
oag-tables.workspace = true
oag-testdata.workspace = true

[lints]
workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
