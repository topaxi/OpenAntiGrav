[package]
name = "oag-hd"
description = "What Wipeout HD / Fury ships: its seven PSARC archives and the paths inside them"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# A title package is tables. This one is thinner than `oag-pulse` for the same
# reason `oag-pure` is: it holds what `docs/formats/hd-status.md` and
# `docs/formats/hd-frontend.md` measured, and nothing else. In particular it
# restates no `.vex` class ids - HD's track files declare version 6, the same
# word Pulse's do, and `oag-formats` keys the table off that word rather than
# off the disc.
[dependencies]
oag-assets.workspace = true
oag-title.workspace = true

[dev-dependencies]
oag-testdata.workspace = true
oag-rcs.workspace = true
oag-vex.workspace = true
oag-texture.workspace = true
oag-tables.workspace = true
oag-formats.workspace = true
oag-pulse.workspace = true
oag-pure.workspace = true
# Test-only, and a dev-dependency cycle back to a crate that depends on
# `oag-hd` normally (`oag-ui` reads this title's front-end tables) - Cargo's
# dev-dependency graph is separate from the build graph, so this is fine.
# Needed for `crates/hd/tests/endrace_screens_ground_truth.rs`, which reads
# `EndRace_Definition.xml` through the same `oag_ui::screen`/`oag_ui_screens::endrace`
# types `oag_ui_screens::endrace::hd` draws with, rather than re-parsing by hand.
oag-ui.workspace = true
oag-ui-screens.workspace = true

[lints]
workspace = true
