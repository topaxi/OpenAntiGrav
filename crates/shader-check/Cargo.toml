[package]
name = "oag-shader-check"
description = "A build-dependency: links a crate's WESL, then parses and validates every final shader with naga so a bad one fails cargo build, naming its module"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in"] }
wesl = "0.6"

[lints]
workspace = true
