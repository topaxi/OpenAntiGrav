[package]
name = "oag-game"
description = "Runs Wipeout Pulse from a disc image: the composition root"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "oag-game"

[lib]
name = "oag_game"
path = "src/lib.rs"

[[bin]]
name = "oag-game"
path = "src/main.rs"

[dependencies]
oag-display.workspace = true
oag-rcs.workspace = true
oag-vex.workspace = true
oag-texture.workspace = true
oag-tables.workspace = true
oag-pulse.workspace = true
# Only for the boot sequence's title fallback (crate::boot::open_source) - a
# Pure disc opens through here so its intro and menu are reachable, not
# because Pure is a played title yet. See roadmap M8.
oag-hd.workspace = true
oag-pure.workspace = true
oag-2048.workspace = true
oag-omega.workspace = true
oag-ai.workspace = true
oag-assets.workspace = true
# For `Title` and the boot profile it carries: the composition root consumes the
# vocabulary both title packages fill in. See ADR-0023.
oag-title.workspace = true
# The mixer and the device. The composition root is the only crate allowed to
# hold one: `scripts/check-dependency-rules.py` fails the build if a gameplay
# crate ever reaches it. See docs/architecture/workspace-layout.md.
oag-audio.workspace = true
oag-core.workspace = true
# Read straight off the disc, for one thing only: `PS2MUSIC.WAD` is 585 MiB and
# `oag_assets::read_loose_file` reads a loose file whole, so a single
# 35 MiB track would cost the other fifteen. `DiscImage::read_entry_range`
# reads the 196-byte directory and then exactly one entry. See
# `oag_sound::load_ps2_track`.
oag-disc.workspace = true
# Music: the soundtrack listing, ATRAC3+/ATRAC9/MP3/Wwise decoding.
oag-music.workspace = true
# What the game plays: soundtrack selection, effect banks, the mixer's buses.
# `crate::sound` is the half of it that needs a `Race` or a title opener.
oag-sound.workspace = true
oag-formats.workspace = true
# `av1` decodes the movie cache; the composition root is the only crate that
# plays video. See docs/architecture/adr/0008-av1-movie-cache.md.
oag-video = { workspace = true, features = ["av1"] }
oag-gameplay.workspace = true
oag-hud.workspace = true
oag-input.workspace = true
oag-livery.workspace = true
oag-physics.workspace = true
oag-race.workspace = true
oag-raceplay.workspace = true
oag-source.workspace = true
# Recording a run and racing its ghost - see `oag_raceplay::replay` and ADR-0055.
oag-replay.workspace = true
oag-render.workspace = true
oag-post.workspace = true
oag-present.workspace = true
oag-mesh.workspace = true
oag-gpu.workspace = true
# The front end: boot movies, menus, the HUD's font, the strings a screen
# draws. `render.rs` rasterises the `Draw` list this crate emits.
oag-ui.workspace = true
oag-ui-screens.workspace = true
# The composition root is allowed to read a captured trace: `--pose-from`
# renders one of our frames from a row of the original's capture, and the
# column conventions live in one place, `oag-trace`, rather than twice.
oag-trace.workspace = true
anyhow.workspace = true
clap.workspace = true
oag-log.workspace = true
log.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
# Rasterises the SVGs under `assets/icons/` into the window/taskbar icon - see
# `oag_game::icon`. No `<text>` node in either source SVG, so the `text`
# feature (and the fontdb/rustybuzz/ttf-parser it drags in) is off.
resvg = { version = "0.48", default-features = false }
wgpu.workspace = true
winit.workspace = true
pollster.workspace = true
toml.workspace = true
dirs = "7"
serde.workspace = true

# Platform-native H.264 decode for the PSP `.PMF` path, behind the
# `native-video` feature: `just build`/`just check`/CI never touch
# GStreamer, and a Linux build that wants the accelerated path opts in
# explicitly. GStreamer itself owns bitstream parsing, DPB management and
# decoder selection (hardware VA-API when the system has it, software
# libav otherwise) - none of that is code this crate carries. See
# docs/architecture/adr/0017-gstreamer-native-video.md. PS2 content always
# uses the AV1 cache below, unaffected either way.
[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = { version = "0.25", optional = true }
gstreamer-app = { version = "0.25", optional = true }
gstreamer-video = { version = "0.25", optional = true }

# Android: NativeActivity (no Java in the APK), winit's backend over
# `android-activity`. See docs/tools/android.md.
[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }

[features]
# Only the Android build turns this on (`just apk`): it is what makes the
# `oag_android` example below exist, so a desktop `--all-targets` neither builds
# nor links a second copy of the binary.
android = []
native-video = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]
# See `oag-render`'s feature of the same name. Off by default.
perf-probe = ["oag-render/perf-probe", "oag-raceplay/perf-probe"]

[build-dependencies]
oag-shader-check.workspace = true

[lints]
workspace = true

[dev-dependencies]
# `examples/audio_memory_probe.rs` reads the process's resident set; the `perf`
# overlay's own reading lives in `oag-present`.
memory-stats = { version = "1.2.0", features = ["always_use_statm"] }
oag-testdata.workspace = true
oag-fx.workspace = true
oag-pob.workspace = true
oag-weapons.workspace = true

# The Android entry point: the binary's own body again (`src/android.rs`
# `include!`s `src/main_body.rs`, as `src/main.rs` does), as the cdylib the
# NativeActivity loads. An example because the windowed `App` lives in the
# binary's own modules and nothing may depend on `oag-game`; `bin` cannot be a
# cdylib and `cargo rustc` refuses to mix the two crate types. Two roots that
# share one body by `include!` keep Cargo from warning about one file in two
# targets; see docs/tools/android.md.
[[example]]
name = "oag_android"
path = "src/android.rs"
crate-type = ["cdylib"]
required-features = ["android"]
