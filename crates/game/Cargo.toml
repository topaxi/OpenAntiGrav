[package]
name = "oag-game"
description = "Runs Wipeout Pulse from a disc image: the composition root"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "oag_game"
path = "src/lib.rs"

[[bin]]
name = "oag-game"
path = "src/main.rs"

[dependencies]
oag-assets.workspace = true
oag-core.workspace = true
# `av1` decodes the movie cache; the composition root is the only crate that
# plays video. See docs/architecture/adr/0008-av1-movie-cache.md.
oag-formats = { workspace = true, features = ["av1"] }
oag-gameplay.workspace = true
oag-input.workspace = true
oag-physics.workspace = true
oag-race.workspace = true
oag-render.workspace = true
# The composition root is allowed to read a captured trace: `--pose-from`
# renders one of our frames from a row of the original's capture, and the
# column conventions live in one place, `oag-trace`, rather than twice.
oag-trace.workspace = true
anyhow.workspace = true
clap.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
wgpu = "30"
winit = "0.30"
pollster = "0.4"
toml = "1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
thiserror.workspace = true

# Platform-native H.264 decode for the PSP `.PMF` path, behind the `vaapi`
# feature: `just build`/`just check`/CI never touch libva, and a Linux build
# that wants the accelerated path opts in explicitly. See
# docs/architecture/adr/0016-platform-native-h264-decode.md. PS2 content
# always uses the AV1 cache below, unaffected either way.
[target.'cfg(target_os = "linux")'.dependencies]
cros-libva = { version = "0.0.13", optional = true }
h264-reader = { version = "0.8", optional = true }

[features]
vaapi = ["dep:cros-libva", "dep:h264-reader"]

[lints]
workspace = true
