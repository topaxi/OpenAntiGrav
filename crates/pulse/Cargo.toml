[package]
name = "oag-pulse"
description = "What Wipeout Pulse ships: archive names, entry names and name hashes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# A title package is tables. `oag-assets` is here so the two thin
# convenience wrappers ([`open`] and [`read_image`]) can name `Archives`, and
# `oag-formats` for the PS2 texture-name rule those wrappers retry with (which
# lives beside `wad::hash_name`, where the generic mesh crate can reach it
# without a title crate). No decoding happens in this crate, and nothing in
# `oag-formats` reaches back here - that edge would be a cycle.
[dependencies]
oag-assets.workspace = true
oag-formats.workspace = true
oag-title.workspace = true

# `oag-disc`/`oag-testdata`: `tag_input_alphabet_ground_truth.rs` reads
# `BOOT.BIN` directly off a real disc image, `#[ignore]`d, only via
# `just test-data`.
[dev-dependencies]
oag-disc.workspace = true
oag-testdata.workspace = true

[lints]
workspace = true
