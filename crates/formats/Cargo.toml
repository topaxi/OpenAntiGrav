[package]
name = "oag-formats"
description = "Wipeout asset containers: identification, archives, compression and console byte layout"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Inflate, for `psarc`. See the workspace manifest for why this one format is
# not hand-rolled like the rest.
miniz_oxide.workspace = true

# Ground-truth tests read real tracks out of a disc image. These are
# dev-dependencies only: the library itself knows nothing about discs.
#
# `oag-assets` depends back on this crate, so this closes a cycle. Cargo permits
# it - a dev-dependency edge is not part of the normal dependency graph, so the
# library still builds on its own - and `scripts/check-dependency-rules.py`
# walks only normal edges, so the boundary gate is unaffected.
#
# The `oag-pulse`/`oag-pure` edges this list used to carry went with the
# decoders under ADR-0050: the tests that needed a title package to find an
# archive live in `oag-tables`, `oag-vex` and `oag-texture` now. What is left
# here reads a container, and a container is found by path.
[dev-dependencies]
oag-testdata.workspace = true
oag-assets.workspace = true
oag-disc.workspace = true

[lints]
workspace = true
