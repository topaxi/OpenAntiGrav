# Determinism rules for a simulation crate, enforced by Clippy through `just lint`
# (docs/architecture/determinism.md, "How this is enforced"). One of six identical copies,
# one beside each determinism-bound crate's manifest, because Clippy reads the `clippy.toml`
# nearest the crate being linted: crates/{core,physics,gameplay,ai,race,formats}/clippy.toml.
# `just check-determinism` fails when the copies differ.

