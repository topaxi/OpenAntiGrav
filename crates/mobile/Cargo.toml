[package]
name = "oag-mobile"
description = "What a phone needs around the windowed game: where its files live, and the event loop each mobile OS hands the app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Android: NativeActivity (no Java in the APK), winit's backend over
# `android-activity`. See docs/tools/android.md.
[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
# The gallery export calls the framework's MediaStore through the JVM the activity already
# attached; the same jni `android-activity` links, so the lock gains nothing.
jni = "0.22"
# The refresh-rate reader's thread (`refresh::LiveRefresh`).
oag-thread.workspace = true

[dependencies]
log.workspace = true

[dev-dependencies]
oag-mod.workspace = true
oag-present.workspace = true

[lints]
workspace = true
