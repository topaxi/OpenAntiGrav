[package]
name = "oag-ffmpeg"
description = "Finding the ffmpeg and ffprobe the game shells out to, and fetching a pinned LGPL build of them with the player's consent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true

# Fetching a pinned build. Not on wasm (no process to run) or Android (no
# executable may be started from app storage), where `Pin::current` is `None`
# and nothing below is compiled.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
# rustls with ring and bundled roots: no OpenSSL, no platform store (which a wine prefix lacks).
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dev-dependencies]
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "encoder"] }

[dev-dependencies]
oag-testdata.workspace = true

[lints]
workspace = true
