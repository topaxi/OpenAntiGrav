[package]
name = "oag-trace"
description = "Compares a simulation run against a per-tick trace captured from the original"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "oag-trace"
path = "src/main.rs"

# `oag-assets` and `oag-formats` are here for one reason: a comparison run needs
# the same handling parameters and the same collision geometry the original was
# running with, and both live on the player's own disc. Nothing in the comparison
# engine itself touches a disc, so the library half stays usable without one.
#
# `oag-race` is here for `oag-trace pads` alone: projecting a pad onto the
# course's arc-length ring is `Course`'s job and restating it here would be a
# second copy of the ring walk. The comparison engine itself still has no
# notion of a lap.
[dependencies]
oag-vex.workspace = true
oag-tables.workspace = true
oag-pulse.workspace = true
oag-ai.workspace = true
oag-core.workspace = true
oag-gameplay.workspace = true
oag-weapons.workspace = true
oag-physics.workspace = true
oag-race.workspace = true
# For `SpeedClasses::is_measured_name`: `--class` is spell-checked against every
# measured ladder rather than against a four-variant enum, so `vector` reaches a
# Wipeout Pure replay. See `oag_title::SpeedClasses::MEASURED`.
oag-title.workspace = true
anyhow.workspace = true
clap.workspace = true
env_logger.workspace = true
log.workspace = true
thiserror.workspace = true

[lints]
workspace = true
