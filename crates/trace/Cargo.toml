[package]
name = "oag-trace"
description = "Compares a simulation run against a per-tick trace captured from the original"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "oag-trace"
path = "src/main.rs"

# `oag-assets` and `oag-formats` are here for one reason: a comparison run needs
# the same handling parameters and the same collision geometry the original was
# running with, and both live on the player's own disc. Nothing in the comparison
# engine itself touches a disc, so the library half stays usable without one.
[dependencies]
oag-assets.workspace = true
oag-core.workspace = true
oag-formats.workspace = true
oag-gameplay.workspace = true
oag-physics.workspace = true
anyhow.workspace = true
clap.workspace = true
thiserror.workspace = true

# `oag-race` is a dev-dependency only: the comparison engine has no notion of a
# lap, and `lap_ground_truth.rs` is the one place this crate needs one - it
# replays a captured lap through the lap counter to check that the counter agrees
# with the original about how many laps the capture contains.
[dev-dependencies]
oag-race.workspace = true

[lints]
workspace = true
