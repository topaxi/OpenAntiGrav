[package]
name = "oag-audio"
description = "Mixing and playback: a tick-driven mixer, and the output device it feeds"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The arrow points the same way `oag-input`'s does: the simulation owns the
# types this crate reads, and nothing in the simulation may depend on this
# crate. `scripts/check-dependency-rules.py` already names `oag-audio` in the
# set forbidden to gameplay crates, so that rule holds from this crate's first
# commit. See docs/architecture/workspace-layout.md.
[dependencies]
oag-assets.workspace = true
oag-core.workspace = true
oag-formats.workspace = true
anyhow.workspace = true

# The device layer only. Voices, mixing, pitch and volume are this crate's job,
# because the original's are `sceSasCore` semantics we will have to model rather
# than inherit from whatever a higher-level crate happens to implement.
cpal = "0.18.1"

[lints]
workspace = true
