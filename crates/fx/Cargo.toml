[package]
name = "oag-fx"
description = "The renderer's visual effects: the .pob particle player, the exhaust, mist, clouds, beams, flashes and weapon quads"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# One integration-test binary instead of one per `tests/*.rs`; see `tests/it.rs`.
autotests = false

[dependencies]
oag-pob.workspace = true
oag-vex.workspace = true
oag-core.workspace = true
oag-bytes.workspace = true
oag-texture.workspace = true
oag-mesh.workspace = true
oag-gpu.workspace = true
oag-schema.workspace = true
serde.workspace = true
toml.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
wgpu.workspace = true
# `mod_shader`'s refusals read the parsed module. Named directly as `oag_gpu::shader_file` says.
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in"] }

[build-dependencies]
oag-shader-check.workspace = true

[lints]
workspace = true

[dev-dependencies]
oag-testdata.workspace = true
pollster.workspace = true
oag-assets.workspace = true
oag-pulse.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
