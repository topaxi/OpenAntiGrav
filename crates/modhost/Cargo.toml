[package]
name = "oag-modhost"
description = "The WebAssembly extension host: wasmtime configured for determinism, the I/O buffer ABI, fuel and the fault path"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# Desktop only for now (docs/architecture/wasm-extensions/README.md, section 5):
# Cranelift by default, Pulley behind the `pulley` feature, no WASI, no component
# model, no threads, no cache, no parallel compilation.
[dependencies]
# The layout, defined once for the host and the guest SDK.
oag-ext-abi.workspace = true
wasmtime = { version = "=50.0.1", default-features = false, features = ["runtime", "cranelift", "std", "pooling-allocator"] }

[features]
# Run modules on wasmtime's Pulley interpreter instead of native Cranelift code, to
# measure and compare the two. Off by default and enabled by no shipped build.
pulley = ["wasmtime/pulley"]

[dev-dependencies]
# The tests' guests are written in the text format.
wat = "1.263.0"

[lints]
workspace = true
