[package]
name = "oag-trackfile"
description = "This project's own custom-track format: glTF 2.0 geometry and numeric race data, a TOML manifest beside it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# One integration-test binary instead of one per `tests/*.rs`; see `tests/it.rs`.
autotests = false
publish = false

[dependencies]
oag-schema.workspace = true
oag-vex.workspace = true
gltf = { version = "1.4", default-features = false, features = ["extras", "names", "utils"] }
serde.workspace = true
serde_json = "1"
toml.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
oag-schema = { workspace = true, features = ["validate"] }

[[test]]
name = "it"
path = "tests/it.rs"
