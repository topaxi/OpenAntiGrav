[package]
name = "oag-render"
description = "The wgpu renderer: meshes, track ribbons and cameras, shared by the viewer and the game"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
oag-rcs.workspace = true
oag-vex.workspace = true
oag-texture.workspace = true
oag-assets.workspace = true
oag-core.workspace = true
oag-gpu.workspace = true
oag-fx.workspace = true
oag-mesh.workspace = true
oag-pulse.workspace = true
anyhow.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
wgpu.workspace = true
pollster.workspace = true

[features]
# Off by default. Turns on `oag_gpu::perfprobe`'s counters, its `mark`
# and `report_frame` printing, `oag-game`'s counting global allocator and its
# `OAG_RENDER_BENCH` loop.
#
# Every probe call site is compiled either way and every one of them collapses
# to nothing without this - the counters are behind `cfg!`, not `#[cfg]`, so
# the code cannot rot while the flag is off, which is the failure a debug
# affordance nobody builds actually has.
perf-probe = ["oag-gpu/perf-probe", "oag-mesh/perf-probe"]

[build-dependencies]
oag-shader-check.workspace = true

[lints]
workspace = true

[dev-dependencies]
oag-tables.workspace = true
oag-pure.workspace = true
oag-testdata.workspace = true
oag-formats.workspace = true
oag-pob.workspace = true
oag-post.workspace = true
