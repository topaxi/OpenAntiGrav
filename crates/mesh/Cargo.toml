[package]
name = "oag-mesh"
description = "The mesh pipeline: decodes a model into portable buffers and draws it, offscreen or into a surface, with the orbit camera and headless capture"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# One integration-test binary instead of one per `tests/*.rs`; see `tests/it.rs`.
autotests = false

[dependencies]
oag-rcs.workspace = true
oag-vex.workspace = true
oag-texture.workspace = true
oag-assets.workspace = true
oag-core.workspace = true
oag-bytes.workspace = true
oag-formats.workspace = true
oag-gpu.workspace = true
oag-display.workspace = true
oag-thread.workspace = true
anyhow.workspace = true
# The own hull file is a glb (`mesh::own_hull`); the version and features `oag-trackfile` uses.
gltf = { version = "1.4", default-features = false, features = ["extras", "names", "utils"] }
bytemuck = { workspace = true, features = ["derive"] }
wgpu.workspace = true
serde.workspace = true
thiserror.workspace = true
log.workspace = true
pollster.workspace = true

# The opt-in ASTC re-encode's cache (`mesh_render::astc`); the encoder itself is injected by
# `oag-game`, so this crate links no C++.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sha2 = "0.11"
oag-io.workspace = true

[build-dependencies]
oag-shader-check.workspace = true

[features]
perf-probe = ["oag-gpu/perf-probe"]

[lints]
workspace = true

[dev-dependencies]
oag-testdata.workspace = true
serde_json = "1"

[[test]]
name = "it"
path = "tests/it.rs"
