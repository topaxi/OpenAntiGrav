[package]
name = "oag-mesh"
description = "The mesh pipeline: decodes a model into portable buffers and draws it, offscreen or into a surface, with the orbit camera and headless capture"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# One integration-test binary instead of one per `tests/*.rs`; see `tests/it.rs`.
autotests = false

[dependencies]
oag-rcs.workspace = true
oag-vex.workspace = true
oag-texture.workspace = true
oag-assets.workspace = true
oag-core.workspace = true
oag-bytes.workspace = true
oag-formats.workspace = true
oag-gpu.workspace = true
oag-display.workspace = true
oag-thread.workspace = true
anyhow.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
wgpu.workspace = true
serde.workspace = true
log.workspace = true
pollster.workspace = true

# The opt-in ASTC re-encode of block textures on a device without BC
# (`mesh_render::astc`): ARM's astcenc, vendored and built by `cc` (Apache-2.0;
# the binding is MIT OR Apache-2.0 OR Zlib). Its build script supports these two
# architectures only, so the web build and any other target go without.
[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
ctt-astcenc = "0.6.1"
sha2 = "0.11"
oag-io.workspace = true

[build-dependencies]
oag-shader-check.workspace = true

[features]
perf-probe = ["oag-gpu/perf-probe"]

[lints]
workspace = true

[dev-dependencies]
oag-testdata.workspace = true

[[test]]
name = "it"
path = "tests/it.rs"
