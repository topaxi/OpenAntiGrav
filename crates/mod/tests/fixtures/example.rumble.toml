# An invented pattern, for the tests and the schema gate: nothing from a disc.
[toml-schema]
location = "https://oag.topaxi.com/mods/schemas/v1/rumble.tosd"
version = "1.0.0"

[pattern]
type = "Looping"
class = "UI"
priority = "High"
loop = [1, 3]

[pattern.positional]
fall_off_inner = 30
fall_off_outer = 20.5

[tracks]
large = [9, 8, 7, 6]
small = [1, 0, 1]
