[package]
name = "oag-ui"
description = "The front end: boot movies, menus, the HUD's font, and the strings a screen draws"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# `oag_render`, `wgpu`, `winit` and `oag_input` are all legal here in principle -
# menus draw, so this crate may one day link a renderer directly - but nothing
# below draws today; every one of these is read-only vocabulary or a pure
# state machine. See `NOT_TITLE_PACKAGES` in `scripts/check-dependency-rules.py`
# for why this crate is classified there rather than as a gameplay crate: the
# classification is what makes linking a renderer *legal* here without ever
# becoming legal for anything gameplay depends on.
[dependencies]
# Reads a title's language plugins and string tables out of its archives: `language::load`.
oag-assets.workspace = true
anyhow.workspace = true
# `backdrop::Fury`'s path picker draws from the seeded `Rng`, so a capture at
# a given seed is the same picture twice.
oag-core.workspace = true
oag-display.workspace = true
# Only for the boot sequence's title fallback and its front-end table, the same
# reason `oag-game` carries it: a Pure disc's intro and menu have to be
# reachable through the same [`frontend::Frontend`] Pulse uses. See roadmap M8.
oag-2048.workspace = true
oag-hd.workspace = true
oag-pulse.workspace = true
oag-pure.workspace = true
# `menu::mode_label` falls back to `oag_race::Mode::fallback_label` and offers
# every mode a race allows - the vocabulary a menu row picks from, not the
# simulation itself.
oag-race.workspace = true
oag-tables.workspace = true
oag-texture.workspace = true
oag-title.workspace = true
# `frontend::draw::Sprite`'s blend field names `oag_vex::vex::BlendClass`: the
# blend mode a `.vex` material authors, which a menu widget can share without
# this crate reading a `.vex` file itself.
oag-vex.workspace = true
serde.workspace = true
# `menu::definition::Error` and `strings::File` parse errors both derive it.
thiserror.workspace = true
# `menu::definition::raw` reads a menu page straight off `toml::Value`, ahead
# of its own typed shape - see that module's own doc for why.
toml.workspace = true

[lints]
workspace = true

[dev-dependencies]
# `tests/menu_layout_ground_truth.rs` reads a real archive off a disc image.
oag-testdata.workspace = true
