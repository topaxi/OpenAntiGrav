[package]
name = "oag-tables"
description = "The tables Wipeout titles author as XML: handling, weapons, campaign grids, load manifests, lighting rigs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# No dependencies at all, and that is the point of the crate. The numbers that
# tune a race are parsed from text; nothing here reads an archive, a byte order
# or a pixel. See
# docs/architecture/adr/0050-format-crates-split-by-format-family.md.
[dependencies]

# Ground-truth tests read the real tables out of a disc image. These are
# dev-dependencies only: the library itself knows nothing about discs.
#
# `oag-assets`, `oag-pulse` and `oag-pure` all depend back on this crate, so
# these lines close a cycle. Cargo permits it - a dev-dependency edge is not
# part of the normal dependency graph, so the library still builds on its own -
# and `scripts/check-dependency-rules.py` walks only normal edges, so the
# boundary gate is unaffected. What they buy is that a sweep does not have to
# hard-code where a release keeps its archives: `oag_pulse::open`/`oag_pure::open`
# find them on a PSP or a PS2 pressing alike, which is exactly what a
# corpus-wide measurement needs.
#
# `oag-formats` is here for the same reason and not as a layering exception:
# a `handlingstats.xml` has to be pulled out of a WAD before it can be parsed,
# and pulling it out is `oag-formats`' job, not this crate's.
[dev-dependencies]
oag-testdata.workspace = true
oag-assets.workspace = true
oag-disc.workspace = true
oag-formats.workspace = true
oag-pulse.workspace = true
oag-pure.workspace = true
oag-hd.workspace = true

[lints]
workspace = true
