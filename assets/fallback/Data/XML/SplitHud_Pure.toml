# This project's split-screen HUD for Wipeout Pure: where each group of the title's own
# widgets goes inside one view. Read by oag_hud::split_hud through the fallback asset
# layer (docs/architecture/asset-layers.md); a file of the same name in
# overrides/wipeout-pure/Data/XML/ replaces it.
#
# CHOSEN, NOT MEASURED. The original's split screen has not been read, so every anchor,
# offset and scale below is this project's choice, made for legibility at the size a
# player sees a view. It places Pure's own widgets (its text and its weapon icons, which
# the title authors as models) and draws no art of its own. A widget no group names is
# not drawn in a split. Groups sit at the corners the whole-screen layout puts them in:
# lap bottom left, time top left, place top right, speed bottom right, the held weapon at
# the bottom centre.
#
# Units: `offset` is a fraction of the view's width and height from the view's own
# `anchor` point; `scale` 1.0 is the whole-screen HUD scaled to fit the view.
#
# The weapon grid is a model, which the loader bounds by its centre point alone, so each
# rule's offset is what clears it: half the grid's height at that rule's scale and its
# widest view, plus the 0.04 the corner groups sit in from the bottom edge. The grid is about
# 39 units tall on the 272-unit screen (read off a render: 67 pixels at scale 1.3 in a
# 358-pixel row), so a view of width over height `a` shows it 39 * scale * min(a / 1.765, 1) /
# 272 of its height. Chosen, not measured.
#
# The first layout whose `views`, `aspect` (a view's width over height, [min, max)) and
# `modes` all fit the view answers it.

[toml-schema]
location = "https://oag.topaxi.com/mods/schemas/v1/split-hud.tosd"
version = "1.0.0"

# Two views cut left and right: each one a tall column, about 0.9:1 at 16:9, 1.2 at 21:9.
# Its own rule so that the lower rows of seven and eight views, which share the shape, keep
# theirs. Keyed on two views and a shape under 1.4:1, so a 21:9 screen's columns read it too
# and a horizontal pair never does. The corners of `portrait`, with the weapon grid raised:
# the loader pins a model by its centre point alone, so the grid's lower half would hang
# below the view at the usual offset.
[[layout]]
name = "tall"
views = [2]
aspect = [0.0, 1.4]

[[layout.group]]
widgets = ["SpeedL", "SpeedR"]
anchor = "bottom-right"
offset = [-0.03, -0.04]
scale = 1.6

[[layout.group]]
widgets = ["Lap*"]
anchor = "bottom-left"
offset = [0.03, -0.04]
scale = 1.6

[[layout.group]]
widgets = ["CurrentTime*", "Score", "ScoreTxt"]
anchor = "top-left"
offset = [0.03, 0.04]
scale = 1.6

[[layout.group]]
widgets = ["Position*", "Zone", "ZoneTxt"]
anchor = "top-right"
offset = [-0.03, 0.04]
scale = 1.6

[[layout.group]]
widgets = ["ROCKET_icon", "MISSILE_icon", "QUAKE_icon", "DISRUPTOR_icon", "TURBO_icon", "SHIELD_icon", "AUTOPILOT_icon", "PLASMA_icon", "MINE_icon", "BOMB_icon", "weapon_icon_grid"]
anchor = "bottom"
offset = [0.0, -0.1]
scale = 1.4

[[layout.group]]
widgets = ["Info*", "TimeDiff*", "WrongWay"]
anchor = "centre"
offset = [0.0, 0.0]
scale = 1.2


# The same columns on a screen wider than 21:9 (3:1, 32:9): a column squarer than 1.4:1. The
# grid is height-bound from 1.765 up (the whole-screen HUD is fitted to the view's height, not
# its width), so it no longer shrinks with the column and `tall`'s -0.1 leaves it touching the
# bottom edge at 1.78, lower than the corner groups beside it and than it sits at 21:9. Only
# the grid's offset differs from `tall`: half its height at scale 1.4 and the full height fit
# (0.5 * 39 * 1.4 / 272 = 0.100) plus the 0.04 the corner groups keep, so -0.14. The rule set
# has no way to say "depends on aspect" inside one rule, so this is the same rule again from
# 1.4 up. Chosen, not measured. A rule below 1.4 and one from 1.4 up cover every two-view
# column.
[[layout]]
name = "tall-wide"
views = [2]
aspect = [1.4, 2.4]

[[layout.group]]
widgets = ["SpeedL", "SpeedR"]
anchor = "bottom-right"
offset = [-0.03, -0.04]
scale = 1.6

[[layout.group]]
widgets = ["Lap*"]
anchor = "bottom-left"
offset = [0.03, -0.04]
scale = 1.6

[[layout.group]]
widgets = ["CurrentTime*", "Score", "ScoreTxt"]
anchor = "top-left"
offset = [0.03, 0.04]
scale = 1.6

[[layout.group]]
widgets = ["Position*", "Zone", "ZoneTxt"]
anchor = "top-right"
offset = [-0.03, 0.04]
scale = 1.6

[[layout.group]]
widgets = ["ROCKET_icon", "MISSILE_icon", "QUAKE_icon", "DISRUPTOR_icon", "TURBO_icon", "SHIELD_icon", "AUTOPILOT_icon", "PLASMA_icon", "MINE_icon", "BOMB_icon", "weapon_icon_grid"]
anchor = "bottom"
offset = [0.0, -0.14]
scale = 1.4

[[layout.group]]
widgets = ["Info*", "TimeDiff*", "WrongWay"]
anchor = "centre"
offset = [0.0, 0.0]
scale = 1.2


