# This project's split-screen HUD for Wipeout Pulse (PSP and PS2): where each group of
# the title's own widgets goes inside one view. Read by oag_hud::split_hud through the
# fallback asset layer (docs/architecture/asset-layers.md); a file of the same name in
# overrides/wipeout-pulse/Data/XML/ replaces it.
#
# CHOSEN, NOT MEASURED. The original's split screen has not been read, so every anchor,
# offset and scale below is this project's choice, made for legibility at the size a
# player sees a view: compact, the lap, place, speed, shield and held weapon first.
# It places Pulse's own widgets and draws no art of its own. A widget no group names
# is not drawn in a split.
#
# Units: `offset` is a fraction of the view's width and height from the view's own
# `anchor` point; `scale` 1.0 is the whole-screen HUD scaled to fit the view. The group's
# bounding box, as the layout authors it, is pinned at `anchor`.
#
# The first layout whose `views`, `aspect` (a view's width over height, [min, max)) and
# `modes` all fit the view answers it, so a screen of three or five views, whose views
# differ in shape, uses a different layout for each.

[toml-schema]
location = "https://oag.topaxi.com/mods/schemas/v1/split-hud.tosd"
version = "1.0.0"

# Two views, or any strip wider than 2.4:1: room to the sides, so the groups sit at the corners.
[[layout]]
name = "strip"
aspect = [2.4, 99.0]

[[layout.group]]
widgets = ["SpeedBar*", "ShieldBar*"]
anchor = "bottom-right"
offset = [-0.012, -0.04]
scale = 1.2

[[layout.group]]
widgets = ["Lap*"]
anchor = "top-left"
offset = [0.012, 0.04]
scale = 1.3

[[layout.group]]
widgets = ["CurrentTime*", "CountdownTime*", "BestTime*", "TimeIcon", "Score", "ScoreTxt"]
anchor = "bottom-left"
offset = [0.012, -0.04]
scale = 1.3

[[layout.group]]
widgets = ["Position*", "TotalTime*", "Zone", "ZoneTxt"]
anchor = "top-right"
offset = [-0.012, 0.04]
scale = 1.3

[[layout.group]]
widgets = ["PickupBackground", "ShieldIcon", "AutopilotIcon", "CannonIcon", "RocketIcon", "BombIcon", "QuakeIcon", "MineIcon", "PlasmaIcon", "MissileIcon", "TurboIcon", "LeachBeamIcon", "RepulserIcon", "ShurikenIcon", "SpeedClass", "SpeedClassTxt"]
anchor = "top"
offset = [0.0, 0.04]
scale = 1.4

[[layout.group]]
widgets = ["Info*", "TimeDiff*", "WrongWay"]
anchor = "centre"
offset = [0.0, 0.0]
scale = 1.2

[[layout.group]]
widgets = ["AssistIndicatorBG", "AssistIndicatorMain", "AssistIndicatorLeft", "AssistIndicatorRight"]
anchor = "bottom"
offset = [0.0, -0.04]
scale = 1.2

[[layout.group]]
widgets = ["KillsText", "PosTag*", "HeadToHeadBar"]
anchor = "right"
offset = [-0.012, 0.0]
scale = 1.2


# Views a little wider than tall to a little wider than the screen: four views, the
# larger views of three or five.
[[layout]]
name = "landscape"
aspect = [1.4, 2.4]

[[layout.group]]
widgets = ["SpeedBar*", "ShieldBar*"]
anchor = "bottom-right"
offset = [-0.015, -0.04]
scale = 1.0

[[layout.group]]
widgets = ["Lap*"]
anchor = "top-left"
offset = [0.015, 0.04]
scale = 1.1

[[layout.group]]
widgets = ["CurrentTime*", "CountdownTime*", "BestTime*", "TimeIcon", "Score", "ScoreTxt"]
anchor = "bottom-left"
offset = [0.015, -0.04]
scale = 1.0

[[layout.group]]
widgets = ["Position*", "TotalTime*", "Zone", "ZoneTxt"]
anchor = "top-right"
offset = [-0.015, 0.04]
scale = 1.1

[[layout.group]]
widgets = ["PickupBackground", "ShieldIcon", "AutopilotIcon", "CannonIcon", "RocketIcon", "BombIcon", "QuakeIcon", "MineIcon", "PlasmaIcon", "MissileIcon", "TurboIcon", "LeachBeamIcon", "RepulserIcon", "ShurikenIcon", "SpeedClass", "SpeedClassTxt"]
anchor = "top"
offset = [0.0, 0.04]
scale = 1.0

[[layout.group]]
widgets = ["Info*", "TimeDiff*", "WrongWay"]
anchor = "centre"
offset = [0.0, 0.0]
scale = 1.0

[[layout.group]]
widgets = ["AssistIndicatorBG", "AssistIndicatorMain", "AssistIndicatorLeft", "AssistIndicatorRight"]
anchor = "bottom"
offset = [0.0, -0.04]
scale = 1.0

[[layout.group]]
widgets = ["KillsText", "PosTag*", "HeadToHeadBar"]
anchor = "right"
offset = [-0.015, 0.0]
scale = 0.95


# Squarer and smaller views: the small views of five to seven.
[[layout]]
name = "square"
aspect = [1.0, 1.4]

[[layout.group]]
widgets = ["SpeedBar*", "ShieldBar*"]
anchor = "bottom-right"
offset = [-0.02, -0.04]
scale = 1.2

[[layout.group]]
widgets = ["Lap*"]
anchor = "top-left"
offset = [0.02, 0.04]
scale = 1.3

[[layout.group]]
widgets = ["CurrentTime", "CurrentTimeTxt", "CountdownTime*", "Score", "ScoreTxt"]
anchor = "bottom-left"
offset = [0.02, -0.04]
scale = 1.2

[[layout.group]]
widgets = ["Position*", "TotalTime*", "Zone", "ZoneTxt"]
anchor = "top-right"
offset = [-0.02, 0.04]
scale = 1.3

[[layout.group]]
widgets = ["PickupBackground", "ShieldIcon", "AutopilotIcon", "CannonIcon", "RocketIcon", "BombIcon", "QuakeIcon", "MineIcon", "PlasmaIcon", "MissileIcon", "TurboIcon", "LeachBeamIcon", "RepulserIcon", "ShurikenIcon", "SpeedClass", "SpeedClassTxt"]
anchor = "top"
offset = [0.0, 0.04]
scale = 1.2

[[layout.group]]
widgets = ["Info*", "TimeDiff*", "WrongWay"]
anchor = "centre"
offset = [0.0, 0.0]
scale = 1.1

[[layout.group]]
widgets = ["KillsText", "PosTag*", "HeadToHeadBar"]
anchor = "right"
offset = [-0.02, 0.0]
scale = 0.8


# Taller than wide: the small views of seven and eight. Lap, place, time, speed,
# shield and the held weapon only.
[[layout]]
name = "portrait"
aspect = [0.0, 1.0]

[[layout.group]]
widgets = ["SpeedBar*", "ShieldBar*"]
anchor = "bottom-right"
offset = [-0.03, -0.04]
scale = 1.5

[[layout.group]]
widgets = ["Lap*"]
anchor = "top-left"
offset = [0.03, 0.04]
scale = 1.6

[[layout.group]]
widgets = ["CurrentTime", "CurrentTimeTxt", "CountdownTime*", "Score", "ScoreTxt"]
anchor = "bottom-left"
offset = [0.03, -0.04]
scale = 1.5

[[layout.group]]
widgets = ["Position*", "TotalTime*", "Zone", "ZoneTxt"]
anchor = "top-right"
offset = [-0.03, 0.04]
scale = 1.6

[[layout.group]]
widgets = ["PickupBackground", "ShieldIcon", "AutopilotIcon", "CannonIcon", "RocketIcon", "BombIcon", "QuakeIcon", "MineIcon", "PlasmaIcon", "MissileIcon", "TurboIcon", "LeachBeamIcon", "RepulserIcon", "ShurikenIcon", "SpeedClass", "SpeedClassTxt"]
anchor = "top"
offset = [0.0, 0.04]
scale = 1.4

[[layout.group]]
widgets = ["Info*", "TimeDiff*", "WrongWay"]
anchor = "centre"
offset = [0.0, 0.0]
scale = 1.2

