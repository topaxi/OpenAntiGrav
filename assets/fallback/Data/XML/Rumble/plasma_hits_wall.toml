# Wipeout Pulse and Pure rumble: plasma strikes a wall: a heavy burst that fades with distance.
# Read through the fallback asset layer; a disc pattern of the same name wins, and a file
# in overrides/<title>/Data/XML/Rumble/ replaces this one.

[toml-schema]
location = "https://oag.topaxi.com/mods/schemas/v1/rumble.tosd"
version = "1.0.0"

[pattern]
type = "OneShot"
class = "Game"
priority = "Medium"

[pattern.positional]
fall_off_inner = 20
fall_off_outer = 10

[tracks]
large = [255, 255, 240, 215, 190, 165, 145, 125, 105, 90, 75, 60, 48, 36, 26, 18, 10, 4]
small = [1, 1, 1, 0, 0, 0, 1, 0]
