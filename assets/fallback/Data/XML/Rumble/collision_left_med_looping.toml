# Wipeout Pulse and Pure rumble: a firm scrape on the left: a steady grind.
# Read through the fallback asset layer; a disc pattern of the same name wins, and a file
# in overrides/<title>/Data/XML/Rumble/ replaces this one.

[toml-schema]
location = "https://oag.topaxi.com/mods/schemas/v1/rumble.tosd"
version = "1.0.0"

[pattern]
type = "Looping"
class = "Game"
priority = "High"
loop = [1, 7]

[tracks]
large = [210, 215, 205, 210, 200, 205, 195, 200]
small = [1, 0, 0, 1]
