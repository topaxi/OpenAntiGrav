# Our own rocket impact on a craft, played by `graphics.own_rockets` on Pulse and
# Pure in place of the disc's blast (docs/rendering/own-rockets.md): a flash, a fireball, sparks
# and smoke that lingers. Units: ticks (60 a second), world units per tick, degrees.
# Format: docs/formats/mod-effect.md. A texture is a fallback-layer entry of ours
# (scripts/gen-fallback-rocket-art.py).

toml-schema = { location = "https://oag.topaxi.com/mods/schemas/v1/effect.tosd", version = "1.0.0" }

axis = "up"

[[emitter]]
name = "flash"
duration = 1
per-emission = 1
lifetime = [8, 0]
size = [[0.0, 3.0], [0.25, 13.0], [1.0, 16.0]]
alpha = [[0.0, 1.0], [0.3, 0.6], [1.0, 0.0]]
colour = [[0.0, "#fffbe8"], [0.4, "#ffc050"], [1.0, "#ff6a18"]]

[[emitter]]
name = "fireball"
duration = 4
per-emission = [8, 10]
lifetime = [26, 8]
speed = [1.0, 0.8]
spread = 80
drag = 0.9
gravity = 0.002
live-cap = 48
size = [[0.0, 2.2], [0.3, 6.0], [1.0, 8.0]]
alpha = [[0.0, 1.0], [0.4, 0.8], [1.0, 0.0]]
colour = [[0.0, "#ffe890"], [0.2, "#ff9818"], [0.6, "#e8480a"], [1.0, "#6a1402"]]
texture = "Data\\Psys\\Tex\\OAGRocketPuff3.oagmask"

# The white-hot heart of the blast.
