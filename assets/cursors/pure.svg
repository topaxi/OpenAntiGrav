<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 32" width="24" height="32">
  <!-- Wipeout Pure: its own ArrowSelect pink filled, the selected row's cyan
       for the edge, rounded the way Pure's front end is softer than Pulse's,
       and a white rim so it reads on the white its picker sits on. Ours. -->
  <polygon fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"
           points="2,2 2,21.5 6.5,17.5 10,25.5 14,23.5 10.5,15.5 17,15.5"/>
  <polygon fill="#ED4796" stroke="#16AED1" stroke-width="1.5" stroke-linejoin="round"
           points="2,2 2,21.5 6.5,17.5 10,25.5 14,23.5 10.5,15.5 17,15.5"/>
  <polygon fill="#FFFFFF" fill-opacity="0.55" points="4,5 4,11 8,15 9.5,13.5"/>
</svg>
