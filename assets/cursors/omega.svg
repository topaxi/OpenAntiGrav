<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 32" width="24" height="32">
  <!-- Wipeout: Omega Collection. Ours, like every cursor in this directory -
       nothing in this lineage was authored for a mouse. Palette borrowed
       from Omega's own skin.xml, read directly out of data09.psarc:
       DesignColor #5FDBF6 ("the main colour in the default skin", the disc's
       own comment) as the fill, MenuHighLightArrowColor #ED4796 (the pink
       highlight arrow colour, also the disc's own comment) as the tip
       accent, and TitleColor #646464 for the offset shadow block every
       other cursor in this set carries. Same 24x32 box, same top-left
       hotspot as the rest. -->
  <polygon fill="#646464" fill-opacity="0.8"
           points="4.5,5 4.5,25 9,21 12.5,29 16.5,27 13,19 17.5,19 19,17.5"/>
  <polygon fill="#5FDBF6" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="miter"
           points="1.5,2 1.5,22 6,18 9.5,26 13.5,24 10,16 14.5,16 16,14.5"/>
  <polygon fill="#ED4796" fill-opacity="0.85" points="3.5,5 3.5,11 8,15.5 9.5,14"/>
</svg>
