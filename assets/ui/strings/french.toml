# The French translation of this project's own UI strings - see
# `assets/ui/strings/english.toml`'s own doc comment for the shared
# convention, and `crates/game/src/strings.rs`'s module doc for how this file
# is found and loaded (`strings::built_in`, matched against the disc's own
# `French` language plugin by `Language::name`).
#
# This is the first real second-language file this project ships, and the
# first real exercise of the `[untranslated]` convention below. Every id
# either has real French text under `[strings]`, or is named under
# `[untranslated]` - never both, and never omitted. `just check-strings`
# (`scripts/check-strings.py`) enforces both halves of that.
#
# **Machine translation is allowed, and marked.** Every entry is
# `ID = { text = "...", human = false }`; `human` is `true` only when a human
# wrote or approved the text, and none of this file's have been (each was added
# in a commit with a Claude `Co-Authored-By` trailer). The deferrals below were
# a 2026-09 choice to prefer an honest gap over an unreviewed guess; the
# 2026-10-06 rule lets a model fill them, flagged, and they stay open only
# because nobody has done it yet.
#
# # What is translated and what is deferred, and why
#
# Every id here was translated with real confidence: menu nouns and short
# verbs, the RACE/REMIX/CONTROLS vocabulary, the pilot editor's CRUD rows,
# and the loading screen's prose. Deferred to `[untranslated]` instead,
# rather than guessed at:
#
#   - **PC-specific graphics/display jargon** (`VSYNC`, `MSAA`,
#     `RECONSTRUCTION`, `UPSCALER SHARPNESS`, `RENDERER`, `RENDER SCALE`,
#     `TARGET FPS`, `FRAME LIMIT`, `BOOST FOV KICK`, `PERFORMANCE OVERLAY`,
#     `FRONT END STYLE`) - conventions vary enough between French game UIs
#     that a confident single answer is not available without playing a
#     shipped French PC game that has the same settings screen to check
#     against.
#   - **`SIDESHIFT`** - Wipeout's own jargon for a lateral-thrust manoeuvre;
#     no French Wipeout release was checked for how (or whether) it
#     translated the word, so it stays named rather than guessed.
#   - **Every prose string carrying a `%s`/button-glyph substitution**
#     (`OAG_BINDING_CAPTURE_PROMPT`, `OAG_KEYBOARD_HINT`,
#     `OAG_PILOT_NAME_TAKEN`, `OAG_PILOT_RENAME_SHADOWS`,
#     `OAG_PILOT_DELETE_ASK`, `OAG_PILOT_DELETE_BUILT_IN`) and the three
#     long key-hint sentences (`OAG_HINTS_MENU_KEYS`, `OAG_HINTS_SHELL_KEYS`,
#     `OAG_HINTS_RACE_KEYS`) - long enough, and specific enough about button
#     names and sentence structure, that a wrong translation would be worse
#     than an honest gap and harder for a reviewer who does not read French
#     to catch.
#   - **`OAG_HINTS_ESC_TO_MENU`/`OAG_HINTS_ESC_QUITS`** - each is a suffix
#     `crates/game/src/main/hints.rs` appends onto one of the three deferred
#     key-hint sentences above (`esc_to_menu`/`esc_quits` are called right
#     after `race_keys`/`shell_keys`); translating the suffix alone while its
#     sentence stays English would read as broken French, not as progress.
#
# See `docs/architecture/frontend-boot.md` for how this file reaches the
# screen: `strings::built_in` embeds it, `strings::overlay`/
# `strings::project_table` merge it, and `boot::load_strings` calls
# `overlay` after reading the disc's own `entries.xml`.

