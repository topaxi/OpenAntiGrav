# Brazilian Portuguese: this project's own UI strings. Same id space and shape as
# `english.toml` - see its header and `crates/ui/src/strings.rs`.
#
# **Every entry is `human = false`**: written by a model, not reviewed by a
# native speaker. The wording is matched to the terms Wipeout Omega's own
# on-disc `portuguesebr` table uses (NAVE, EQUIPE, VOLTA, ARMAS, CONTROLES,
# OPÇÕES, VOLTAR, ...) so the same word names the same thing across titles; the
# sentences are this project's own.
#
# The file is named after the language's own name, `PortugueseBR`, which is
# what Omega's disc plugin calls itself (`portuguesebr`) - one name, one saved
# setting, on every title. Every id of `english.toml` is translated, so there
# is no `[untranslated]` table here.
#
# The disc's own text (idstrings) is not in this file: the per-title
# translations of it live under `assets/ui/strings/disc/`.

