# German: this project's own UI strings. Same id space and shape as
# `english.toml` - see its header and `crates/ui/src/strings.rs`. Only this
# project's invented `OAG_` ids live here: the disc's own German table is read
# as the disc ships it, and `assets/ui/strings/disc/<namespace>/german.toml`
# only fills the few disc ids that table leaves empty.
#
# **Every entry is `human = false`**: machine-written, not reviewed by a native
# speaker. The wording is matched to the terms the discs' own German tables use
# (RENNKAMPAGNE, RENNBOX, REKORDE, OPTIONEN, STEUERUNG, TEMPOKLASSE, WAFFEN, OBJEKT,
# STRECKE, SCHIFF, ABSCHÜSSE, LUFTBREMSE, SCHUB, BEWEGUNGSUNSCHÄRFE,
# EMPFINDLICHKEIT (...), SEITLICHE BEWEGUNG for a sideshift); the sentences are
# this project's own. Capitals use SS for a sharp s, as the title text is
# upper-case and the discs' faces have no capital sharp s. "Sie/du": the discs
# address the player as "du".
#
# Every id of `english.toml` is translated, so there is no `[untranslated]`
# table. `%s`, `{done}`, `{total}`, `{cached}` and `{failed}` are substitution
# slots and stay as written.

