Tut_MP_FE_Overlay = { text = "A Campanha Multijogador é diferente da Campanha Solo: os nós que a formam não são eventos, e sim objetivos. Os objetivos podem ser cumpridos em qualquer pista, em qualquer evento multijogador.\nVocê sempre progride na Campanha Multijogador: depois de três tentativas em qualquer objetivo, você ganha a chance de liberar o próximo. Se possível, ao iniciar um jogo multijogador você entra automaticamente em um lobby com seus amigos.\nBoa sorte!", human = false }
