# Brazilian Portuguese: this project's own translation of Wipeout 2048's disc
# text, keyed by 2048's own idstrings (`FE_MM`, `BADGE_NAME_BOMBER`, ...). Read
# only by a title whose front end names the `2048` namespace
# (`oag_title::FrontEnd::disc_strings`), and laid over the disc's own English
# (American on the USA pressing) table, so an id this file does not carry reads
# the disc's own base text.
#
# **Every entry is `human = false`**: written by a model, not reviewed by a
# native speaker. These are this project's own sentences, keyed by the disc's
# ids; no line of the disc's text is copied here (docs/overview/legal.md).
# Terminology follows Wipeout Omega's own on-disc `portuguesebr` table (NAVE,
# EQUIPE, VOLTA, ZONA, ELIMINATÓRIA, TORNEIO, ARMAS, COLETÁVEL, FREIO AÉREO,
# RANQUE, LEALDADE, LOBBY, skin, ...).
#
# Left out on purpose, so they read as the disc writes them: team, ship, track,
# grid and music proper names, button glyphs, unit labels (KMH, MPH, MACH),
# other-region legal notices, the font test string, rows whose empty disc text
# stays empty, circuit names (`NN_TRACK`) and a handful of words that read the
# same in both languages.

[strings]

