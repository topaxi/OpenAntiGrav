Tut_Proto_Event_AG_Systems_0 = { text = "Desafio da Nave Protótipo da AG-Systems", human = false }
Tut_Proto_Event_AG_Systems_1 = { text = "A nave Protótipo da AG-Systems tem um barrel roll duplo que dá um impulso extra de velocidade ao pousar, enquanto sua capacidade extrema de curva e seus super deslocamentos laterais realmente puxam você pelas curvas.  Você ainda pode fazer o giro de combate nas corridas, causando estragos em qualquer oponente atrás de você.  Vença esta corrida para liberar a nave.", human = false }
Tut_Proto_Event_Auricom_0 = { text = "Desafio da Nave Protótipo da Auricom", human = false }
Tut_Proto_Event_Auricom_1 = { text = "A nave Protótipo da Auricom é tão massiva que seus oponentes terão dificuldade para tirar você da sua linha e, com um sistema de vitalidade regenerativo, você poderá intimidar os adversários com facilidade.  Vença este evento de combate para liberar a nave.", human = false }
Tut_Proto_Event_Feisar_0 = { text = "Desafio da Nave Protótipo da Feisar", human = false }
Tut_Proto_Event_Feisar_1 = { text = "O Protótipo da Feisar começa mais lento que o resto do pelotão, mas passar por pontos de velocidade aumenta sua velocidade máxima muito acima da classe de velocidade declarada, até você cruzar a linha de largada/chegada.  Vença esta corrida para liberar a nave.", human = false }
Tut_Proto_Event_Pirhana_0 = { text = "Desafio da Nave Protótipo da Pir-Hana", human = false }
Tut_Proto_Event_Pirhana_1 = { text = "As alturas perigosas de Sol ficam ainda mais desafiadoras com a dirigibilidade extrema do Protótipo da Pir-Hana. Ele acelera automaticamente e só pode ser guiado pelos freios aéreos, mas sua velocidade máxima vale cada gota de esforço para domá-lo.  Vença este contra o relógio para liberar a nave.", human = false }
Tut_Proto_Event_Qirex_0 = { text = "Desafio da Nave Protótipo da Qirex", human = false }
Tut_Proto_Event_Qirex_1 = { text = "Embora você não possa pegar armas nos pontos, poderá abrir caminho pelo pelotão com o conjunto permanente de canhões ultrapoderosos do Protótipo da Qirex.  Vença este evento de combate para liberar a nave.", human = false }
Tut_Prototype_Ships_0 = { text = "NAVES PROTÓTIPO", human = false }
Tut_Prototype_Ships_1 = { text = "Toda Nave Protótipo é uma variante de um dos três tipos principais de nave: Combate, Velocidade ou Agilidade. Isso significa que ela pode ser aceita em um evento com restrição de tipo de nave.", human = false }
