Ship_AG_Systems_Agility_0 = { text = "Agilidade AG-Systems", human = false }
Ship_AG_Systems_Agility_Description_0 = { text = "O auge da tecnologia de agilidade da AG-Systems oferece uma dirigibilidade de tirar o fôlego, muito à frente da concorrência, com velocidade onde importa.", human = false }
Ship_AG_Systems_Fighter_0 = { text = "Combate AG-Systems", human = false }
Ship_AG_Systems_Fighter_Description_0 = { text = "A combinação de dirigibilidade afiadíssima com um arsenal pesado permite ao piloto cortar o pelotão sem esforço, eliminando os concorrentes um a um.", human = false }
Ship_AG_Systems_Prototype_0 = { text = "Protótipo AG-Systems", human = false }
Ship_AG_Systems_Prototype_Description_0 = { text = "Ao desviar a potência do motor da propulsão padrão para os freios aéreos, surgiu uma máquina que gira mais rápido do que acelera.  Com barrel rolls duplos, deslocamentos laterais ampliados e o 'Giro de Combate' nas corridas, esta nave é extremamente imprevisível para a concorrência.  Ninguém sabe o que as mudanças extremas de direção fazem com o piloto, mas dizem que a equipe AG-Systems consumiu um grande número de pilotos de teste neste protótipo.", human = false }
Ship_AG_Systems_Speed_0 = { text = "Velocidade AG-Systems", human = false }
Ship_AG_Systems_Speed_Description_0 = { text = "Esta nave mantém a agilidade pela qual a AG-Systems é famosa, dando atenção extra à velocidade máxima.", human = false }
Ship_Auricom_Agility_0 = { text = "Agilidade Auricom", human = false }
Ship_Auricom_Agility_Description_0 = { text = "Na variante Agilidade, os engenheiros da Auricom conseguiram injetar uma boa dose de poder de curva em seu design robusto, criando um pilotar equilibrado e suave.", human = false }
Ship_Auricom_Fighter_0 = { text = "Combate Auricom", human = false }
Ship_Auricom_Fighter_Description_0 = { text = "A variante de combate da Auricom tem uma capacidade de destruição sem igual entre as classes padrão.  A escolha ideal para quem aceita trocar um pouco de manobrabilidade por agressividade total.", human = false }
Ship_Auricom_Prototype_0 = { text = "Protótipo Auricom", human = false }
Ship_Auricom_Prototype_Description_0 = { text = "Os motores antigravidade desta nave conseguem manter a linha de corrida não importa o que a atinja.  Ela é totalmente imóvel e não pode ser desacelerada por outras naves ou armas.  Mas toda essa potência extra exige um chassi mais largo que o padrão, o que terá um efeito desconhecido na dirigibilidade.  A nave também abre mão da capacidade de coletar armas defensivas.", human = false }
Ship_Auricom_Speed_0 = { text = "Velocidade Auricom", human = false }
Ship_Auricom_Speed_Description_0 = { text = "Apesar do peso e do volume, a variante Velocidade da Auricom mostra seu valor na velocidade máxima, mantendo a resistência pela qual a Auricom é famosa.", human = false }
Ship_Feisar_Agility_0 = { text = "Agilidade Feisar", human = false }
Ship_Feisar_Agility_Description_0 = { text = "Já conhecida pela excelente dirigibilidade, a variante Agilidade sacrifica um pouco da velocidade máxima em troca de manobrabilidade extra.  Freios aéreos hiperdinâmicos tornam esta nave ideal para os circuitos mais técnicos.", human = false }
Ship_Feisar_Fighter_0 = { text = "Combate Feisar", human = false }
Ship_Feisar_Fighter_Description_0 = { text = "A Feisar de Combate mantém o jeito polivalente típico da equipe, mas com um soco a mais.  Esta variante de armas pesadas deve dar aos concorrentes uma surpresa desagradável para desacelerá-los nas retas.", human = false }
Ship_Feisar_Prototype_0 = { text = "Protótipo Feisar", human = false }
Ship_Feisar_Prototype_Description_0 = { text = "Experimentando um sistema de combustível que se carrega com os pontos de velocidade, esta Feisar tem velocidade máxima variável.  Ela começa mais lenta que o resto do pelotão, mas o motor recebe carga dos pontos de velocidade, o que dá um aumento de velocidade mais duradouro, superando a classe de velocidade declarada em qualquer corrida.  O que acontece exatamente na velocidade máxima ainda é desconhecido nesta fase. Este sistema de carga é zerado a cada nova volta e após colisões fortes.", human = false }
Ship_Feisar_Speed_0 = { text = "Velocidade Feisar", human = false }
Ship_Feisar_Speed_Description_0 = { text = "Com dirigibilidade sublime, esta nave é ideal para quem está começando no mundo de alta velocidade das corridas antigravidade.  Embora não seja a nave mais rápida do grid, você logo alcança a concorrência nas curvas.  Uma polivalente completa, a Feisar Velocidade não vai decepcionar você.", human = false }
Ship_Pirhana_Agility_0 = { text = "Agilidade Pir-hana", human = false }
Ship_Pirhana_Agility_Description_0 = { text = "Sacrificando parte da incrível velocidade que fez a Pir-Hana famosa, a equipe conseguiu produzir esta variante mais ágil de seu design clássico.", human = false }
Ship_Pirhana_Fighter_0 = { text = "Combate Pir-hana", human = false }
Ship_Pirhana_Fighter_Description_0 = { text = "A Pir-Hana está construindo uma reputação temível.  Unir velocidade incomparável a mais capacidade de armas criou um predador mortal nesta nave.", human = false }
Ship_Pirhana_Prototype_0 = { text = "Protótipo Pir-hana", human = false }
Ship_Pirhana_Prototype_Description_0 = { text = "Para ganhar velocidade extra, o chassi deste protótipo foi afinado a tal ponto que o piloto mal consegue respirar dentro da cabine.  É tão fino que não há espaço para a direção padrão nem para o módulo de aceleração, e o piloto precisa depender só dos freios aéreos para guiar e da aceleração automática.  Qualquer piloto de teste seria louco de chegar perto desta coisa.", human = false }
Ship_Pirhana_Prototype_Description_Alt_1 = { text = "Para ganhar velocidade extra, o chassi deste protótipo foi afinado a tal ponto que o piloto mal consegue respirar dentro da cabine.  É tão fino que não há espaço para a direção padrão, e o piloto precisa depender só dos freios aéreos para guiar.  Qualquer piloto de teste seria louco de chegar perto desta coisa.", human = false }
Ship_Pirhana_Prototype_Description_Alt_2 = { text = "Para ganhar velocidade extra, o chassi deste protótipo foi afinado a tal ponto que o piloto mal consegue respirar dentro da cabine.  É tão fino que não há espaço para o módulo de aceleração padrão, e o piloto precisa depender só da aceleração automática.  Qualquer piloto de teste seria louco de chegar perto desta coisa.", human = false }
Ship_Pirhana_Speed_0 = { text = "Velocidade Pir-hana", human = false }
Ship_Pirhana_Speed_Description_0 = { text = "O auge da engenharia de velocidade, a variante Velocidade da Pir-Hana não tem rival entre as classes padrão.  O que lhe falta em manobrabilidade ela compensa de sobra em potência bruta.", human = false }
Ship_Qirex_Agility_0 = { text = "Agilidade Qirex", human = false }
Ship_Qirex_Agility_Description_0 = { text = "Lindamente equilibrada, esta fera conta com um sistema experimental de freios aéreos, que dá manobrabilidade extra nas curvas sem abrir mão do status de peso-pesado.", human = false }
Ship_Qirex_Fighter_0 = { text = "Combate Qirex", human = false }
Ship_Qirex_Fighter_Description_0 = { text = "A construção sólida e robusta típica da Qirex, combinada com um arsenal pesado, resulta em uma das naves mais perigosas em operação atualmente.", human = false }
Ship_Qirex_Prototype_0 = { text = "Protótipo Qirex", human = false }
Ship_Qirex_Prototype_Description_0 = { text = "A equipe da Qirex removeu as baias de carga da nave e as trocou por um conjunto experimental de miniguns calibre .50.  Embora não possa coletar nenhuma outra arma, o protótipo da Qirex leva munição suficiente para qualquer tipo de evento, o que o torna uma das naves mais mortais que existem.", human = false }
Ship_Qirex_Speed_0 = { text = "Velocidade Qirex", human = false }
Ship_Qirex_Speed_Description_0 = { text = "Mantendo o chassi pesado e as vantagens de robustez e agressividade que o acompanham, a Qirex conseguiu produzir uma variante mais veloz de suas típicas naves-colosso.", human = false }
