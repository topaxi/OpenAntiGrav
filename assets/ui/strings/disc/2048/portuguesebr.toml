UPDATE_ANNOUNCEMENT = { text = "WipEout® HD - Atualização V1.30 - Novos recursos\n \nRANKING ONLINE\nAs corridas online agora rendem pontos para seu Ranque Online oficial. Os pontos são concedidos conforme a posição de chegada, a classe de velocidade e também o ranque dos seus concorrentes. \nA cada 5 níveis de ranque, um novo elemento é acrescentado ao seu reluzente emblema de Ranque. Há 50 ranques diferentes para percorrer, de Aprendiz a Lenda. \n\nTELA DE PÓDIO E EMBLEMAS ONLINE\nA nova tela de pódio mostra os três primeiros colocados depois de cada corrida ou torneio online. \nTerminando ou não entre os três primeiros, todo jogador tem a chance de receber um 'emblema online' em reconhecimento ao desempenho na corrida. Os emblemas não contam para o ranque online e existem só para você se gabar depois da corrida; há 33 emblemas no total.\n\nTELA DE EMBLEMAS \nA nova tela de 'Emblemas', no menu principal online, permite ver a qualquer momento seu 'Ranque Online' atual e os 'Emblemas' recebidos.\nTambém há uma nova seção de Ranque Online na tela de Recordes, que permite comparar seu 'Ranque Online' com o de todos os outros pilotos do WipEout® HD. \n\nMODO ESPECTADOR\nO modo espectador permite assistir a uma corrida online que já está em andamento. Isso só é possível se houver 7 ou menos jogadores na corrida. \nSe você escolher entrar em uma corrida em andamento, verá uma sobreposição com um ícone de apertar start; basta apertar start para assistir à corrida.\nNo modo espectador, você pode escolher entre 4 ângulos de câmera e selecionar a nave a observar com os botões L1 e R1.\nOutros jogos disponíveis são exibidos no modo espectador e podem ser acessados na hora com o botão triângulo.\n\nCONVITES PARA JOGOS\nVocê pode convidar um amigo para um jogo online com o botão R1 na tela do lobby. \nOs convites aparecem como as mensagens: uma janela no canto superior direito da tela.\nÉ possível ver o convite em qualquer tela relevante apertando o botão Select; ao aceitá-lo, você vai direto ao lobby para entrar com o amigo que convidou.\n\nAMIGOS JOGANDO AGORA\nO jogo também mostra quando você tem amigos já jogando WipEout® HD, tanto no menu principal quanto no menu principal online; basta apertar o botão Triângulo para entrar com eles na hora. \n\nOPÇÕES ADICIONAIS DE CONFIGURAÇÃO\nAdicionamos algumas opções extras às corridas online. Ao criar um jogo, agora você pode escolher: \nDicas de Armas no HUD Ligadas/Desligadas - se ligadas, o coletável atual dos oponentes aparece ao lado do nome deles no HUD\nOPONENTES - agora você pode criar um jogo com estas opções: \nPúblico - qualquer pessoa pode entrar no jogo.\nAmigos - só quem está na sua lista de amigos vê o jogo.\nSomente por convite - só quem você convidar poderá ver o jogo.\nBarrel Rolls Ligados/Desligados - permite ou proíbe o uso de barrel rolls.\nAssistência ao Piloto permitida Ligada/Desligada - quando desligada, quem estiver com a assistência ao piloto ligada terá o recurso desativado automaticamente ao entrar no lobby do seu jogo.\nNúmero de voltas - o mínimo depende da classe de velocidade escolhida; o máximo é 20.\n\nMUDANÇA NA VOLTA RÁPIDA\nAo jogar um evento de Volta Rápida, se você não gostar da sua volta, pode apertar select para invalidá-la e recuperar seu Impulso Turbo.", human = false }
