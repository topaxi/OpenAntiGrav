Post_Race_Fail_Tips_Absorb = { text = "Você pode manter a energia da nave no alto absorvendo as armas em vez de dispará-las.\nFique de olho na energia da nave e, se ela estiver baixa, aperte o botão CÍRCULO para absorver a arma que você carrega.", human = false }
Post_Race_Fail_Tips_Airbrakes = { text = "Usar bem os freios aéreos pode ser a chave do sucesso.\nUse os freios aéreos nas curvas para fazer curvas mais fechadas.\nVeja os controles no menu de pausa para saber mais sobre como fazer isso.", human = false }
Post_Race_Fail_Tips_Barrel_Rolls = { text = "Procure oportunidades para fazer barrel rolls.\nAperte ESQUERDA/DIREITA/ESQUERDA, ou o inverso, quando estiver no ar para tentar um barrel roll. Se der certo, você ganha um bem-vindo impulso de velocidade ao pousar. É uma ótima forma de tirar segundos valiosos dos seus tempos de volta.", human = false }
Post_Race_Fail_Tips_Combat_Spin = { text = "Se você estiver muito longe da ação nos eventos de Combate, toque o direcional analógico direito para cima para girar a nave no lugar e ficar virado para o lado oposto.\nUsar bem essa técnica pode fazer de você um piloto de combate devastador.", human = false }
Post_Race_Fail_Tips_Fire_Weapons = { text = "WipEout não é só corrida, também é luta.\nPegue armas nos Pontos de Armas e dispare contra seus oponentes para causar dano, atrasá-los e talvez até destruí-los.", human = false }
Post_Race_Fail_Tips_Pilot_Assist = { text = "Se você precisa de uma ajudinha para percorrer uma pista nova ou domar uma nave nova, pause o jogo e veja as opções de Assistência ao Piloto.\nVocê perde uma quantidade desprezível de velocidade máxima, mas, depois de se acostumar, deve perceber que raspa menos nas paredes.\nLembre-se: a Assistência ao Piloto é desativada automaticamente nos eventos de Zona.", human = false }
Post_Race_Fail_Tips_Ship = { text = "Escolher a nave certa para um evento pode fazer toda a diferença.\nDependendo do seu estilo de jogo, qualquer nave pode ser boa para correr, mas, se o evento não for uma Corrida, vale pensar em escolher uma nave com atributos e habilidades mais adequados.", human = false }
Post_Race_Fail_Tips_Sideshift = { text = "O deslocamento lateral é uma técnica avançada de corrida muito útil.\nToque duas vezes no freio aéreo na direção em que quer se deslocar e a nave faz o deslocamento lateral.\nPause o jogo e veja os controles para saber como usar o freio aéreo.", human = false }
Post_Race_Fail_Tips_Skillcuts = { text = "Fique de olho nos Atalhos de Habilidade.\nOs Atalhos de Habilidade são caminhos curtos que exigem alguma perícia para acessar ou percorrer.\nNem sempre são sinalizados, então fique atento. Procure-os à esquerda, à direita e até acima da sua cabeça.", human = false }
Post_Race_Fail_Tips_Speed_Pads = { text = "Não siga só pela linha fácil: passe por pontos de velocidade suficientes.\nSeja contra naves ou contra o relógio, acertar pontos de velocidade pode ser o fator decisivo entre o sucesso e o fracasso.", human = false }
