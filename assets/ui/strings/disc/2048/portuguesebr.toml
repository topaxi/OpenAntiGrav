BOOT_HEALTH_WARN_2 = { text = "AVISO: FOTOSSENSIBILIDADE/EPILEPSIA/CONVULSÕES\n\nUma parcela muito pequena de pessoas pode sofrer convulsões epilépticas ou desmaios ao ser exposta a certos padrões de luz ou luzes piscantes. A exposição a certos padrões ou fundos na tela de uma televisão, ou durante o uso de videogames, pode provocar convulsões epilépticas ou desmaios nessas pessoas. Essas condições podem desencadear sintomas ou convulsões epilépticas antes não detectados em pessoas sem histórico de convulsões ou epilepsia.\n\nSe você ou alguém da sua família tem epilepsia ou já teve convulsões de qualquer tipo, consulte um médico antes de jogar. INTERROMPA IMEDIATAMENTE o uso e consulte um médico antes de voltar a jogar se você ou seu filho sentirem qualquer um destes sintomas: tontura, alteração da visão, tremores nos olhos ou nos músculos, perda de consciência, desorientação, convulsões ou qualquer movimento involuntário.\n\nSÓ VOLTE A JOGAR COM A APROVAÇÃO DO SEU MÉDICO.\n\nComo usar videogames para reduzir a chance de uma convulsão:\n\n- Jogue em um local bem iluminado e fique o mais longe possível da tela da televisão.\n\n- Evite televisores de tela grande. Use a menor tela disponível.\n\n- Evite o uso prolongado do sistema PLAYSTATION®3. Faça uma pausa de 15 minutos a cada hora de jogo.\n\n- Evite jogar quando estiver cansado ou com sono.\n\nPare de usar o sistema imediatamente se sentir qualquer um destes sintomas: tontura, náusea ou sensação parecida com enjoo de movimento; desconforto ou dor nos olhos, ouvidos, mãos, braços ou qualquer outra parte do corpo. Se o problema persistir, consulte um médico.", human = false }
