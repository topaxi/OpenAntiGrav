Tut_Weapon_Autopilot_1 = { text = "Com o Piloto Automático ligado, a nave ativa um Escudo e segue uma rota ideal pela pista. Isso dá um descanso curto, mas bem-vindo, principalmente em trechos complicados da pista em alta velocidade.", human = false }
