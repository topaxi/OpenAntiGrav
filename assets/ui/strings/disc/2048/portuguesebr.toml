Tut_SP_FE_Overlay = { text = "Estamos no ano de 2048.\n\nBoas-vindas ao primeiro Campeonato de Corrida Antigravidade, aqui em Nova State City.\nToque nos nós para jogar os eventos. Siga o caminho principal para chegar à final ou vá com calma e complete os eventos laterais para liberar alguns extras pelo caminho.\n\nBoas-vindas ao Wipeout.", human = false }
