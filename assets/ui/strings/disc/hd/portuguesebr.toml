BOOT_HEALTH_WARN_2 = { text = "Jogue sempre em um ambiente bem iluminado. Faça pausas regulares, de 15 minutos a cada hora. Pare de jogar se sentir tontura, náusea, cansaço ou dor de cabeça.\n\nAlgumas pessoas são sensíveis a luzes piscantes ou tremulantes e a formas e padrões geométricos, podem ter uma condição epiléptica não detectada e sofrer convulsões epilépticas ao assistir televisão ou jogar videogames.\n\nConsulte seu médico antes de jogar videogames se você tem uma condição epiléptica e, imediatamente, se sentir qualquer um dos seguintes sintomas durante o jogo: alteração da visão, tremores musculares, outros movimentos involuntários, perda de consciência, confusão mental e/ou convulsões.", human = false }
