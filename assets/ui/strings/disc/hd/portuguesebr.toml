MAN_1_C = { text = "CAMPANHA", human = false }
MAN_1_CAM = { text = "A campanha do WipEout® HD é um percurso desafiador e completo por uma série de eventos. Cada evento tem uma grade de corridas únicas, com circuitos, classes de velocidade e tipos de corrida variados. Ganhe medalhas para acumular pontos e liberar mais corridas e novos eventos. Você pode mudar o nível de dificuldade das Corridas Únicas e dos Torneios.", human = false }
MAN_1_CAM_1 = { text = "A campanha do Wipeout® HD é uma extensa série de corridas organizadas em vários eventos. Cada evento é formado por células, e cada célula contém uma corrida única. Só um evento está liberado no início da campanha.", human = false }
MAN_1_CAM_2 = { text = "Destaque um dos eventos disponíveis e aperte o botão Confirmar para entrar nele.", human = false }
MAN_1_CAM_3 = { text = "Dentro do evento escolhido, destaque uma célula para ver os detalhes da corrida. Entre eles estão a classe de velocidade, o número de oponentes, a pista e as metas que você precisa cumprir para ganhar as medalhas de ouro, prata ou bronze.", human = false }
MAN_1_CAM_4 = { text = "Em uma Corrida Única ou Torneio, aperte o botão de Dificuldade da IA para ajustar o nível de dificuldade dos oponentes.", human = false }
MAN_1_CAM_5 = { text = "Aperte o botão Confirmar para abrir a tela de seleção de naves.  Escolha uma nave e aperte o botão Confirmar para começar a corrida!", human = false }
MAN_1_CAM_6 = { text = "Ganhar ouro, prata ou bronze em uma corrida libera as células vizinhas no evento.", human = false }
MAN_1_CR = { text = "Criar corrida: personalize uma corrida para até 8 jogadores. Depois de criar o jogo, você vai para o lobby. Conforme outras pessoas entram, elas aparecem no lobby. Como anfitrião, você pode iniciar a corrida.", human = false }
MAN_1_INV = { text = "Convites: se você é o anfitrião de um jogo online, pode enviar convites do lobby para seus amigos entrarem no seu jogo.  Se receber um convite, aceite-o seguindo as mensagens na tela.", human = false }
MAN_1_JR = { text = "Entrar em corrida: escolha em uma lista de corridas criadas por outras pessoas. Você pode filtrar a lista pelas suas preferências, como classe de velocidade ou tipo de corrida. Depois de entrar em uma corrida, você vai para o lobby com os outros jogadores, e o anfitrião inicia a corrida.", human = false }
MAN_1_O = { text = "ONLINE", human = false }
MAN_1_ONL = { text = "Entre na PLAYSTATION®Network e acesse os servidores online do WipEout® HD, com corridas para até 8 jogadores. Já online, você pode criar uma corrida para outros entrarem ou entrar em uma corrida existente.", human = false }
MAN_1_R = { text = "RACEBOX", human = false }
MAN_1_RB = { text = "O Racebox tem tudo o que você precisa para personalizar corridas de jogador solo. Escolha sua própria combinação de circuito, tipo de corrida e classe de velocidade, defina o nível de dificuldade da IA ou monte seus próprios torneios com até 12 corridas.", human = false }
MAN_1_RB_2 = { text = "No início, só 2 pistas estão disponíveis para correr.  Concluir eventos na Campanha libera pistas extras para você dominar.", human = false }
MAN_1_RB_3 = { text = "Quando as configurações da corrida estiverem do seu agrado, aperte o botão Confirmar para abrir a tela de seleção de pistas.", human = false }
MAN_1_RB_4 = { text = "Na tela de seleção de pistas, você encontra os detalhes do seu recorde atual na corrida, os melhores recordes dos seus amigos e o melhor recorde global.  Se escolheu um Torneio, você pode personalizar a lista de pistas.", human = false }
MAN_1_RB_5 = { text = "Escolha sua pista (ou monte sua lista de pistas) e aperte o botão Confirmar para abrir a tela de seleção de naves.  Escolha uma nave e aperte o botão Confirmar para começar a corrida.", human = false }
MAN_1_SPEC = { text = "Assistir a uma corrida: se você entrar no lobby de um jogo e a corrida já tiver começado, poderá entrar nela como espectador.  Quando a corrida terminar, você volta ao lobby com os outros jogadores.", human = false }
MAN_1_WEB = { text = "Visite www.wipeout-game.com para ver as últimas novidades e informações sobre tudo do WipEout® HD! Entre com seu ID da PLAYSTATION®Network para acessar estatísticas, rankings e outros conteúdos exclusivos!", human = false }
MAN_2_AB = { text = "Cada nave tem freios aéreos calibrados sob medida, para fazer curvas com o máximo de eficiência em alta velocidade. Acionar o freio aéreo esquerdo ou direito em uma curva fechada mantém a velocidade e aumenta a capacidade de virar. Domine os freios aéreos para melhorar seus tempos de volta e deixar a concorrência para trás.", human = false }
MAN_2_ABS = { text = "Em vez de disparar uma arma ou ativar um coletável, você pode absorvê-lo e recuperar parte da energia da nave. Cada item e arma devolve uma quantidade diferente de energia. Saber a hora de usar ou absorver seus coletáveis é uma estratégia essencial, que pode decidir entre ganhar ou perder corridas.", human = false }
MAN_2_ABSORBING = { text = "ABSORÇÃO", human = false }
MAN_2_AIRBRAKES = { text = "FREIOS AÉREOS", human = false }
MAN_2_BARREL_1 = { text = "Fazer um barrel roll gasta um pouco da energia da nave, mas, se for bem-sucedido, você ganha uma breve explosão de velocidade.  Não é possível fazer um barrel roll com a nave com pouca energia!", human = false }
MAN_2_BARREL_2 = { text = "Para fazer um barrel roll, espere a nave estar no ar depois de um salto:", human = false }
MAN_2_BARREL_3 = { text = "Mova rapidamente o direcional analógico esquerdo para esquerda-direita-esquerda ou direita-esquerda-direita", human = false }
MAN_2_BARREL_4 = { text = "Aperte rapidamente os botões direcionais esquerda-direita-esquerda ou direita-esquerda-direita", human = false }
MAN_2_BASSBOOST = { text = "REFORÇO DE GRAVES", human = false }
MAN_2_BB = { text = "Esta opção fica no menu de Opções de Áudio e deixa os graves da sua música mais intensos. Ela só está disponível com uma trilha sonora personalizada e quando você usa um sistema de som surround.", human = false }
MAN_2_BR = { text = "BARREL ROLL", human = false }
MAN_2_CUSTOMMUSIC = { text = "MÚSICA PERSONALIZADA", human = false }
MAN_2_GF = { text = "RECURSOS DO JOGO", human = false }
MAN_2_GHOSTSHIPS = { text = "NAVES FANTASMA", human = false }
MAN_2_GS = { text = "Durante as corridas dos eventos Contra o Relógio e Volta Rápida, seus melhores tempos de volta são salvos automaticamente como naves fantasma por circuito e classe de velocidade, e carregados automaticamente para você comparar seu desempenho nas próximas corridas. Você pode desligar a exibição das naves fantasma no menu Opções.", human = false }
MAN_2_MAGSTRIPS = { text = "TIRAS MAGNÉTICAS", human = false }
MAN_2_MP3 = { text = "Você pode tocar suas próprias músicas no WipEout® HD.  Antes de iniciar o jogo, abra a pasta Música no menu inicial do software do sistema e crie uma playlist com suas músicas favoritas.  O WipEout® HD aceita arquivos de música MP3 e AAC (3GP, M4A e MP4). No jogo, vá ao menu Opções, escolha Opções de Áudio e depois Playlist de Músicas.  Selecione a playlist que quer ouvir durante a corrida e escolha a reprodução sequencial ou aleatória.  Durante a corrida, você pode pular faixas no menu de pausa.", human = false }
MAN_2_MP3_1 = { text = "Você pode tocar suas próprias músicas no WipEout® HD.  Antes de iniciar o jogo, abra a pasta Música no menu inicial do software do sistema e crie uma playlist com suas músicas favoritas.  O WipEout® HD aceita arquivos de música MP3 e AAC (3GP, M4A e MP4).", human = false }
MAN_2_MP3_2 = { text = "No jogo, vá ao menu Opções, escolha Opções de Áudio e depois Playlist de Músicas. Selecione a playlist que quer ouvir durante a corrida e escolha a reprodução sequencial ou aleatória. Você pode selecionar álbuns (organizados por artista) e também playlists. Durante a corrida, você pode pular faixas no menu de pausa.", human = false }
MAN_2_MS = { text = "Alguns circuitos usam a avançada tecnologia de Tiras Magnéticas, que prende as naves à superfície da pista e permite que os pilotos naveguem e acelerem normalmente. As Tiras Magnéticas são perfeitas para exibir as mais novas curvas e reviravoltas do design de pistas, onde os pilotos desafiam a gravidade a velocidades vertiginosas.", human = false }
MAN_2_PA = { text = "A Assistência ao Piloto ajuda você a percorrer as pistas, corrigindo sua direção quando você chega perto demais das laterais.  Esse recurso fica no menu principal, em Opções, Jogo, ou no menu de pausa do jogo.", human = false }
MAN_2_PHOTOMODE = { text = "MODO FOTO", human = false }
MAN_2_PM = { text = "Durante qualquer corrida, pause o jogo e escolha a opção Modo Foto. Você escolhe qual nave será o foco da câmera e ajusta o ângulo da câmera, o nível de zoom e outros itens. Ao tirar a foto, ela é salva em formato JPEG na pasta Foto do menu inicial do software do sistema, na resolução em que o jogo está sendo exibido no momento.", human = false }
MAN_2_R = { text = "Até os melhores pilotos antigravidade às vezes se excedem e saem voando da pista depois de um salto alto ou de uma aceleração inesperada. Se isso acontecer com você, o serviço de resgate das Naves de Salvamento AG devolve sua nave à corrida; mas você perde segundos valiosos e terá de correr forte para compensar.", human = false }
MAN_2_RECOVERY = { text = "RESGATE", human = false }
MAN_2_SE = { text = "Sua nave tem uma quantidade limitada de energia, que diminui com colisões nas paredes da pista, em outras naves ou com armas. Na maioria das corridas, se a energia chegar a zero, a nave explode e você perde. Nos eventos Contra o Relógio e Volta Rápida, a energia da nave se recupera automaticamente.", human = false }
MAN_2_SHIPENERGY = { text = "ENERGIA DA NAVE", human = false }
MAN_2_SHIPLOYALTY = { text = "LEALDADE DA NAVE", human = false }
MAN_2_SIDESHIFT_1 = { text = "O deslocamento lateral move a nave para o lado, para evitar colisões com objetos bem à sua frente. Para fazer um deslocamento lateral, toque duas vezes no botão de freio aéreo esquerdo ou direito para ir à esquerda ou à direita.", human = false }
MAN_2_SIDESHIFT_2 = { text = "Para fazer um deslocamento lateral, toque duas vezes no botão de freio aéreo esquerdo ou direito para ir à esquerda ou à direita.", human = false }
MAN_2_SL = { text = "Cada corrida de que você participa rende pontos de lealdade para a nave usada nela. Acumule pontos de lealdade em cada nave para ganhar recompensas! Veja o medidor de lealdade na tela de seleção de naves e no fim de cada corrida para saber seu nível atual. Os pontos de lealdade ganhos em corridas online ficam guardados em nossos servidores e são transferidos para seu perfil no começo da sua próxima sessão online.", human = false }
MAN_2_SPL = { text = "O modo de tela dividida para dois jogadores está disponível no Racebox. No Racebox, defina o número de jogadores como 2 e escolha entre tela dividida vertical ou horizontal. Apenas Corridas Únicas e Torneios estão disponíveis.", human = false }
MAN_2_SS = { text = "DESLOCAMENTO LATERAL", human = false }
MAN_2_TRACKRESUME = { text = "RETOMAR FAIXA", human = false }
MAN_2_TRES = { text = "Esta opção fica no menu Opções de Áudio.  Ligue-a e suas músicas voltam a tocar de onde pararam na corrida anterior.", human = false }
MAN_2_VL = { text = "Esta opção fica no menu Opções de Áudio e ajusta (ou normaliza) automaticamente o volume das suas músicas para igualar o da playlist padrão.  Ela só está disponível quando as trilhas sonoras personalizadas estão ligadas.", human = false }
MAN_2_WEAPONSPEEDPADS = { text = "PONTOS DE ARMAS E DE VELOCIDADE", human = false }
MAN_2_WSP = { text = "Estes pontos brilhantes existem em todos os circuitos e são ativados quando você passa por cima deles. Os pontos de armas dão uma arma ou um item aleatório, e os pontos de velocidade lançam sua nave para a frente com uma explosão de velocidade. Armas e itens não estão disponíveis em alguns tipos de corrida.", human = false }
MAN_3_AUT = { text = "Piloto automático: entregue o controle da nave a um piloto profissional simulado por alguns segundos e admire a paisagem.", human = false }
MAN_3_BOM = { text = "Bomba: solte este explosivo de alto nível e grande raio pela traseira da sua nave e prepare-se para uma detonação satisfatória.", human = false }
MAN_3_CAN = { text = "Canhão: bombardeie seus oponentes com uma rajada de 30 projéteis de prótons de alto calibre.  Dispare em rajadas curtas para obter o melhor efeito.", human = false }
MAN_3_FLA = { text = "Flash é uma classe de velocidade rápida, mas controlável, indicada para jogadores intermediários, com velocidade máxima de 538 km/h. As corridas Flash costumam durar 4 voltas.", human = false }
MAN_3_LEE = { text = "O Feixe Sanguessuga é um gancho eletrônico pulsante que drena a energia dos oponentes e a transfere para a sua nave.", human = false }
MAN_3_MIN = { text = "Solte um conjunto de cinco Minas flutuantes para pegar seus oponentes de surpresa com uma trilha de explosões bem calculada.", human = false }
MAN_3_MIS = { text = "Este Míssil inteligente pode ser disparado na hora, para um efeito de ricochete, ou travado no alvo, para um tiro mais preciso contra a concorrência.", human = false }
MAN_3_NOTIFY = { text = "AVISOS", human = false }
MAN_3_PHA = { text = "Phantom é a classe de velocidade mais extrema, só para especialistas, com velocidade máxima de 793 km/h e implacáveis 5 voltas na maioria dos eventos.", human = false }
MAN_3_PLA = { text = "Plasma: esta arma de energia escura percorre a pista causando grandes danos a tudo o que cruzar seu caminho.", human = false }
MAN_3_PU_ENG = { text = "COLETÁVEIS", human = false }
MAN_3_QUA = { text = "Tremor: este choque sísmico de alta potência abre caminho pela pista com um ímpeto explosivo e feroz.", human = false }
MAN_3_RAP = { text = "Jogadores experientes preferem a classe de velocidade Rapier, com velocidade máxima de 657 km/h e 4 voltas na maioria das corridas.", human = false }
MAN_3_ROC = { text = "Confiáveis e destrutivos, os Foguetes são três projéteis disparados para a frente que praticamente garantem o acerto a curta distância.", human = false }
MAN_3_RT = { text = "TIPOS DE CORRIDA", human = false }
MAN_3_RTSC = { text = "MODOS", human = false }
MAN_3_RT_ENG = { text = "TIPOS DE CORRIDA", human = false }
MAN_3_S = { text = "CLASSES DE VELOCIDADE", human = false }
MAN_3_SC = { text = "O WipEout® HD tem quatro classes de velocidade. A maioria dos tipos de corrida se concentra em uma classe específica. Em alguns eventos, a classe de velocidade também define quantas voltas serão corridas.", human = false }
MAN_3_SHI = { text = "Escudo: fique invulnerável a tiros e a danos de colisão por um breve período com este campo de energia protetor.", human = false }
MAN_3_SL = { text = "Volta Rápida: a extensão lógica do Contra o Relógio, o evento Volta Rápida dá aos jogadores 7 voltas para registrar um tempo de volta excepcional.  O uso estratégico dos coletáveis turbo gratuitos é essencial.", human = false }
MAN_3_SL_1 = { text = "A extensão lógica do Contra o Relógio, a corrida Volta Rápida é toda sobre marcar um tempo de volta excepcional.  Passe pelos pontos de velocidade brilhantes na superfície da pista para maximizar seu tempo e use os coletáveis Turbo de forma estratégica: você ganha um gratuito por volta.", human = false }
MAN_3_SL_2 = { text = "Nas corridas Volta Rápida da Campanha, você tem 7 voltas para atingir o tempo alvo. Se a meta de ouro for atingida antes do fim das 7 voltas, a sessão termina automaticamente. Você pode escolher correr de novo depois de atingir o ouro, mas a sessão vai durar as 7 voltas completas.  Você pode encerrar uma sessão de Volta Rápida a qualquer momento escolhendo Encerrar Sessão no menu de pausa.", human = false }
MAN_3_SL_3 = { text = "Em uma corrida Volta Rápida no Racebox, você tem até 99 voltas para registrar um tempo de volta excepcional. Para encerrar a sessão, escolha Encerrar Sessão no menu de pausa.  Todos os recordes alcançados serão salvos.", human = false }
MAN_3_SR = { text = "Corrida Única: o núcleo de todas as competições do WipEout® HD. Na corrida única, 8 equipes disputam em um único local, com ou sem armas, pela glória do primeiro lugar e pela cobiçada medalha de ouro.", human = false }
MAN_3_TOUR = { text = "Torneio: esta competição de várias corridas dá pontos após cada corrida, conforme a posição de chegada.  Se sua soma for alta o bastante no fim do torneio, você conquistou sua medalha de ouro por merecimento.", human = false }
MAN_3_TT = { text = "Contra o Relógio: este clássico evento solo coloca os pilotos contra o cronômetro, onde a abordagem de cada curva é fundamental e cada uso dos freios aéreos precisa ser cronometrado com perfeição para chegar à vitória.", human = false }
MAN_3_TT_2 = { text = "Seu tempo alvo é o total acumulado de todas as voltas, então é preciso manter tempos de volta consistentes para ter sucesso.  É importante passar pelos pontos de velocidade brilhantes na superfície da pista se você quer marcar um bom tempo.", human = false }
MAN_3_TT_3 = { text = "Para ajudar ainda mais, você recebe um coletável Turbo no início de cada volta.  Use-o com sabedoria para ganhar uma explosão de velocidade e atingir seu tempo alvo.", human = false }
MAN_3_TUR = { text = "Ative um Turbo e abra caminho pelo pelotão, por cima de um salto ou para fora de perigo com uma gratificante explosão de velocidade.", human = false }
MAN_3_VEN = { text = "Venom é a classe de velocidade mais lenta, indicada para iniciantes, com velocidade máxima de 462 km/h. A maioria das corridas Venom dura 3 voltas.", human = false }
MAN_3_WI = { text = "COLETÁVEIS", human = false }
MAN_3_ZONE = { text = "Zona: o evento favorito dos fãs está de volta para testar os nervos de quem busca a descarga máxima de velocidade.  A aceleração é automática e a velocidade máxima aumenta a cada zona de 10 segundos.  Sua destruição é certa, mas por quanto tempo suas habilidades de navegação conseguem adiar o inevitável?", human = false }
MAN_3_ZONE_1 = { text = "A corrida favorita dos fãs está de volta para testar os nervos de quem busca a descarga máxima de velocidade.  A aceleração é automática e a velocidade máxima aumenta a cada zona de 10 segundos. Você só precisa se concentrar em guiar e usar os freios aéreos enquanto a velocidade continua subindo.", human = false }
MAN_3_ZONE_2 = { text = "Seu sucesso é medido de duas formas durante a corrida:", human = false }
MAN_3_ZONE_3 = { text = "Número total de zonas completadas, exibido à esquerda do HUD.", human = false }
MAN_3_ZONE_4 = { text = "Pontuação total de zona, exibida no centro superior do HUD.", human = false }
MAN_3_ZONE_5 = { text = "A pontuação de zona é calculada pelo número de pontos de velocidade que você acerta, pelas zonas perfeitas corridas (sem sofrer dano durante uma zona) e pelo total de voltas completadas. Os pontos de velocidade aumentam o perigo, mas também a pontuação, e completar zonas perfeitas recupera a energia perdida da nave.", human = false }
MAN_3_ZONE_6 = { text = "No modo Zona, sua destruição é certa, mas por quanto tempo suas habilidades de navegação conseguem adiar o inevitável?", human = false }
