MSC_TEAMDES_AGS = { text = "A AG Systems ressurgiu e apresenta este design elegante e evolutivo, vindo de sua sede japonesa: uma nave bem equilibrada, cuja aceleração é praticamente imbatível.", human = false }
MSC_TEAMDES_ASS = { text = "O excelente comportamento da Assegai é a base da nova nave das Nações Africanas Unidas, que também demonstrou boas habilidades gerais em outras áreas.", human = false }
MSC_TEAMDES_AUR = { text = "A Auricom renasceu com uma nova visão totalmente americana e uma nave à altura, com velocidade máxima e escudo excelentes, prejudicados apenas um pouco pelo controle básico.", human = false }
MSC_TEAMDES_CONCEPT = { text = "Saídas das fábricas de equipes de ponta, as naves da classe conceito transformam em realidade as possibilidades de ideias futuras, com estes protótipos de primeira geração.", human = false }
MSC_TEAMDES_EGX = { text = "Esta parceria improvável entre a EG-R da China e a Xios da Suécia faz sua nave de estreia surgir como uma espécie de azarão, com um motor muito capaz e um escudo respeitável.", human = false }
MSC_TEAMDES_ELIM = { text = "As equipes remodelaram o formato de suas naves de corrida para refletir as adaptações internas exigidas no modo Eliminatória, onde os disparos de armas são intensos e rápidos.", human = false }
MSC_TEAMDES_FEI = { text = "O excelente comportamento da nave Feisar, do consórcio europeu, é um pouco comprometido pela falta de velocidade máxima pura, mas esta equipe é pra valer, por qualquer critério.", human = false }
MSC_TEAMDES_GOT = { text = "Recém-refundada na Ilha Makana, no Oceano Pacífico, a Goteki 45 construiu uma nave preparada para o futuro, com aceleração incrível e excelente escudo.", human = false }
MSC_TEAMDES_HAR = { text = "A nave Harimau tem um comportamento excelente, mas seu desempenho nas outras áreas é, na melhor das hipóteses, acima da média. Mesmo assim, a equipe asiática consegue resultados na pista de forma consistente.", human = false }
MSC_TEAMDES_ICA = { text = "Os azarões britânicos da Icaras miraram na Piranha e criaram uma nave deliberadamente pouco blindada, com velocidade máxima e aceleração estonteantes para superar os brasileiros.", human = false }
MSC_TEAMDES_MIR = { text = "A Mirage espera largar rápido na liga FX400, com os Emirados Árabes Unidos concentrando seus esforços em entregar a nave mais equilibrada disponível.", human = false }
MSC_TEAMDES_PIR = { text = "A Piranha pode se orgulhar do motor mais rápido da liga, embora a equipe de controle brasileiro tenha sacrificado manobrabilidade e aceleração no processo. ", human = false }
MSC_TEAMDES_QIR = { text = "A potência russa produziu uma nave ágil e bem protegida, cuja aceleração é seu ponto mais fraco. A Qirex está voltando rapidamente à frente do grid.", human = false }
MSC_TEAMDES_TRI = { text = "Esta fera de nave, vinda da sede australiana da Triakis, oferece um sistema de escudo de nível mundial e ótima velocidade máxima, mas não vai bater recordes de comportamento ou de aceleração.", human = false }
MSC_TEAMDES_ZONE = { text = "Cada equipe criou uma nave capaz de suportar as condições severas do modo Zona, que de algum modo se mantém inteira em velocidades extremas, deixando o erro do piloto como única causa de falha.", human = false }
