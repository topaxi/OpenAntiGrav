MSC_EVENT_ELIM = { text = "Eliminatória: corra por abates, não por posição, contra um grid cheio de adversários de gatilho fácil em um ambiente repleto de armas. Absorver coletáveis dá um escudo breve em vez de energia, mas você recupera vitalidade após cada volta. O número de voltas não é fixo, e a corrida termina quando a meta de abates é atingida.", human = false }
MSC_EVENT_HTH = { text = "Frente a frente: uma corrida única para dois jogadores, de rivalidade intensa. Prepare-se para brigar por cada metro do circuito para vencer seu oponente. Acompanhe no HUD a distância entre você e ele.", human = false }
MSC_EVENT_SL = { text = "Volta rápida: concentre todo o seu esforço em arrasar a pista e bater o melhor tempo de volta neste evento solo. Você ganha um coletável turbo gratuito por volta. Sua energia também se recupera automaticamente, então não precisa ter medo de bater.", human = false }
MSC_EVENT_SR = { text = "Corrida Única: enfrente um grid cheio de oponentes, com armas opcionais. Uma medalha de ouro espera quem sair vitorioso.", human = false }
MSC_EVENT_TOURN = { text = "Torneio: participe de uma série de corridas únicas. Os pontos são concedidos entre as corridas e somados para definir o vencedor geral. Encare os maiores torneios para provar que é um piloto lendário. Você também pode salvar o progresso do torneio entre as corridas.", human = false }
MSC_EVENT_TT = { text = "Contra o Relógio: vença o cronômetro nesta corrida solo. Aproveite cada impulso de velocidade com precisão e faça cada curva valer. Você ganha um coletável turbo gratuito por volta. Sua energia também se recupera automaticamente, então não precisa ter medo de bater.", human = false }
MSC_EVENT_ZONE = { text = "Zona: sua nave acelera sozinha e a velocidade máxima aumenta a cada período de dez segundos, chamado de zona. Use os freios aéreos esquerdo e direito (Λ e Ν por padrão) junto com a direção para percorrer a pista. Adapte sua técnica de freio aéreo conforme a velocidade sobe e sobreviva o máximo possível antes de bater. Complete o número alvo de zonas para vencer o evento.", human = false }
