# Brazilian Portuguese: this project's own translation of Wipeout HD / Fury's
# disc text, keyed by HD's own idstrings (`FE_MM`, `BADGE_NAME_BOMBER`, ...). Read
# only by a title whose front end names the `hd` namespace
# (`oag_title::FrontEnd::disc_strings`), and laid over the disc's own English
# table, so an id this file does not carry reads the disc's own English.
#
# **Every entry is `human = false`**: written by a model, not reviewed by a
# native speaker. These are this project's own sentences, keyed by the disc's
# ids; no line of the disc's text is copied here (docs/overview/legal.md).
# Terminology follows Wipeout Omega's own on-disc `portuguesebr` table (NAVE,
# EQUIPE, VOLTA, ZONA, ELIMINATÓRIA, TORNEIO, ARMAS, COLETÁVEL, FREIO AÉREO,
# RANQUE, LEALDADE, LOBBY, skin, ...), and the same wording as the `2048`
# file wherever the two titles share an id and an English text.
#
# Left out on purpose, so they read as the disc writes them: team, ship, track
# and music proper names, button glyphs, unit labels (KMH, MPH, MACH), the
# other-region legal notice, the font test string, circuit names (`NN_TRACK`,
# which the front end resolves through its own copy of the table) and a handful
# of words that read the same in both languages.

