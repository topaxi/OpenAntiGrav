MAN_P2_PG1_RC = { text = "A Campanha de Corrida é a casa do jogo para um jogador do WipEout® Pulse. Centenas de eventos de corrida estão reunidos em grades pelas quais você precisa avançar, destravando novos eventos, grades e outros extras pelo caminho.", human = false }
MAN_P2_PG1_RC2 = { text = "Cada evento é uma combinação única de circuito, classe e tipo de corrida. Nos eventos com oponentes de IA, você pode definir a dificuldade antes de começar. Você também pode escolher a nave com que vai correr. Cumpra as metas de cada evento para ganhar medalhas, somar pontos e abrir eventos vizinhos na grade. Avance pela grade e ganhe pontos suficientes para abrir a próxima.", human = false }
MAN_P2_PG2_RB = { text = "O Racebox tem tudo o que você precisa para personalizar corridas para um jogador.", human = false }
MAN_P2_PG2_CE = { text = "Corrida personalizada: escolha seu próprio tipo de evento, pista, classe e outras configurações. Dá até para criar torneios personalizados com até 12 pistas.", human = false }
MAN_P2_PG2_LG = { text = "Carregar grade: carregue uma grade salva antes para jogar nela.", human = false }
MAN_P2_PG2_EG = { text = "Editar grade: crie e personalize grades completas como as da Campanha de Corrida. Use o editor para criar o layout e depois adicione eventos. Use o menu para dar nome à grade, salvá-la e assim por diante. Com a grade pronta, corra nela pela opção Carregar grade ou compartilhe o arquivo salvo com os amigos para eles correrem na sua criação!", human = false }
MAN_P2_PG3_ONL = { text = "Online (infraestrutura): escolha uma conexão de rede e acesse os servidores online do WipEout® Pulse. Depois de conectado, você pode entrar numa corrida online ou criar uma.", human = false }
MAN_P2_PG3_JR = { text = "Entrar em corrida: selecione sua nave e escolha numa lista de corridas criadas por outras pessoas. Escolha uma para entrar e você irá para a sala com os outros jogadores. Quando todos estiverem prontos, o anfitrião inicia a corrida.", human = false }
MAN_P2_PG3_CR = { text = "Criar corrida: personalize uma corrida para até 8 jogadores. Depois de criar o jogo, você irá para a sala. Conforme outras pessoas entrarem, elas aparecerão na sala. Como anfitrião, você pode iniciar a corrida.", human = false }
MAN_P2_PG3_AHS = { text = "Ad Hoc e Compartilhamento: entre numa corrida Ad Hoc pela conexão sem fio local ou crie uma, de forma parecida com os jogos online acima. Aqui você também pode compartilhar dados com outros jogadores.", human = false }
MAN_P2_PG3_LAN = { text = "LAN: entre numa corrida em LAN pela conexão sem fio local ou crie uma. Todos os jogadores precisam se conectar antes a um roteador sem fio. Entrar e criar jogos é parecido com os procedimentos dos jogos Online e Ad Hoc acima.", human = false }
MAN_P2_PG3_ONLAC = { text = "Conta Online: use este recurso para salvar seu nome de usuário e senha e ligar o login automático, que pode acelerar a conexão Online (infraestrutura). Seus dados serão criptografados para a sua segurança e farão parte do seu perfil.", human = false }
MAN_P2_PG3_AUTO = { text = "Login automático: se você ligar o login automático pelo menu Conta Online, precisa fazer login manualmente uma vez antes que o recurso seja ativado. Se algum dado de login mudar, o login automático será desativado e você precisará entrar manualmente para reativá-lo.", human = false }
MAN_P3_PG1_AB = { text = "Freios aéreos: cada nave tem freios aéreos de ponta para ajudar a contornar curvas fechadas. Úteis principalmente em velocidades altas, quem domina os freios aéreos tem muito mais chance de sucesso. Acione o freio aéreo esquerdo ou direito numa curva fechada para manter a velocidade e aumentar a capacidade de contorno.", human = false }
MAN_P3_PG1_WSP = { text = "Pads de armas e de velocidade: ficam na superfície das pistas, assim:", human = false }
MAN_P3_PG1_WSP2 = { text = "Passe por cima deles para ativá-los. Os pads de armas dão uma arma ou um item aleatório. Só é possível carregar uma arma ou item de cada vez. Os pads de velocidade dão um impulso de velocidade. Armas e itens não estão disponíveis em alguns eventos.", human = false }
MAN_P3_PG1_ENER = { text = "Energia da nave: sua nave tem uma quantidade limitada de energia, que pode se esgotar com colisões com as paredes da pista, outras naves ou armas. Na maioria das corridas, se a energia chegar a zero, a nave explode e você perde a corrida. Nos eventos Time Trial e Volta de velocidade, a energia da nave se recupera sozinha.", human = false }
MAN_P3_PG1_ABS = { text = "Absorção: em vez de disparar uma arma ou ativar um coletável, você pode absorvê-lo e recuperar parte da energia da nave. Cada item e arma dá uma quantidade diferente de energia. Saber quando usar ou absorver os coletáveis é uma estratégia essencial que pode decidir se você ganha ou perde as corridas.", human = false }
MAN_P3_PG1_MAG = { text = "Faixas magnéticas: são áreas especiais da pista que prendem a nave magneticamente à superfície, permitindo corridas dinâmicas que desafiam a gravidade. Fique de olho nelas na pista!", human = false }
MAN_P3_PG1_SLOY = { text = "Lealdade à nave: você ganha pontos de lealdade em cada corrida de que participa, para a nave que usou nela. Os pontos de lealdade dependem do seu desempenho na corrida. Use a mesma nave em várias corridas e os pontos de lealdade se acumulam com o tempo. Você é recompensado automaticamente com bônus quando a lealdade atinge certo nível. Fique de olho no medidor de lealdade que aparece no fim de cada evento de corrida e compare a lealdade de várias naves na tela de Estatísticas.", human = false }
MAN_P3_PG2_PHO = { text = "Fotos: durante qualquer corrida, você pode pausar a ação e escolher a opção Tirar foto para escolher um ângulo de câmera e fotografar. Também dá para tirar uma foto no fim da maioria das corridas. As fotos podem ser vistas pelo Menu Inicial do seu sistema PSP™ (PlayStation®Portable).", human = false }
MAN_P3_PG2_MP3 = { text = "Música MP3: o WipEout® Pulse pode tocar seus arquivos de música MP3. Por um computador, na pasta raiz do Memory Stick Duo™, crie o diretório MUSIC, se ainda não existir. Dentro dele, crie a pasta WIPEOUT. Copie até 30 arquivos de música MP3 para a pasta. No jogo, escolha Playlist de músicas no menu Opções. Os nomes das faixas dos seus arquivos MP3 vêm das tags de ID dos arquivos ou, se não existirem, do nome do arquivo.", human = false }
MAN_P3_PG2_SKIN = { text = "Editor de skins de nave: acesse wipeout-game.com para usar o editor de skins e criar uma skin personalizada para qualquer nave do WipEout® Pulse. Quando estiver satisfeito com o visual, baixe a skin para o jogo e leve para qualquer corrida, offline ou online.", human = false }
MAN_P3_PG2_GHO = { text = "Naves fantasma: nos eventos Time Trial e Volta de velocidade, uma nave fantasma é carregada ou gerada automaticamente com base no seu desempenho. Você pode desativar o carregamento automático ou a visibilidade das naves fantasma no menu Opções de jogo. No fim do evento, você pode salvar a sua melhor nave fantasma da corrida.", human = false }
MAN_P3_PG2_REC = { text = "Resgate: até os melhores pilotos antigravidade às vezes se excedem e fazem a nave sair voando da pista após um salto alto ou uma explosão de velocidade inesperada. Se isso acontecer, o serviço de resgate AG Salvage Shuttles devolve a nave à corrida - mas você terá perdido segundos valiosos e precisará correr forte para recuperá-los.", human = false }
MAN_P3_PG2_ECS = { text = "Gaiola ECS: a Gaiola dos Sistemas de Confinamento de Entretenimento cerca a maior parte dos trechos de pista. Seu objetivo é proteger os espectadores e o ambiente em geral das naves e dos disparos de armas - não é proteger você. Se você bater nela, sofrerá dano. Lembre-se: a gaiola não está em todo lugar e, se você se afastar demais da pista em alguns trechos, ainda precisará do serviço de resgate.", human = false }
MAN_P4_PG1_C = { text = "Tipos de pista: cada pista tem duas variações - a corrida preta e a corrida branca. As corridas preta e branca de cada pista podem variar em direção, tamanho ou traçado e trazem desafios diferentes conforme a classe e o tipo de evento escolhidos. Nas corridas fora da Campanha de Corrida, faça a escolha na tela de seleção de pista.", human = false }
MAN_P4_PG1_SC = { text = "Classes de velocidade: há quatro classes de velocidade no WipEout® Pulse. A maioria dos eventos de corrida se concentra numa classe específica. A classe do evento também pode definir quantas voltas serão corridas em alguns eventos.", human = false }
