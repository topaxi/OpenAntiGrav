MSC_HELP_RC_GS = { text = "A Campanha de Corrida se passa ao longo de uma série de grades. Cada grade tem um número fixo de eventos de corrida. Novas grades são destravadas conforme seu desempenho na grade anterior. As informações da grade em destaque aparecem à direita do seletor de grades.", human = false }
MSC_HELP_RC_CS = { text = "Os detalhes e os requisitos de medalha deste evento aparecem à direita da grade. Nas corridas com naves de IA, você pode mudar a dificuldade com δ.", human = false }
MSC_HELP_RC_SS = { text = "Escolha uma nave e a skin com os botões direcionais (incluindo suas skins personalizadas criadas em wipeout-game.com). Você também pode escolher rapidamente uma música para a corrida com δ.", human = false }
MSC_HELP_RB = { text = "Um jogador: personalize um evento de corrida para um jogador com qualquer uma das configurações disponíveis.\n\nCarregar grade: carregue uma grade personalizada para jogar.\n\nEditar grade: crie, edite e personalize uma grade de eventos de corrida, como as da Campanha de Corrida.", human = false }
MSC_HELP_RB_CRS = { text = "Escolha as configurações da sua corrida. Primeiro selecione um evento de corrida, depois escolha configurações como classe, oponentes, uso de armas e assim por diante. Cada evento tem configurações diferentes.", human = false }
MSC_RB_CRTR = { text = "Escolha um circuito para correr. Selecione primeiro o circuito e depois a corrida preta ou a corrida branca dele. As corridas preta e branca variam em tamanho, direção ou dificuldade em cada circuito e podem oferecer desafios diferentes em cada classe.", human = false }
MSC_HELP_RB_CRTN = { text = "Monte uma lista de corridas para o seu torneio. Use os botões direcionais para destacar uma vaga e selecionar uma pista, depois pressione ε ao terminar. Pressione δ para remover uma pista de uma vaga.", human = false }
MSC_HELP_RB_CG = { text = "Crie ou edite aqui a sua própria grade. Destaque uma célula e pressione ε para criar um novo evento de corrida ou editar ou apagar um existente.\n\nPressione δ para abrir o menu onde você gerencia suas grades, dá nome a elas, apaga todos os eventos de corrida ou limpa resultados anteriores.\n\nLimpar os resultados é útil se outra pessoa já jogou a grade antes de você e ganhou medalhas, fez recordes etc. Todos os resultados são zerados, e a grade volta ao estado original, sem jogar.", human = false }
MSC_HELP_RB_SG = { text = "Escolha uma grade para carregar e enviar por conexão sem fio. Na lista de pessoas que aparecer, escolha para quem enviar a grade. Quando vocês dois estabelecerem a conexão e a confirmarem, a grade é enviada.", human = false }
MSC_RB_RG = { text = "Procure uma lista de pessoas enviando suas grades por conexão sem fio. Escolha uma para estabelecer a conexão. Quando vocês dois confirmarem a conexão, a grade é copiada para você. Ao terminar, você precisa salvar a grade se quiser guardá-la. Depois pode continuar procurando outras grades.", human = false }
MSC_HELP_MP = { text = "Os jogos online (infraestrutura) são jogados pela internet. Os jogos Ad Hoc são jogados por conexão sem fio local. Você pode usar o menu Conta Online para ativar o login automático. No menu Ad Hoc você também pode compartilhar dados, como grades personalizadas.", human = false }
MSC_HELP_PR = { text = "Gerenciar perfis permite salvar, carregar, criar e apagar perfis de jogador.\n\nSeus detalhes permite editar os dados do perfil, como nome e tag.\n\nEstatísticas é uma área completa onde você vê estatísticas de jogo em várias categorias, como tempo de jogo, uso de naves, uso de armas e itens e mais.\n\nRecordes permite ver recordes de corrida de vários tipos de corrida para um jogador.", human = false }
MSC_HELP_PR_REC = { text = "Procure uma lista de pessoas dispostas a compartilhar seus recordes. Escolha uma para estabelecer a conexão. Quando vocês dois confirmarem a conexão, os recordes são compartilhados.\n\nOs melhores tempos dos dois conjuntos de recordes são combinados em um só, que é enviado aos dois jogadores. Isso significa que alguns dos seus tempos mais antigos podem ser sobrescritos por tempos melhores do outro jogador.", human = false }
MSC_HELP_OPT = { text = "Configurações: ajuste várias configurações do jogo.\n\nControles: escolha um esquema de controle fixo ou personalize os controles do seu jeito.\n\nPlaylist de músicas: reordene as músicas do jogo e ligue ou desligue cada uma.", human = false }
MSC_HELP_EXT = { text = "Explore os extras do WipEout® Pulse. Veja o manual de instruções eletrônico, confira os créditos da equipe e mais.", human = false }
