# Brazilian Portuguese: this project's own translation of Wipeout Pulse's disc
# text, keyed by Pulse's own idstrings (`FE_MM`, `IG_HUD_LAP`, ...). Read only
# by a title whose front end names the `pulse` namespace
# (`oag_title::FrontEnd::disc_strings`), and laid over the disc's own English
# table, so an id this file does not carry reads the disc's English.
#
# **Every entry is `human = false`**: written by a model, not reviewed by a
# native speaker. These are this project's own sentences, keyed by the disc's
# ids; no line of the disc's text is copied here (docs/overview/legal.md).
# Terminology follows Wipeout Omega's own on-disc `portuguesebr` table (NAVE,
# EQUIPE, VOLTA, ZONA, ELIMINATÓRIA, TORNEIO, ARMAS, COLETÁVEL, FREIO AÉREO,
# skin, ...).
#
# Left out on purpose, so they read as the disc writes them: team, ship and
# track proper names, speed-class names, button glyphs (ε γ δ β Λ Ν) and unit
# labels (MPH, KMH, kb): 59 ids, all of which read the same in Portuguese or
# are not words. Words that merely happen to be spelled the same in both
# languages (Turbo, Plasma, Online) are in the file anyway.
# Where the file says "Preta"/"Branca" for a track's black and white runs it
# is the project's own wording: chosen, not measured.

