MSC_TRACK_01 = { text = "Esta cidade cinza-metálico foi totalmente evacuada após o surto da Nova Escócia, deixando apenas letreiros de neon e sentinelas robóticas para vigiar de perto os avatares da multidão e as curvas magnéticas do circuito de 4,2 quilômetros de Basilico.", human = false }
MSC_TRACK_17 = { text = "Em Basilico, as luzes estão acesas, mas não há ninguém em casa. São 3,9 quilômetros de deslize em granito-obsidiana por este formigueiro de cidade, enquanto a corrida mantém dóceis os caçadores de peste e os drones de carga abandonados.", human = false }
MSC_TRACK_02 = { text = "Entre as torres e plataformas de pouso do coração corporativo do Leste Asiático, o circuito de 4,7 quilômetros de Metropia tem um trecho de vidro que dá vertigem e uma descida mortal para as entranhas da cidade. Corra com cuidado.", human = false }
MSC_TRACK_18 = { text = "A Assembleia de Nova Kyoto apoia e autoriza plenamente a corrida em Metropia, onde a pista de 4,4 km conduz os competidores com eficiência pelas torres mais altas e pelos centros de convenções do quadrante empresarial reformado.", human = false }
MSC_TRACK_03 = { text = "Construída numa cadeia exclusiva de ilhas na costa da Sicília, Moa Therma é a própria definição de glamour mediterrâneo. Corra pelo dínamo horizontal da Synchro Logistics e ajude a abastecer de eletricidade os ricos e saudáveis moradores desta pista de 5,3 km.", human = false }
MSC_TRACK_19 = { text = "Com 5,3 quilômetros, o prestigioso circuito de Moa Therma, em meio a imóveis sicilianos de primeira linha, foi patrocinado à perfeição, das ondulações das cristas magnéticas ao esculpido anel do dínamo de alta velocidade.", human = false }
MSC_TRACK_04 = { text = "Ar e água frescos são artigos de luxo no principado científico dos especialistas em energia solar da Tech De Ra, o último refúgio do grande deserto americano. Acelere por 5 quilômetros em torno dos cânions e ravinas frágeis desta antiga fazenda hidropônica.", human = false }
MSC_TRACK_20 = { text = "Enquanto os painéis solares alimentam as roupas refrigeradas dos espectadores sob o sol escaldante do meio-dia, o circuito de 5 quilômetros de plasmetal faz um arco preguiçoso pelos cânions do Arizona. Fora do complexo da Tech De Ra, só restam ferrugem, poeira e a corrida.", human = false }
MSC_TRACK_05 = { text = "Erguendo-se das cinzas de Genebra, a expansão de de Konstruct não para. Por isso, a torre de transmissão da ECS fica logo fora do alcance do anel de trânsito, e o cassino abriga um desvio elevado perto da entrada desta pista de quatro quilômetros e meio.", human = false }
MSC_TRACK_21 = { text = "Quatro quilômetros e meio de pista de alta tensão se enroscam nas declarações art déco de de Konstruct, a cidade cuja única constante é a mudança, onde os sortudos podem ver de relance as ondas de rádio entre as chamas dos motores.", human = false }
MSC_TRACK_06 = { text = "Quando as cidades das Ilhas Cayman se expandiram para o mar, nasceu Vertica. Este paraíso tropical abriga os últimos recifes de coral e é um refúgio para a elite e os reclusos, com acesso corporativo restrito às arquibancadas desta pista de 4,3 km.", human = false }
MSC_TRACK_22 = { text = "Em Vertica, os negócios tomam emprestado da natureza, abrindo caminho pela paisagem, por túneis de musgo luminoso e descidas ladeadas de palmeiras numa pista de 4,9 km projetada para curvas em alta velocidade e cumes sem visibilidade.", human = false }
MSC_TRACK_07 = { text = "5,1 quilômetros de pista cercados pelos servidores superresfriados e centros de dados de Outpost 7. As corridas trazem fundos vitais a este polo de comunicações no topo da Finlândia. Admire o gelo-nove que avança sem parar e atravesse a estreita ponte memorial.", human = false }
MSC_TRACK_23 = { text = "As temperaturas abaixo de zero de Outpost 7 são compensadas, como emissões de carbono, pelas chamas dos motores e pela rivalidade que esquentam este circuito finlandês de 5,1 km, onde curvas duplas em V enfrentam os enlaces de satélite.", human = false }
MSC_TRACK_08 = { text = "A construção deste porto submarino único levou o comitê de corridas da Ilha Vostok a criar um novo circuito de cinco quilômetros e meio sob o mar, que destaca os navios baleeiros e a comunidade de mineração no centro de Vostok Reef.", human = false }
MSC_TRACK_24 = { text = "15 centímetros de vidro profissional reforçado mantêm a água fora dos 4,9 quilômetros de Vostok Reef, enquanto o túnel em espiral recém-polido e as estações de atracação destacam as curvas constantes deste circuito friamente distante.", human = false }
MSC_TRACK_09 = { text = "A extensão natural de Las Vegas, The Amphiseum é uma cidade feita só para o entretenimento. Este circuito sem modéstia tem 6 quilômetros e contrasta os holofotes e as torres de mais uma noite movimentada com o fascínio das massas. Nunca esteve tão bonito.", human = false }
MSC_TRACK_25 = { text = "Ao longo de 5,4 quilômetros, o piso de vidro de The Amphiseum leva às pistas dos espectadores separadas por retornos, e à colina magnética, depois faz uma longa curva à direita antes do retorno espetacular até a grade. Isto é entretenimento.", human = false }
MSC_TRACK_10 = { text = "O que acontece quando o grande irmão invade a aldeia global? Arc Prime é a resposta, onde muros fortificados e canais de rede seguros oferecem privacidade a um preço. Só a corrida escapa, com parte de seus 5 km rompendo os limites do corredor interurbano de Seattle.", human = false }
MSC_TRACK_26 = { text = "Não dá para parar o sinal? A fortaleza de dados de Arc Prime já parou. Paranoica com cada metro de seus 5,1 km, segue todos os protocolos e padrões de segurança, das arquibancadas aos nós de varredura à beira da pista deste circuito de complexo sem fio.", human = false }
MSC_TRACK_11 = { text = "Esta pista de 5 quilômetros serpenteia pelo sistema de transporte e pelo distrito comercial da densa metrópole de Edgewinter, uma cidade-ilha flutuante no Pacífico, apanhada no meio de uma tempestade tropical.", human = false }
MSC_TRACK_27 = { text = "Quando a chuva nunca para, Edgewinter continua. Vista pela última vez perto do Atol de Midway, esta pista de 5,3 km resiste além de sua reta central de alta velocidade, torcendo-se e ondulando com vontade para acomodar a cidade.", human = false }
MSC_TRACK_12 = { text = "Gemini Dam é o eixo central das rotas comerciais do Norte da África, com a pista de 4,9 km mergulhando brevemente na escorregadia estação de purificação antes de emergir nos subúrbios castigados pelo sol.", human = false }
MSC_TRACK_28 = { text = "Este local marroquino equilibra emoção e corrida técnica ao longo de 5,2 quilômetros de tarmacreto, entre plataformas de sustentação e estátuas, num clima ameno de fim de tarde.", human = false }
MSC_TRACK_13 = { text = "Os parques da Groenlândia foram finalmente descongelados e preservados para sempre por um comitê de filantropos com ambições utópicas. Esta pista sob medida de 4,6 quilômetros oferece um passeio vertiginoso pela arquitetura azul-gelo e pelas árvores petrificadas de Platinum Rush.", human = false }
MSC_TRACK_29 = { text = "As curvas impecáveis de Platinum Rush imitam o entorno, com trechos da pista de 4,6 km que acompanham a linha das árvores e depois viram para perseguir os viadutos e as ligações de monotrilho até o centro de eugenia.", human = false }
MSC_TRACK_14 = { text = "As máquinas do clima vieram a Fort Gale, em Gibraltar, para pesquisar, mas ficaram pela corrida. Escondidas entre as aletas residenciais, elas vigiam com dedicação os cinco quilômetros e meio deste ninho de víboras de pista.", human = false }
MSC_TRACK_30 = { text = "Moinhos de vento, cachoeiras e túneis baixos e largos se espalham pela guarnição rochosa de Fort Gale, criando uma sensação irregular, em dente de serra, que paira sobre as retas amigas das armas deste circuito de 5,4 km.", human = false }
MSC_TRACK_15 = { text = "Nas redes subterrâneas abaixo do Alasca, oficiais de alto escalão trabalham em ambiente secreto esperando a bomba cair. Seu único entretenimento é a corrida, que carrega seu próprio nível de ameaça por 4,3 km de escuridão permanente. Este é Orcus.", human = false }
MSC_TRACK_31 = { text = "Quatro quilômetros e meio de pista correm em silêncio pelo Centro de Prevenção de Catástrofes de Orcus, enquanto o ar fraco penetra este lugar subterrâneo onde a pista se retorce como casca sob as luzes âmbar do nível de código.", human = false }
MSC_TRACK_16 = { text = "A corrida chegou a este parque de energia secreto nas Brecon Beacons quando o dinheiro público foi retirado após o incidente da gosma cinzenta. No centro do circuito de 5,2 km de Talon's Junction estão os disjuntores de aspecto de catedral e o dinâmico anel Concordia.", human = false }
MSC_TRACK_32 = { text = "Escondido no centro de um geoparque galês, Talon's Junction é um ninho de atividades não aprovadas pelo governo. 5,2 quilômetros de pista passam pelos mecanismos e portais geométricos deste anel de pesquisa de energia escura.", human = false }
MSC_EVENT_SR = { text = "Corrida única: enfrente uma grade completa de oponentes, com armas opcionais. Uma medalha de ouro espera quem sair vitorioso.", human = false }
MSC_EVENT_HTH = { text = "Cara a cara: uma corrida única para dois jogadores, de rivalidade intensa. Prepare-se para brigar por cada metro do circuito para vencer o oponente. Acompanhe a distância entre vocês no HUD.", human = false }
MSC_EVENT_TOURN = { text = "Torneio: participe de uma série de corridas únicas. Os pontos são dados entre as corridas e somados para definir o vencedor geral. Encare os maiores torneios para provar que é um piloto lendário. Você também pode salvar o progresso do torneio entre as corridas.", human = false }
MSC_EVENT_TT = { text = "Time trial: vença o relógio nesta corrida solo. Aproveite cada turbo à perfeição e faça cada curva valer. Você ganha um turbo grátis por volta. Sua energia também se recupera sozinha, então não se preocupe em bater.", human = false }
MSC_EVENT_SL = { text = "Volta de velocidade: concentre todos os esforços em arrasar a pista e bater o melhor tempo de uma única volta neste evento solo. Você ganha um turbo grátis por volta. Sua energia também se recupera sozinha, então não se preocupe em bater.", human = false }
MSC_EVENT_ZONE = { text = "Zona: sua nave acelera sozinha e a velocidade máxima aumenta a cada período de dez segundos, chamado de zona. Use os freios aéreos esquerdo e direito (Λ e Ν por padrão) junto com a direção para percorrer a pista. Adapte sua técnica de freio aéreo conforme a velocidade sobe e sobreviva o máximo que puder antes de bater. Complete o número de zonas alvo para vencer o evento.", human = false }
MSC_EVENT_ELIM = { text = "Eliminatória: corra por abates, não por posição, contra uma grade cheia de competidores de gatilho fácil num ambiente repleto de armas. Absorver coletáveis dá um escudo breve em vez de energia, mas você recupera a saúde a cada volta. O número de voltas não é fixo, e a corrida termina quando a meta de abates é atingida.", human = false }
MSC_TEAMDES_FEI = { text = "O excelente controle da nave Feisar, do consórcio europeu, é um pouco traído pela falta de velocidade máxima, mas esta equipe é pra valer em qualquer padrão.", human = false }
MSC_TEAMDES_AGS = { text = "Uma AG Systems renascida entregou este projeto elegante e evolutivo, vindo da sede no Japão: uma nave equilibrada, com aceleração praticamente sem rival.", human = false }
MSC_TEAMDES_AUR = { text = "A Auricom se renovou com uma nova visão toda americana e uma nave à altura, com excelente velocidade máxima e escudo, prejudicados só um pouco pelo controle básico.", human = false }
MSC_TEAMDES_QIR = { text = "A potência russa produziu uma nave ágil e bem protegida, cuja aceleração é o ponto mais fraco. A Qirex está voltando rápido à frente da grade.", human = false }
MSC_TEAMDES_PIR = { text = "A Piranha pode se orgulhar de ter o motor mais rápido da liga, embora a equipe de controle brasileiro tenha sacrificado manobrabilidade e aceleração no processo.", human = false }
MSC_TEAMDES_TRI = { text = "Esta fera de nave, da sede australiana da Triakis, oferece um sistema de escudo de classe mundial com ótima velocidade máxima, mas não vai quebrar recordes de controle ou aceleração.", human = false }
MSC_TEAMDES_HAR = { text = "A nave Harimau tem um controle excelente, mas seu desempenho nas outras áreas é, no máximo, acima da média. Mesmo assim, a equipe asiática sempre consegue resultados na pista.", human = false }
MSC_TEAMDES_ASS = { text = "O excepcional modelo de controle da Assegai é o núcleo da nova nave das Nações Africanas Unidas, que já mostrou boas habilidades gerais nas outras áreas.", human = false }
MSC_TEAMDES_MIR = { text = "A Mirage espera largar bem na liga FX400, com os Emirados Árabes Unidos concentrando esforços em entregar a nave mais equilibrada disponível.", human = false }
MSC_TEAMDES_EGX = { text = "Esta parceria improvável entre a EG-R da China e a Xios da Suécia faz sua nave de estreia surgir como uma espécie de zebra, com um motor muito capaz e um escudo respeitável.", human = false }
MSC_TEAMDES_ICA = { text = "Os azarões britânicos da Icaras miraram na Piranha e produziram uma nave deliberadamente pouco blindada, com velocidade máxima e aceleração ofuscantes para superar os brasileiros.", human = false }
MSC_TEAMDES_GOT = { text = "Recém-refundada na Ilha Makana, no Oceano Pacífico, a Goteki 45 construiu uma nave à prova de futuro, com aceleração incrível e excelente escudo.", human = false }
MSC_TEAMDES_ZONE = { text = "Cada equipe produziu uma nave capaz de suportar as condições severas do modo Zona, que de algum modo aguentam velocidades extremas, deixando o erro do piloto como única causa de falha.", human = false }
MSC_TEAMDES_ELIM = { text = "As equipes reformularam o formato de suas naves de corrida para refletir as reformas internas exigidas pelo modo Eliminatória, onde os disparos de armas são intensos e constantes.", human = false }
MSC_TEAMDES_CONCEPT = { text = "Saídas fresquinhas das fábricas de ponta das equipes, chegam as naves da classe conceito, onde as possibilidades de ideias futuras viram realidade nestes protótipos de primeira geração.", human = false }
