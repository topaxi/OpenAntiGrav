MSC_GSHARE_RC = { text = "A Campanha de Corrida não está disponível nesta demo!\n\nNa versão completa, uma desafiadora coleção de grades espera por você, cada uma com vários eventos únicos para correr.\n\nSão centenas de eventos ao todo, em 4 classes cada vez mais rápidas, incluindo o ultrarrápido modo Zona e o modo Eliminatória, cheio de armas, com novas armas exclusivas.\n\nA Campanha de Corrida é a experiência definitiva de WipEout® para um jogador - só na versão completa do WipEout® Pulse!", human = false }
MSC_GSHARE_RB = { text = "Esta é a versão demo do Racebox, com escolha limitada de pistas, naves e outras opções.\n\nNa versão completa do Racebox, você personaliza qualquer combinação de tipo de evento, classe, pista, nave e mais. Também há o completo editor de grades, que permite criar grades no mesmo estilo das da Campanha de Corrida e compartilhá-las com os amigos.\n\nConfira o modo Racebox completo na versão completa do WipEout® Pulse!", human = false }
MSC_GSHARE_MP = { text = "Esta é a versão demo do modo multijogador.\n\nVocê só pode jogar uma corrida Ad Hoc por conexão sem fio local, com escolha limitada de pistas e naves.\n\nAs opções multijogador completas incluem corridas online para até 8 jogadores, com a possibilidade de correr contra skins de nave personalizadas de outros jogadores!", human = false }
ONL_LOB_PLAYERINFO = { text = "Informações do jogador", human = false }
ONL_LOB_EDIT = { text = "Editar configurações", human = false }
ONL_LOB_STARTRACE = { text = "Iniciar corrida", human = false }
MSC_GSHARE_WOC = { text = "Esta demo não dá acesso ao site wipeout-game.com.\n\nVisite o site por um computador para acessar o editor de skins de nave, personalizar as skins das suas equipes e baixá-las para usar no jogo completo.\n\nO site também tem os pacotes de download mais recentes, notícias, blogs dos desenvolvedores e mais!", human = false }
MSC_GSHARE_PRO = { text = "Esta é uma versão limitada do menu Perfil e só traz as telas de estatísticas e os recordes de corrida do conteúdo disponível nesta demo.\n\nA versão completa permite gerenciar vários perfis de jogador e ver toda a gama de estatísticas, incluindo o medidor de lealdade às naves, atualizado após cada corrida para cada nave. Junte pontos de lealdade suficientes para destravar recompensas!", human = false }
MSC_GSHARE_OPT = { text = "Esta tela de opções não traz toda a gama de opções da versão completa do jogo.\n\nVocê perde o prático salvamento automático e a playlist completa, com o que há de mais moderno em techno, house, drum and bass, break beat e eletrônica.\n\nVocê também perde a playlist de MP3, que permite tocar até 30 músicas suas do Memory Stick Duo™.", human = false }
MSC_GSHARE_EXT = { text = "Esta é a versão demo do WipEout® Pulse, com modos de jogo e conteúdo limitados.\n\nA versão completa tem muitos recursos novos, como trechos de pista com faixas magnéticas, modo foto, novas armas, corrida online, editor de grades personalizadas, suporte a música MP3, recursos de compartilhamento, suporte a skins de nave personalizadas e uma porção de pistas novas em folha!", human = false }
