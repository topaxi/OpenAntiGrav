h_b55a7ef0 = { text = "Nova equipe desconhecida.", human = false }
h_2f176279 = { text = "Neste ano a AG-Systems traz uma máquina muito afiada e responsiva, com velocidade onde importa. A AG-Systems sempre entrega.", human = false }
h_fd781e92 = { text = "A confiança é alta no hangar da Assegai, enquanto sua nova cria salta para a pista com uma mistura impressionante de agilidade e potência.", human = false }
h_bd3ba31d = { text = "Mais uma vez a Auricom leva problemas à pista e impõe autoridade com esta versão resistente e intimidadora.", human = false }
h_4cf51154 = { text = "Os detalhes desta nave são desconhecidos…", human = false }
h_a3ca5f99 = { text = "Com uma Feisar, você sabe o que esperar, e este ano não é exceção. A nova fera é uma combinação típica e de referência entre agilidade e confiabilidade.", human = false }
h_bb785cba = { text = "A Harimau está chamando atenção em sua viagem de estreia. Este novato canhoto está provocando ondas perigosas entre os veteranos ortodoxos.", human = false }
h_c6848758 = { text = "A prova de que a corrida AG está saindo do túmulo é que até os mortos-vivos querem participar da ação. Hora de virar Medievil.", human = false }
h_74706796 = { text = "Potência bruta com estética à altura e uma reputação a manter, a nova Piranha é um passeio emocionante que borra a paisagem… prepare-se para ver muito a aleta traseira.", human = false }
h_e8c484c8 = { text = "A Qirex apresenta uma combinação inteligente de elegância, velocidade e equilíbrio, que resulta em um desempenho empolgante toda vez que vai à pista.", human = false }
h_dd7b0f0c = { text = "Elevado à terceira potência. Os novatos da Triakis chegam à cena AG com força total nesta máquina robusta e ameaçadora, um verdadeiro tridente… fique de olho nesses rapazes.", human = false }
h_039f4f51 = { text = "A nave Zone se destaca em quase todas as áreas.", human = false }
h_1bd66592 = { text = "Aperte os botões esquerdo ou direito para ver os recordes das outras pistas e os botões para cima e para baixo para ver os recordes das outras classes.", human = false }
h_da9369c3 = { text = "Esta opção ainda não foi feita", human = false }
h_d22e48e5 = { text = "As quatro pistas da Liga Alfa nos levam para fora do mar, pela cidade e pelo campo, cada pista mais alta que a anterior.", human = false }
h_6e80b659 = { text = "A ascensão continua pelas quatro pistas da Liga Beta, por cidades e montanhas, até alturas absurdas.", human = false }
h_a3547c12 = { text = "Este é o grande desafio. Corra nas pistas da Liga Alfa e, logo em seguida, nas da Liga Beta. Aguente a ascensão.", human = false }
h_de6de095 = { text = "O passado evoluiu.", human = false }
h_bc9fd994 = { text = "Um número aleatório de pistas aleatórias, corridas em ordem aleatória. Um torneio verdadeiramente aleatório.", human = false }
h_55faac40 = { text = "4,78 K. Como a natureza, só que mais agradável. A Hab-Zona de Passageiros de Blue Ridge dá boas-vindas a motoristas cuidadosos.", human = false }
h_b9c99889 = { text = "4,87 K. Sinta o pulso no coração corporativo dos Projetos de Mid-Town.", human = false }
h_96f5140d = { text = "5,4 K de híbrido de carbo-aço de alta densidade. A Associação de Moradores de Citta-Nuova pede respeitosamente que você voe com o devido cuidado e atenção.", human = false }
h_79bb336a = { text = "3,26 K. Recriação neotrônica do clássico Circuito Karbonis de 2050.", human = false }
h_183492d7 = { text = "3,91 K. Recriação neotrônica do clássico Circuito Mandrashee de 2156.", human = false }
h_793d4df7 = { text = "4,2 K. Recriação neotrônica do clássico Circuito Manor Top de 2116.", human = false }
h_1be90d7c = { text = "4,58 K. Rocha-concreto reforçada pelos cortiços e pelo metrô dos Hi-Stacks de Old Modesto.", human = false }
h_a0e38130 = { text = "4,54 K. Recriação neotrônica do clássico Circuito Sagarmatha de 2097.", human = false }
h_74795917 = { text = "4,8 K de pista gelada e traiçoeira ao redor das Hidrofazendas do Flanco Inferior.", human = false }
h_1491202a = { text = "6,12 K. Aberto 24 horas por dia, 7 dias por semana. Percorra os Poços de Prazer e os Palácios da Discoteca do Lado Alto.", human = false }
h_9ac493e1 = { text = "4,4 K no Topo do Mundo. Não olhe para baixo!", human = false }
h_2c9b7e4d = { text = "4,45 K de Tungstênio-Alúmen Hi-Bounce TM serpenteiam por imóveis de primeira linha à beira-mar. Cuidado com o guano que cai.", human = false }
