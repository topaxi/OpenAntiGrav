h_780a4cf4 = { text = "Compartilhe a versão de demonstração do Wipeout PureΙ. Os modos para um jogador e multijogador estão disponíveis.", human = false }
h_6e847d11 = { text = "DISPUTE UMA CORRIDA ÚNICA EM UMA PISTA DE SUA ESCOLHA.", human = false }
h_8a51c687 = { text = "Só você e a pista pelo tempo que quiser. Divirta-se.", human = false }
h_0c2fb3d0 = { text = "Uma corrida contra o tempo: seu único adversário é o cronômetro.", human = false }
h_5350a8c2 = { text = "Corra em uma série de pistas em sequência, somando pontos pelas posições de chegada. Lembre-se: só uma equipe pode levar o ouro para casa.", human = false }
h_86c16177 = { text = "Quando você acha que não dá para ir mais rápido, vai. Quanto tempo você aguenta?", human = false }
