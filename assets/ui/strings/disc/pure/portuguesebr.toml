# Brazilian Portuguese: this project's own translation of Wipeout Pure's disc
# text. Read only by a title whose front end names the `pure` namespace
# (`oag_title::FrontEnd::disc_strings`), and laid over the disc's own English
# table, so an id this file does not carry reads the disc's own English.
#
# **Pure keys most of its strings by their English text** (535 of its 888 disc
# ids are the English text itself, and most of the rest are English phrases with
# spaces). Those ids are never spelled out here: each is
# stored as `h_xxxxxxxx`, `h_` and the 32-bit FNV-1a of the exact id string in
# eight hex digits (`oag_ui::strings::hashed_key`), and `overlay_disc` hashes the
# ids of the base table at load and lays each entry over its match. A plain id
# still matches by name. The ids that are code-like names (`HUD_Lap`,
# `Text->Options->Option->Music`) and single words stay keyed by name. No disc text is committed: every
# value is this project's own Portuguese (docs/overview/legal.md).
#
# **Every entry is `human = false`**: written by a model, not reviewed by a
# native speaker. Terminology follows Wipeout Omega's own on-disc
# `portuguesebr` table (NAVE, EQUIPE, VOLTA, ZONA, TORNEIO, ARMAS, COLETÁVEL,
# FREIO AÉREO, ...), and the same wording as the `2048` and `hd` files where an
# id and its English text coincide.
#
# Left out on purpose, so they read as the disc writes them: team, ship, track
# and music proper names, button glyphs, unit labels (KPH, MPH), and a handful
# of words that read the same in both languages, and the 22 bare numbers and
# percentages: 91 ids in all. Pure's HUD faces carry no `ç`, so the HUD ids are worded without it where a plain word exists.

