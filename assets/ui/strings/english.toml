# Project-owned English strings, overlaid onto the disc's own string table by
# `crate::strings::overlay`.
#
# Two uses share this file and this id space:
#
#   - overriding a disc idstring an existing widget already resolves (a
#     wrong or missing entry the project cannot fix by shipping different
#     disc data - see ADR-0006);
#   - giving a translatable home to text this project invented:
#     `assets/ui/menu.toml`'s `string_id`/`title_string_id`,
#     `oag_race::Mode::fallback_label`, `crates/game/src/loading/wording.rs`
#     and `crates/game/src/main/hints.rs` all look an id up here instead of
#     holding a literal `&str`.
#
# **This is the base language, and it is enforced, not aspirational.**
# `just check-strings` (`scripts/check-strings.py`) fails the gate if a
# `string_id`/`title_string_id` used anywhere resolves to nothing here, or if
# a *new* row or page in `assets/ui/menu.toml` names no id at all - a literal
# English label is only allowed on the rows `check-strings.py`'s own
# `BASELINE_LABELS`/`BASELINE_TITLES` name, which is the debt that predates
# this rule. See that script's own module doc for the ratchet.
#
# **These ids are ours, not the disc's.** The `OAG_` prefix is what keeps them
# from ever colliding with an idstring off a real string table, since this file
# shares one id space with the disc's own by design.
#
# A row falls back to its literal `label`/`title` when its id is missing here,
# so a language with no file yet reads English rather than reading nothing -
# which is why adding an id is safe on its own and removing one is not.
#
# # A language other than English
#
# `assets/ui/strings/french.toml` is the first one: a translation lands under
# `[strings]`, exactly like here, and an id this build has but that file's
# translator has not reached yet is named, explicitly, under a second table -
# `french.toml`'s own `[untranslated]` and its header comment are the worked
# example, in place of the illustrative one this comment used to carry:
#
#     [untranslated]
#     ids = ["OAG_PILOT_SAVE"]
#
# **A missing entry and a marked-untranslated one are not the same thing.**
# `check-strings.py` hard-fails the first - a silent gap nobody can grep for -
# and passes the second, because the gap is now visible, countable, and the
# same shape as `check-file-size.py`'s own `BASELINE`. Deleting an id from
# `[untranslated]` the moment it is translated is the same discipline that
# script's `graduated` list asks for. **A machine translation may clear a
# row** (maintainer's decision, 2026-10-06), but it says so: every entry is
# `ID = { text = "...", human = false }`, and `human` is `true` only when a
# human wrote or approved the text. `check-strings.py` reports the
# `human = false` count per file and does not fail on it. This file's own
# entries are `human = false` where their introducing commit carries a Claude
# `Co-Authored-By` trailer, which is every one of them today.

[strings]

