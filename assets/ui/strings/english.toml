OAG_LOADING_CONVERTING_ASSETS = "CONVERTING ASSETS"
OAG_LOADING_STEP_CACHED = "already converted, reading the cache"
OAG_LOADING_STEP_DECODING = "decoding"
OAG_LOADING_STEP_TRANSCODING_TOTAL = "transcoding - frame {done} of {total}"
OAG_LOADING_STEP_TRANSCODING = "transcoding - frame {done}"
OAG_LOADING_COUNTING = "counting what needs converting"
OAG_LOADING_COUNTS_LOADED = "{done} / {total} loaded"
OAG_LOADING_COUNTS_CONVERTED = "{done} / {total} converted"
