OAG_LOADING_READING_ARCHIVES = "READING THE ARCHIVES"
OAG_LOADING_GENERIC = "LOADING"
OAG_LOADING_READY = "READY"
OAG_LOADING_TRANSCODING_MOVIES = "TRANSCODING MOVIES"
