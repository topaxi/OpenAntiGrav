# Appended to a `PILOT` row's own choice when the name is a built-in with no
# file of its own yet - see `oag_game::pilots::Entry::from_file`. Read by
# Rust (`pilot_editor::pilot_choice`), not by a `menu.toml` `string_id`: the
# suffix is glued onto a filename the row already holds, not a whole row's
# label.
OAG_PILOT_BUILT_IN_SUFFIX = " (built-in)"

# The `back` row every page ends on. Shared rather than one id per page,
# because it is one word in every language regardless of which page it is
# leaving - the first page to actually name it is `pilots`, but any other
# page's own `back` row may reuse it once it is converted.
OAG_MENU_BACK = "BACK"

# The CONTROLS page's key-capture prompt, drawn over the whole page while
# `Session::awaiting_binding` is `Some` - see `docs/architecture/menus.md`'s
# Rebinding section. Read by Rust (`crate::rebind::prompt`, the pure half of
# `session::draw`'s own lookup, and `capture::menu_page::prompt_draws`'s
# `"binding"` arm for `--menu-prompt`), not by a `menu.toml` `string_id`:
# like the on-screen keyboard below, this is not a row so there is no page
# entry to carry one.
# `%s` is the button's own name, upper-cased, from `oag_gameplay::input::
# Button`'s `Display` impl. **Chosen, not authored**: neither PSP title's
# front-end XML defines a rebind prompt to read one off - the same search
# `PAUSE_OVERLAY`'s own doc comment in `crates/game/src/main/menu_stage.rs`
# describes turned up nothing for a pause screen either, and a per-row key
# capture is not on the original's own CONTROLS-equivalent page at all (its
# `Control_Type = "custom"` rebinds abstract-button-to-action, not
# key-to-button - see `docs/architecture/menus.md`'s "What this does not
# touch"), so there was nothing to look for beyond that gamepad-remapping
# screen which is a different axis entirely.
OAG_BINDING_CAPTURE_PROMPT = "PRESS A KEY FOR %s - ESCAPE CANCELS"

# CONTROLS page rows for `square` and `circle`. Chosen, not measured - neither
# PSP title's front-end XML authors this page - and picked to match the
# game's own vocabulary rather than invent new words: `OAG_HINTS_RACE_KEYS`
# below already says "C fires a pickup and Z absorbs it", matching what
# `Race::spend_pickup` (`crates/game/src/race/weapons.rs`) actually reads off
# `Button::Square`/`Button::Circle`. `circle`'s row used to read "BRAKE",
# which was wrong: there is no brake action in
# `oag_gameplay::controls::ship_controls`, and circle absorbs a pickup, it
# does not brake.
OAG_CONTROLS_FIRE_PICKUP = "FIRE PICKUP"
OAG_CONTROLS_ABSORB_PICKUP = "ABSORB PICKUP"

# The on-screen keyboard. Unlike the rows above, these are read by Rust rather
# than by a `string_id` in `menu.toml` - `crate::prompt` holds no string table
# of its own and takes every label already resolved, so the lookup happens
# where the prompt is opened.
#
# The key glyphs themselves are deliberately not here: `a`-`z`, `0`-`9`, `-`
# and `_` are the characters a pilot name may contain, which is a filename
# rule rather than language.
OAG_KEYBOARD_DELETE = "DEL"
OAG_KEYBOARD_ACCEPT = "OK"

# One line under the grid. Names abstract buttons, the same vocabulary the
# CONTROLS page and `docs/architecture/menus.md` use, rather than this
# machine's current bindings: a pad and a keyboard both reach the same four,
# and a line naming keys would be wrong on a pad.
OAG_KEYBOARD_HINT = "CROSS TYPE   SQUARE DELETE   START ACCEPT   CIRCLE CANCEL"

# `%s` is the pilot's own name, substituted where the entry is read. A string
# table is edited by translators and the disc's own tables already spell a
# substitution that way; Rust's `{}` would make an accidental brace in a
# translation a formatting error rather than a brace.

# Renaming a pilot. The last two are shown live under what has been typed,
# every keystroke, because finding out a name is refused only after typing it
# on a grid is what makes an on-screen keyboard unbearable.
OAG_PILOT_RENAME_TITLE = "RENAME PILOT"
OAG_PILOT_NAME_TAKEN = "THERE IS ALREADY A PILOT CALLED %s"
OAG_PILOT_RENAME_SHADOWS = "%s IS BUILT IN: A FILE OF THAT NAME REPLACES IT"

# Deleting one. `OAG_PILOT_DELETE_BUILT_IN` is the whole reason this asks at
# all: a file named after one of the four built-ins was *replacing* it, so
# removing the file restores the built-in rather than removing a pilot.
OAG_PILOT_DELETE_TITLE = "DELETE PILOT"
OAG_PILOT_DELETE_ASK = "DELETE %s? THIS CANNOT BE UNDONE."
OAG_PILOT_DELETE_BUILT_IN = "%s IS BUILT IN AND YOUR FILE REPLACES IT. DELETING THE FILE RESTORES THE BUILT-IN INSTEAD OF REMOVING %s."
OAG_PILOT_DELETE_YES = "DELETE"
OAG_PILOT_DELETE_NO = "KEEP"

# Window titles and the key hints printed under them - `crates/game/src/main/hints.rs`.
# Read by Rust, not by a `menu.toml` `string_id`: none of these has a disc
# idstring to override, so what they needed was somewhere translatable to
# live rather than an override.
OAG_HINTS_TITLE = "OpenAntiGrav"
OAG_HINTS_MENU_KEYS = "arrow keys or the left stick move, return, X or cross selects, space or start skips, escape quits"
OAG_HINTS_SHELL_TITLE = "OpenAntiGrav - menu"
OAG_HINTS_SHELL_KEYS = "up and down move, left and right change a setting, return, X or cross selects, backspace, circle or escape goes back"
OAG_HINTS_RACE_TITLE = "OpenAntiGrav - race"
OAG_HINTS_RACE_KEYS = "arrow keys or the left stick steer, X, return or R2 thrusts, Q and E or the shoulders are the airbrakes, L2 is both, C fires a pickup and Z absorbs it, space or start pauses"
OAG_HINTS_ESC_TO_MENU = ", escape returns to the menus"
OAG_HINTS_ESC_QUITS = ", escape quits"

