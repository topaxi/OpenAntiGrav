# Project-owned English strings, overlaid onto the disc's own string table by
# `crate::strings::overlay`.
#
# Two uses share this file and this id space:
#
#   - overriding a disc idstring an existing widget already resolves (a
#     wrong or missing entry the project cannot fix by shipping different
#     disc data - see ADR-0006);
#   - giving a translatable home to text this project invented:
#     `assets/ui/menu.toml`'s `string_id`/`title_string_id`,
#     `oag_race::Mode::fallback_label`, `crates/game/src/loading/wording.rs`
#     and `crates/game/src/main/hints.rs` all look an id up here instead of
#     holding a literal `&str`.
#
# **This is the base language, and it is enforced, not aspirational.**
# `just check-strings` (`scripts/check-strings.py`) fails the gate if a
# `string_id`/`title_string_id` used anywhere resolves to nothing here, or if
# a *new* row or page in `assets/ui/menu.toml` names no id at all - a literal
# English label is only allowed on the rows `check-strings.py`'s own
# `BASELINE_LABELS`/`BASELINE_TITLES` name, which is the debt that predates
# this rule. See that script's own module doc for the ratchet.
#
# **These ids are ours, not the disc's.** The `OAG_` prefix is what keeps them
# from ever colliding with an idstring off a real string table, since this file
# shares one id space with the disc's own by design.
#
# A row falls back to its literal `label`/`title` when its id is missing here,
# so a language with no file yet reads English rather than reading nothing -
# which is why adding an id is safe on its own and removing one is not.
#
# # A language other than English
#
# `assets/ui/strings/french.toml` is the first one: a translation lands under
# `[strings]`, exactly like here, and an id this build has but that file's
# translator has not reached yet is named, explicitly, under a second table -
# `french.toml`'s own `[untranslated]` and its header comment are the worked
# example, in place of the illustrative one this comment used to carry:
#
#     [untranslated]
#     ids = ["OAG_PILOT_SAVE"]
#
# **A missing entry and a marked-untranslated one are not the same thing.**
# `check-strings.py` hard-fails the first - a silent gap nobody can grep for -
# and passes the second, because the gap is now visible, countable, and the
# same shape as `check-file-size.py`'s own `BASELINE`. Deleting an id from
# `[untranslated]` the moment it is translated is the same discipline that
# script's `graduated` list asks for. **Never machine-translate to clear a
# row here** - an invented translation is worse than an honest gap, because a
# reviewer who does not speak the language cannot tell the two apart.

[strings]

# The MAIN menu: its own title, its six rows, and each row's subtitle -
# shown only under the selected row, see
# `docs/architecture/menus.md#a-per-row-subtitle`. `RACE_CAMPAIGN` and
# `RACEBOX` are ordered and worded to match `MainMenu_Definition.xml`'s own
# first two rows (`FE_RACE_CAM`/`FE_RACEBOX`) - see
# `docs/formats/fe-menu-definitions.md`; the subtitles themselves are this
# project's own wording, not the disc's help text.
OAG_MENU_MAIN_TITLE = "OPENANTIGRAV"
OAG_MENU_RACE_CAMPAIGN = "RACE CAMPAIGN"
OAG_MENU_RACE_CAMPAIGN_SUBTITLE = "The story mode: work your way up the tournament grid"
OAG_MENU_RACEBOX = "RACEBOX"
OAG_MENU_RACEBOX_SUBTITLE = "Set up your own race, split screen included"
OAG_MENU_REMIX = "REMIX"
OAG_MENU_REMIX_SUBTITLE = "Mix tracks and ships across every title you own"
OAG_MENU_RECORDS = "RECORDS"
OAG_MENU_RECORDS_SUBTITLE = "Your best times and scores, by track and class"
OAG_MENU_OPTIONS = "OPTIONS"
OAG_MENU_OPTIONS_SUBTITLE = "Display, audio and control settings"
OAG_MENU_QUIT = "QUIT"
OAG_MENU_QUIT_SUBTITLE = "Exit to the desktop"

# RACE and RACE REMIX share every row whose setting key and meaning are
# identical between the two pages - `race.mode`, `race.class`, `ai.difficulty`,
# `race.team`/`remix.team`, `race.variant`/`remix.variant`,
# `race.track`/`remix.track`, and the START action - the same reuse
# `OAG_MENU_BACK` already models for a word that means the same thing on every
# page that carries it. TRACK TITLE and CRAFT TITLE are REMIX's own, since
# RACE has no title-picking row to share them with.
OAG_RACE_PAGE_TITLE = "RACE"
OAG_RACE_MODE = "MODE"
OAG_RACE_SPEED_CLASS = "SPEED CLASS"
OAG_RACE_AI_DIFFICULTY = "AI DIFFICULTY"
OAG_RACE_TEAM = "TEAM"
OAG_RACE_VARIANT = "VARIANT"
OAG_RACE_TRACK = "TRACK"
OAG_RACE_START = "START"

# RACE REMIX's own two rows - see the block above for the rest of this page.
OAG_REMIX_PAGE_TITLE = "RACE REMIX"
OAG_REMIX_TRACK_TITLE = "TRACK TITLE"
OAG_REMIX_CRAFT_TITLE = "CRAFT TITLE"

# RECORDS' own title - its MODE and TRACK rows reuse OAG_RACE_MODE/
# OAG_RACE_TRACK above, and BACK reuses OAG_MENU_BACK, the same sharing RACE
# REMIX's own page already does. See `docs/architecture/menus.md`'s RECORDS
# section for what the page draws below these two rows.
OAG_RECORDS_PAGE_TITLE = "RACE RECORDS"

