# OpenAntiGrav's menu tree.
#
# This file is OURS. It is not a transcription of the disc's
# `MainMenu_Definition.xml` and is not meant to become one: this project needs
# the menus a PC game has (input bindings, graphics settings) and the original
# had no reason to carry those. See `crates/game/src/menu.rs` for the reasoning
# and for the format.
#
# Rules the loader enforces, so a mistake here is a startup error rather than a
# row that does nothing when pressed:
#
#   - every `target` names a page in this file;
#   - every `action` is one the game handles: launch_race, launch_remix, quit;
#   - every `button` is an abstract button name;
#   - every page is reachable from `root`.
#
# Edit it and run `cargo nextest run -p oag-game menu::` to check it, or pass
# `--menu <path>` to try a copy without rebuilding.
#
# Labels are literal text on purpose. `string_id` is reserved for a build that
# wants the original's own wording out of the disc's string table, and nothing
# reads it yet.
#
# Identifiers in `values` are archive path components, never display names:
# `Assegai` is a directory on the disc. Anything a player should read in their
# own language comes from the source at runtime through `values_from`, so no
# shipped content ever lands in this file. See
# `docs/architecture/adr/0006-no-copyrighted-content.md`.

version = 1
root = "main"

[[page]]
id = "main"
title = "OPENANTIGRAV"

[[page.entry]]
kind = "submenu"
label = "RACE"
target = "race"

# **Shown unconditionally, not gated on "more than one title available".**
# The menu definition has no way to ask that question - `disabled_by` only
# ever reads another row's own held value (`Menu::held`), never an
# externally-seeded fact, and it refuses to apply to anything but a `choice`
# or a `toggle` in the first place, which a `submenu` entry is neither. With
# one title on this machine, TRACK TITLE and CRAFT TITLE on the `remix` page
# each offer exactly one row and the page degrades to an ordinary custom
# race - nothing broken, nothing misleading, the same page doing less. See
# `handover/race-remix-backend-lands-menu-wiring-is-next.md`.
[[page.entry]]
kind = "submenu"
label = "REMIX"
target = "remix"

[[page.entry]]
kind = "submenu"
label = "OPTIONS"
target = "options"

[[page.entry]]
kind = "action"
label = "QUIT"
action = "quit"

[[page]]
id = "race"
title = "RACE"

# Mode first, because it is the thing that decides what the other rows mean: a
# zone run ignores the lap count a time trial is built around.
#
# `values_from` rather than a list, even though the set is fixed at
# `oag_race::Mode::ALL`: what the row *shows* is the front end's own event text
# off the player's disc, in their language, so it cannot be spelled here. The
# stored values are still the mode tokens.
[[page.entry]]
kind = "choice"
label = "MODE"
setting = "race.mode"
values_from = "race_modes"

# Speed class, team and track are the three things `race::Options` actually
# carries, so all three are live rather than decorative. The values are the
# ones `SpeedClass::from_name` and the disc's own directory layout accept; a
# value this list offers that the source does not have fails at load with the
# entry name in the message, which is the honest failure.
[[page.entry]]
kind = "choice"
label = "SPEED CLASS"
setting = "race.class"
values = ["venom", "flash", "rapier", "phantom"]

# The roster comes from the source for the same reason the circuits below do,
# and one more: it is not fixed. A player who owns a downloadable pack has teams
# no list in this repository could have named, and `values_from = "teams"` reads
# the plugin definition and every mounted pack's manifest for them. The value
# stored is the team id - the folder under `Data\Ships\` - and the label is that
# id in the language's own string table, which is not always the same word.
#
# Zone forces the shared Zone hull regardless of team (see
# `oag_game::race::ship_entry_name`), so the row is greyed rather than
# offered as if it still picked the drawn model.
# Only a single race fields opponents, so this greys to N/A in the other three
# modes. `disabled_by` matches positively, so the list is the modes *without* a
# grid rather than a negation of the one with it - keep it in step with
# `oag_race::Mode::ALL`.
[[page.entry]]
kind = "choice"
label = "AI DIFFICULTY"
setting = "ai.difficulty"
values = ["novice", "skilled", "elite", "ace"]
disabled_by = { setting = "race.mode", values = ["time_trial", "speed_lap", "zone"] }

[[page.entry]]
kind = "choice"
label = "TEAM"
setting = "race.team"
values_from = "teams"
disabled_by = { setting = "race.mode", value = "zone" }

# Most teams offer nothing here - `values_from = "race_variant"` is supplied
# empty for them, the same idiom MUSIC SOURCE uses on a machine with one
# disc, which draws the row unusable rather than lying about having a
# choice. Wipeout 2048's five-team roster and Wipeout HD/Fury's twelve are
# the ones today whose teams carry more than one selectable directory.
[[page.entry]]
kind = "choice"
label = "VARIANT"
setting = "race.variant"
values_from = "race_variant"
disabled_by = { setting = "race.mode", value = "zone" }

# The circuits come from the source, not from this file, and so do their names:
# `values_from = "tracks"` reads `Data\Plugins\PI001\Definition.xml` for what
# is raceable and the language's own string table for what to call it. That is
# why there is no list here and no separate LAYOUT row - a reversed circuit is
# its own entry in that file, with its own id and its own name.
[[page.entry]]
kind = "choice"
label = "TRACK"
setting = "race.track"
values_from = "tracks"

[[page.entry]]
kind = "action"
label = "START"
action = "launch_race"

[[page.entry]]
kind = "back"
label = "BACK"

[[page]]
id = "remix"
title = "RACE REMIX"

# Mode, speed class and AI difficulty are title-agnostic and shared with the
# ordinary RACE page verbatim - same settings keys, same values, same
# `disabled_by`. Nothing about racing a mixed grid changes what a mode, a
# class or a difficulty means.
[[page.entry]]
kind = "choice"
label = "MODE"
setting = "race.mode"
values_from = "race_modes"

[[page.entry]]
kind = "choice"
label = "SPEED CLASS"
setting = "race.class"
values = ["venom", "flash", "rapier", "phantom"]

[[page.entry]]
kind = "choice"
label = "AI DIFFICULTY"
setting = "ai.difficulty"
values = ["novice", "skilled", "elite", "ace"]
disabled_by = { setting = "race.mode", values = ["time_trial", "speed_lap", "zone"] }

# Title first, then a title-scoped list, on both halves - the shape the
# feature's own request asked for. TRACK TITLE and CRAFT TITLE are the same
# `values_from` (every title this machine can open a source for); TRACK and
# TEAM are resupplied every time the title above them changes, which is what
# makes them different rows from the ordinary RACE page's `tracks`/`teams`
# rather than the same ones reused.
[[page.entry]]
kind = "choice"
label = "TRACK TITLE"
setting = "remix.track_title"
values_from = "titles"

[[page.entry]]
kind = "choice"
label = "TRACK"
setting = "remix.track"
values_from = "remix_tracks"

[[page.entry]]
kind = "choice"
label = "CRAFT TITLE"
setting = "remix.craft_title"
values_from = "craft_titles"

[[page.entry]]
kind = "choice"
label = "TEAM"
setting = "remix.team"
values_from = "remix_teams"
disabled_by = { setting = "race.mode", value = "zone" }

# Most teams offer nothing here - `values_from = "remix_variant"` is supplied
# empty for them, the same idiom MUSIC SOURCE uses on a machine with one
# disc, which draws the row unusable rather than lying about having a choice.
# Wipeout 2048's five-team roster and Wipeout HD/Fury's twelve are the ones
# today whose teams carry more than one selectable directory - and 2048
# reships HD/Fury's twelve, so this row is what reaches them there too.
[[page.entry]]
kind = "choice"
label = "VARIANT"
setting = "remix.variant"
values_from = "remix_variant"
disabled_by = { setting = "race.mode", value = "zone" }

[[page.entry]]
kind = "action"
label = "START"
action = "launch_remix"

[[page.entry]]
kind = "back"
label = "BACK"

[[page]]
id = "options"
title = "OPTIONS"

# Two pages and not one, and the line between them is whether the renderer
# would notice. DISPLAY is the picture's container and how a finished frame
# reaches a screen; GRAPHICS is how the picture is drawn. Turning vsync off
# changes nothing about the frame, only about when it is shown; halving the
# render scale changes the frame itself. The settings file is split the same
# way, into `[display]` and `[graphics]` - see `crates/game/src/settings.rs`.
[[page.entry]]
kind = "submenu"
label = "DISPLAY"
target = "display"

[[page.entry]]
kind = "submenu"
label = "GRAPHICS"
target = "graphics"

[[page.entry]]
kind = "submenu"
label = "AUDIO"
target = "audio"

[[page.entry]]
kind = "submenu"
label = "CONTROLS"
target = "controls"

# Also read from the source. Changing it takes effect on the **next launch**:
# the string table is loaded once at boot, and reloading it under a front end
# that has already handed off is work nothing needs yet. Picking a language here
# also means the picker stays skipped, since that is the same setting.
[[page.entry]]
kind = "choice"
label = "LANGUAGE"
setting = "language"
values_from = "languages"

[[page.entry]]
kind = "back"
label = "BACK"

[[page]]
id = "display"
title = "DISPLAY"

# The screens this machine has, read at runtime the way the tracks and the
# languages are: a definition file cannot know them, and a compositor is free to
# rename or unplug one between launches. `default` is always offered and always
# first, because it is the way back from a screen that is no longer there. The
# setting stores a **name**, not an index - see `crates/game/src/display.rs`.
#
# Borderless carries the choice in the fullscreen request; windowed has nothing
# to carry it, so the window is centred on the chosen screen instead. Either
# way the compositor may refuse, and a tiling one will.
[[page.entry]]
kind = "choice"
label = "MONITOR"
setting = "display.monitor"
values_from = "monitors"

# Window mode and size apply the moment they change. A compositor is free to
# ignore a size request, and a tiling one will - nothing depends on it being
# honoured.
[[page.entry]]
kind = "choice"
label = "WINDOW MODE"
setting = "display.window_mode"
values = ["windowed", "borderless"]

[[page.entry]]
kind = "choice"
label = "WINDOW SIZE"
setting = "display.window_size"
values = ["960x544", "1280x720", "1440x816", "1600x900", "1920x1080", "2560x1440"]

# The shape the game is drawn at inside whatever window it got, with the
# leftover left black. `psp` is 480x272, the shape every camera value on the
# disc was authored for; `ps2` is 4:3; `free` fills the window without widening
# the field of view, because nothing on the disc says what the original would
# have shown on a 21:9 screen.
[[page.entry]]
kind = "choice"
label = "ASPECT RATIO"
setting = "display.aspect"
values = ["psp", "ps2", "free"]

# Which of the source's own front-end stylings to draw. The values are the
# *disc's*, not this build's: Wipeout HD's `OPT_FE_STYLE` offers `HD` and
# `FURY`, and that disc ships every loading-screen illustration twice -
# white-and-blue for the base game, black-and-red for Fury. Every other title in
# hand offers one, so the row shows a single value and states the fact rather
# than offering a choice that does nothing.
#
# Applies to the next loading screen, not to the one on screen - the
# illustration is decoded when the setting changes, which is a disc read and so
# happens in the menus rather than mid-load. See
# `Session::reload_loading_assets`.
[[page.entry]]
kind = "choice"
label = "FRONT END STYLE"
setting = "display.front_end_style"
values_from = "front_end_styles"

# `off` never waits and tears; `on` is classic vsync, which never tears and
# halves the rate when a frame misses a refresh; `smooth` is that miss handled
# properly - the newest finished frame is presented and the rest discarded.
#
# Defaults to `off` with the limit at 240: this is a racing game, vsync costs a
# frame of latency, and 240 is the top of the tier displays are built at so it
# caps nothing common while still bounding a menu page that would otherwise run
# at four figures.
[[page.entry]]
kind = "choice"
label = "VSYNC"
setting = "display.vsync"
values = ["off", "on", "smooth"]

# **Only `on` disables the limiter**, which is why the condition names a value
# rather than just a setting. `off` and `smooth` both leave the loop free to run
# ahead of the display, so a limit is live under either - and under `smooth` it
# is the only thing stopping the GPU rendering frames that get thrown away.
# Greyed and not hidden: a setting that vanishes gives a player no way to find
# out what took it away.
[[page.entry]]
kind = "choice"
label = "FRAME LIMIT"
setting = "display.frame_limit"
disabled_by = { setting = "display.vsync", value = "on" }
values = [
    "unlimited",
    "30",
    "60",
    "70",
    "72",
    "75",
    "90",
    "100",
    "120",
    "144",
    "165",
    "240",
    "360",
    "480",
    "1000",
]

# Both are applied by the blit that puts the finished frame on the surface, so
# both cover every stage and both show on this page as they are changed - which
# is the only way to calibrate a picture. Percentages: 100 leaves the frame
# alone, and both lists offer it so there is a way back.
#
# Brightness multiplies; gamma bends the midtones without moving black or
# white, which is the one that makes a dark corner of a track visible without
# washing out the rest. See `crates/game/src/upscale.rs`.
[[page.entry]]
kind = "choice"
label = "BRIGHTNESS"
setting = "display.brightness"
values = ["50", "75", "90", "100", "110", "125", "150"]

[[page.entry]]
kind = "choice"
label = "GAMMA"
setting = "display.gamma"
values = ["60", "80", "90", "100", "110", "120", "140"]

[[page.entry]]
kind = "back"
label = "BACK"

[[page]]
id = "graphics"
title = "GRAPHICS"

# Which adapter draws the picture. On this page and not DISPLAY because the line
# between the two is whether the renderer would notice, and *what the renderer
# is* is the most direct case of that there could be.
#
# The list is what this machine can present with, supplied at runtime - nothing
# writable here could describe a GPU. `default` is first and always, so there is
# a way back from an adapter that has since been uninstalled.
#
# **An entry marked `(cpu)` renders on the processor.** wgpu has no software
# renderer of its own; that entry appears only when the system has a software
# driver installed - Mesa lavapipe (`vulkan-swrast` on Arch,
# `mesa-vulkan-drivers` on Debian) or WARP on Windows - and is absent otherwise
# rather than being offered and failing. It is a diagnostic path, not a way to
# play: pair it with RENDER SCALE 50 to get something watchable.
#
# The only row on either settings page that cannot take effect this run. The
# device is made once, at boot, and every pipeline and uploaded mesh hangs off
# it. Not greyed and not warned - it is a live setting whose effect is simply
# deferred, which is the same thing LANGUAGE does - so it says so instead, from
# the moment it is moved off the adapter the game is actually drawing with. See
# `docs/architecture/menus.md`.
[[page.entry]]
kind = "choice"
label = "RENDERER"
setting = "graphics.renderer"
values_from = "renderers"
restart_required = "RESTART THE GAME TO DRAW WITH THIS"

# What percentage of the displayed size the game is actually rendered at.
# Below 100 is the usual internal-resolution knob, above it is supersampling,
# and it is measured against the aspect rectangle so it means the same thing at
# every aspect. Applies from the next frame.
#
# **It applies to a race and to nothing else**, since ADR-0038: a stage with no
# 3D scene draws at presentation resolution whatever this says, because scaling
# a menu saves nothing and only makes it blurrier. So a player moving this row
# sees the menu they are standing on not change - which is the one thing about
# it worth a warning, and there is no `warn_when` for "does nothing on this
# screen" as opposed to "does nothing given another row". Left as it is rather
# than stretched; see the ADR's consequences.
[[page.entry]]
kind = "choice"
label = "RENDER SCALE"
setting = "graphics.render_scale"
values = ["50", "75", "100", "125", "150", "200"]

# The frame rate a resolution controller aims for, and the row that turns it
# on: `off` is one of the values rather than a toggle beside it, because two
# keys that can disagree is a state somebody has to define behaviour for.
# Directly under RENDER SCALE because the pairing is the point - while this
# names a rate, that row is the **ceiling**, and the controller reads it and
# never writes it, so a loaded machine cannot make a chosen quality drift
# downward between sessions.
#
# **On an adapter with no GPU timer there is no signal and the extent never
# moves**, whatever this row says. It cannot be greyed out for that:
# `disabled_by` names a *setting*, and an adapter capability is not one - see
# `docs/architecture/menus.md`. The row is stored and inert, which is the same
# thing `restart_required` already means.
[[page.entry]]
kind = "choice"
label = "DYNAMIC RESOLUTION"
setting = "graphics.dynamic_resolution"
values = ["off", "30", "60", "90", "120", "144"]

# The lowest the controller may fall to, as a percentage of the aspect
# rectangle - the same unit and the same list RENDER SCALE uses, so a player
# can read the two rows against each other. Greyed while DYNAMIC RESOLUTION is
# off, because there is then nothing to bound.
#
# Warned rather than refused at a floor that is not below the ceiling: the
# setting is stored and starts working the moment the other row moves, which is
# exactly what UPSCALER's own warning means. `Condition` compares values and
# has no ordering - deliberately, it is what keeps the menu module ignorant of
# what any setting means - so the pairs are enumerated, and
# `the_floor_warns_at_exactly_the_scales_it_cannot_fall_below` generates the
# same set from `Scale::OFFERED` so this list cannot quietly stop matching.
[[page.entry]]
kind = "choice"
label = "DYNAMIC RESOLUTION FLOOR"
setting = "graphics.dynamic_resolution_floor"
values = ["50", "75", "100", "125", "150", "200"]
disabled_by = { setting = "graphics.dynamic_resolution", value = "off" }
warn_when = [
    { message = "A FLOOR AT OR ABOVE RENDER SCALE LEAVES NOTHING TO MOVE", all = [
        { setting = "graphics.dynamic_resolution_floor", value = "50" },
        { setting = "graphics.render_scale", values = ["50"] },
    ] },
    { message = "A FLOOR AT OR ABOVE RENDER SCALE LEAVES NOTHING TO MOVE", all = [
        { setting = "graphics.dynamic_resolution_floor", value = "75" },
        { setting = "graphics.render_scale", values = ["50", "75"] },
    ] },
    { message = "A FLOOR AT OR ABOVE RENDER SCALE LEAVES NOTHING TO MOVE", all = [
        { setting = "graphics.dynamic_resolution_floor", value = "100" },
        { setting = "graphics.render_scale", values = ["50", "75", "100"] },
    ] },
    { message = "A FLOOR AT OR ABOVE RENDER SCALE LEAVES NOTHING TO MOVE", all = [
        { setting = "graphics.dynamic_resolution_floor", value = "125" },
        { setting = "graphics.render_scale", values = ["50", "75", "100", "125"] },
    ] },
    { message = "A FLOOR AT OR ABOVE RENDER SCALE LEAVES NOTHING TO MOVE", all = [
        { setting = "graphics.dynamic_resolution_floor", value = "150" },
        { setting = "graphics.render_scale", values = ["50", "75", "100", "125", "150"] },
    ] },
    { message = "A FLOOR AT OR ABOVE RENDER SCALE LEAVES NOTHING TO MOVE", all = [
        { setting = "graphics.dynamic_resolution_floor", value = "200" },
        { setting = "graphics.render_scale", values = ["50", "75", "100", "125", "150", "200"] },
    ] },
]

# Which resampler carries the frame onto the surface. Directly below the render
# scale because only that pairing means anything: at 100 % there is nothing to
# upscale and the choice is between a blit and a sharpen. Applies from the next
# frame; the pipelines are built the first time `fsr1` is chosen.
#
# Has no effect at a render scale of 100 % or above: FSR 1 is a magnifier, and
# asked to minify it re-introduces the aliasing supersampling just removed, so
# `upscale::magnifies` declines to run it there.
#
# Warned rather than greyed, and the difference is who caused it. A greyed row
# cannot be changed now because another row rules it out. This one can be
# changed, is stored, and takes effect the moment the render scale comes back
# under 100 - it is the *combination* that does nothing, and greying would say
# "you cannot change this", which is false. The values listed are every one the
# RENDER SCALE row above offers at 100 or above; the loader rejects a value that
# row cannot hold, so this list cannot silently stop matching it.
[[page.entry]]
kind = "choice"
label = "UPSCALER"
setting = "graphics.upscaler"
values = ["off", "fsr1"]
warn_when = [
    { message = "NO EFFECT AT RENDER SCALE 100 OR ABOVE", all = [
        { setting = "graphics.upscaler", value = "fsr1" },
        { setting = "graphics.render_scale", values = ["100", "125", "150", "200"] },
    ] },
]

# How hard FSR 1's RCAS pass sharpens, in **stops**: 0 is maximum and each whole
# step halves it, which is upstream FidelityFX's own scale and runs the opposite
# way to what a reader expects. Greyed out on the bilinear path, which has no
# sharpen to adjust.
[[page.entry]]
kind = "choice"
label = "UPSCALER SHARPNESS"
setting = "graphics.upscale_sharpness"
values = ["0.0", "0.2", "0.5", "1.0", "2.0"]
disabled_by = { setting = "graphics.upscaler", value = "off" }

# Which anti-aliasing the scene draws with. MSAA, FXAA and SMAA are three
# different classes - rasterization, and two spatial post-process passes - not
# three quality tiers of one thing; see
# `docs/architecture/adr/0013-anti-aliasing-architecture.md`. There is no `taa`
# choice: temporal reconstruction needs motion vectors, jitter and a history
# buffer that do not exist yet.
#
# `off`, `fxaa` and `smaa` take effect the frame they are chosen, the same as
# UPSCALER: `Framebuffer::resolve` reads this fresh every frame. Only moving
# to or between the two MSAA levels waits for the next race, because that is
# what rebuilds the scene pipelines MSAA's sample count is baked into.
# `restart_required` is the same mechanism RENDERER uses, told from what the
# race on screen was actually built with rather than from the device - see
# `Session::open_menus` for how it tells the two cases above apart, which is
# why the message names a race instead of the game.
#
# Warned rather than greyed against the upscaler, for the same reason UPSCALER
# above warns against RENDER SCALE: FXAA and SMAA are spatial passes that blur
# before FSR 1's edge-adaptive EASU ever sees the picture, fighting the very
# edges it reasons about. The two render scales named are exactly the ones
# `upscale::magnifies` runs FSR 1 at - see
# `the_upscaler_warns_at_exactly_the_scales_it_does_nothing_at` for the
# equivalent pinning on the row above. MSAA is not named here: it resolves
# before any of this runs and composes with FSR 1 rather than fighting it.
#
# A second, independently-triggered warning for the render scale's *top* end:
# at 200% render scale is enough oversampling on its own that a spatial pass
# on top reads as redundant work, not a broken combination - real product
# policy per `docs/architecture/adr/0013-anti-aliasing-architecture.md`'s
# "What the render-scale tiers mean for FXAA/SMAA" section. Only "200" is
# named because it is the only value RENDER SCALE offers at or above it - see
# `Scale::OFFERED`.
[[page.entry]]
kind = "choice"
label = "ANTI-ALIASING"
setting = "graphics.anti_aliasing"
values = ["off", "fxaa", "smaa", "msaa4x"]
restart_required = "TAKES EFFECT THE NEXT TIME A RACE STARTS"
warn_when = [
    { message = "FIGHTS THE UPSCALER'S EDGE-ADAPTIVE RESAMPLE BELOW RENDER SCALE 100", all = [
        { setting = "graphics.anti_aliasing", values = ["fxaa", "smaa"] },
        { setting = "graphics.upscaler", value = "fsr1" },
        { setting = "graphics.render_scale", values = ["50", "75"] },
    ] },
    { message = "REDUNDANT ON TOP OF 200% RENDER SCALE SUPERSAMPLING", all = [
        { setting = "graphics.anti_aliasing", values = ["fxaa", "smaa"] },
        { setting = "graphics.render_scale", value = "200" },
    ] },
]

# A strength, not a boolean - each value is a shutter fraction of one
# simulation tick, and the technique underneath can improve without this row
# or anyone's settings file moving; it already has once, camera reprojection
# to `docs/rendering/motion-blur.md`'s per-object velocity buffer, with no
# migration. Applies live: `Scene::render` reads it fresh each frame, so no
# `restart_required`. No MSAA warning any more - the blur's prepare stage
# reads sample 0 of the multisampled attachments, so the combination works.
[[page.entry]]
kind = "choice"
label = "MOTION BLUR"
setting = "graphics.motion_blur"
values = ["off", "low", "medium", "high"]

# Applies to the next race built rather than immediately: the sampler is made
# when a race's pipelines are.
[[page.entry]]
kind = "choice"
label = "ANISOTROPIC FILTERING"
setting = "graphics.anisotropy"
values = ["off", "2x", "4x", "8x", "16x"]

# Which of the original's three in-race perspectives to fly with. The set and the
# order are **recovered** (confidence 88): `Camera_UpdatePlayerView` rotates one
# profile setting through exactly these three, in this order, wrapping - see
# `docs/ghidra/functions/psp-pulse-usa/camera.md`. Which one a fresh install
# starts on is *not* recovered; `far` is this project's choice, being what the
# game rendered before the other two existed.
#
# The values are listed in the cycle's own order rather than nearest-first, so
# moving the row and pressing the in-race cycle button (SELECT, or TAB on a
# keyboard) walk the same sequence. No `restart_required`: this one applies to a
# race already running, which is the whole point of there being a button for it.
[[page.entry]]
kind = "choice"
label = "CAMERA VIEW"
setting = "graphics.camera_view"
values = ["internal", "close", "far"]

# A **percentage of the field of view the disc's own data authored**, not an
# angle. `<ExternalCameraFar fov>` comes off the disc and its unit is
# unrecovered, so a row that let a player type `90` would be quietly asserting a
# unit this project has not established; a multiplier says what it does without
# claiming to know what the number underneath means. 100 is the authored value,
# and it is the default. Applies from the next frame a race draws.
[[page.entry]]
kind = "choice"
label = "FIELD OF VIEW"
setting = "graphics.fov"
values = ["75", "90", "100", "110", "125", "150", "175"]

# How much a boost pad widens the field of view for a moment. **Invented, not
# recovered** - nothing read out of either binary does this; the force it
# rides on is real, this is authored so the player can feel it. 0 turns it
# off, for comparing against a capture of the original, which has no such
# effect. 8 is the original on/off toggle's subtler "on"; the default is 16,
# one tier stronger, because 8 read as nothing happening to a player not
# already watching for it; 32 is stronger still - see
# `oag_game::display::BoostFovKick`.
#
# `restart_required` here means the same thing it does on ANTI-ALIASING's MSAA
# levels above: the running race already baked this into `Race::start` and
# will not pick up a change until the next one does.
[[page.entry]]
kind = "choice"
label = "BOOST FOV KICK"
setting = "graphics.boost_fov_kick"
values = ["0", "8", "16", "32"]
restart_required = "TAKES EFFECT THE NEXT TIME A RACE STARTS"

# `fps` is one line of numbers; `pacing` adds the graph, which is the one that
# shows uneven frames - an average frame rate is exactly what hides them.
# `dev` adds a third line of scene counts (draw calls, triangles). Drawn over
# every stage from the next frame, into the offscreen target and so at the
# render scale - which is why it is on this page and not DISPLAY. See
# `crates/game/src/perf.rs`.
[[page.entry]]
kind = "choice"
label = "PERFORMANCE OVERLAY"
setting = "graphics.perf_overlay"
values = ["off", "fps", "pacing", "dev"]

[[page.entry]]
kind = "back"
label = "BACK"

[[page]]
id = "audio"
title = "AUDIO"

# Two bus rows, because the original's options menu has exactly two volumes and
# no more: `"Music Volume"` at `0x08a78658` and `"SFX Volume"` at `0x08a78668`.
# The second one earned its row when the sound banks started decoding - see
# `oag_game::audio::sfx`.
#
# Applied on the next tick - the change goes straight onto the bus's gain, so it
# is audible on the row the player is standing on rather than after a restart,
# the way BRIGHTNESS is visible on its own page. Zero is offered and means
# silence: unlike a black screen there is no way to get lost in it.
[[page.entry]]
kind = "choice"
label = "MUSIC VOLUME"
setting = "audio.music_volume"
values = ["0", "25", "50", "75", "90", "100"]

[[page.entry]]
kind = "choice"
label = "SFX VOLUME"
setting = "audio.sfx_volume"
values = ["0", "25", "50", "75", "90", "100"]

# The announcer, on its own row because the original puts voice lines in their
# own bank: `shieldactive` is in `speech.bnk` and not beside the `~SHIELD` loop
# it fires with, which is already how `oag_game::audio::sfx` tells a callout
# from an effect. See `docs/architecture/adr/0027-three-mix-buses.md`.
#
# **Two cues reach it today** - the shield callout and the Autopilot's
# one-second warning - because those are the only voice lines whose trigger has
# been recovered. Moving this row changes nothing in a race where the player
# collects neither.
[[page.entry]]
kind = "choice"
label = "ANNOUNCER VOLUME"
setting = "audio.speech_volume"
values = ["0", "25", "50", "75", "90", "100"]

# The last is ours, and it is here because the mix has no headroom to give.
# The original's chain runs unity end to end and lets the hardware saturate
# (`docs/ghidra/functions/psp-pulse-usa/audio-levels.md`), and eight craft on
# the grid clear full scale on the effects bus alone - so a player who wants
# the race not to distort should be able to turn *everything* down at once
# instead of keeping the two rows above in step. It moves the same master stage
# the original has and does not expose: group `0x10`, which `Audio_Init` opens
# at `0x400`.
#
# Below the two it scales, which is the order it applies in.
[[page.entry]]
kind = "choice"
label = "MASTER VOLUME"
setting = "audio.master_volume"
values = ["0", "25", "50", "75", "90", "100"]

# Which release's encode of the **soundtrack** plays. Only the sixteen
# soundtrack tracks have a proven counterpart on the other disc - a 16-for-16
# bijection, mean duration gap 11 ms, side-signal correlation +0.98, see
# `docs/formats/ps2-audio.md`. Voice and every `.bnk` stay on the disc the game
# booted from, because nothing pairs them.
#
# **It does not govern the front end's own music, and that is not a bug.** The
# PSP release has menu music written for it, a 28-second loop that is not one of
# the sixteen and has no PS2 counterpart at all, so there is nothing for this
# row to choose between and a PSP boot sounds the same at every value. The PS2
# release has no menu music of its own that has been found and plays soundtrack
# track 0 under its menus, so the row does move that. The asymmetry is the
# discs'; nothing here adds music to a screen that had none.
#
# The values are supplied at runtime rather than listed here, because what is on
# offer depends on which discs the player owns: `auto`, `psp` and `ps2` on a
# machine that has both, and nothing at all on one that has one, where the row
# draws unusable. `auto` is the booted disc - the PSP release is meant to sound
# like the PSP release, compression included.
#
# Changing it **seeks rather than restarts**: the playhead is carried across in
# seconds, and the two encodes of a track agree in length to 11 ms, so the same
# offset lands in the same bar. See `crates/game/src/audio.rs`.
[[page.entry]]
kind = "choice"
label = "MUSIC SOURCE"
setting = "audio.music_source"
values_from = "music_sources"

[[page.entry]]
kind = "back"
label = "BACK"

[[page]]
id = "controls"
title = "CONTROLS"

# Read-only in this build. `oag_input::keys::map_key` is a hardcoded match, so
# rebinding needs a table, persistence and conflict handling before a row here
# can do anything; these exist so what is bound is visible in the game rather
# than only in that file, and so the format does not have to change when
# rebinding lands.
[[page.entry]]
kind = "binding"
label = "THRUST"
button = "cross"

[[page.entry]]
kind = "binding"
label = "BRAKE"
button = "circle"

[[page.entry]]
kind = "binding"
label = "STEER LEFT"
button = "left"

[[page.entry]]
kind = "binding"
label = "STEER RIGHT"
button = "right"

[[page.entry]]
kind = "binding"
label = "PITCH UP"
button = "up"

[[page.entry]]
kind = "binding"
label = "PITCH DOWN"
button = "down"

[[page.entry]]
kind = "binding"
label = "AIRBRAKE LEFT"
button = "l"

[[page.entry]]
kind = "binding"
label = "AIRBRAKE RIGHT"
button = "r"

# Not one of the original's eight driving bindings, and listed here anyway: the
# in-race camera cycle is the one control a player has no other way to discover.
# It is bound (SELECT on a pad, TAB on a keyboard, through
# `oag_input::keys::map_key`) and it works, but until this row existed the only
# record of it was a source comment - so the feature was effectively invisible.
# `bound_keys` fills the right-hand column from the input layer, so this row says
# whatever is actually bound rather than a hardcoded key name.
[[page.entry]]
kind = "binding"
label = "CAMERA VIEW"
button = "select"

# The one row on this page that is not read-only, and the reason it sits below
# the bindings rather than above them: it does not rebind anything. It chooses
# which *gesture* a sideshift takes, which is the original's own `Control_Type`
# and the reason the bindings above differ between the two - veteran spends both
# shoulders on the separate airbrakes, novice gives one of them to the sideshift
# and puts both airbrakes on the other. See
# `docs/ghidra/functions/psp-pulse-usa/input-bindings.md`.
#
# The values are the binary's own tokens, not labels this project chose, so a
# `custom` third value is deliberately absent: in the original that is a
# rebinding of whichever scheme is live, and rebinding is what this page cannot
# do yet.
[[page.entry]]
kind = "choice"
label = "SIDESHIFT"
setting = "controls.scheme"
values = ["veteran", "novice"]

# The other two rows that are not read-only, and the only ones on this page
# about hardware the original never had: the PSP has no analog triggers. So
# neither is recovered behaviour, and neither is a rebinding - the shoulders are
# the airbrakes whatever these say. `airbrakes` puts an airbrake on each trigger
# and thrust back on cross alone; `thrust_brake` is the older mapping, where R2
# is a second thrust button and L2 pulls both airbrakes together. See
# `oag_input::pad::TriggerMode`.
[[page.entry]]
kind = "choice"
label = "TRIGGERS"
setting = "controls.triggers"
values = ["airbrakes", "thrust_brake"]

# How much airbrake a given pull asks for, as a percentage of a linear one.
# Ordered low to high rather than default-first, the way BRIGHTNESS is: the
# first value only decides what the row opens on when nothing *seeds* it, and
# `settings::menu_seeds` seeds this one. The list must agree with
# `settings::TriggerSensitivity::OFFERED`, which a test asserts.
[[page.entry]]
kind = "choice"
label = "TRIGGER SENSITIVITY"
setting = "controls.trigger_sensitivity"
values = ["50", "75", "100", "125", "150", "200"]

[[page.entry]]
kind = "back"
label = "BACK"
