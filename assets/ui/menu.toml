# OpenAntiGrav's menu tree.
#
# This file is OURS. It is not a transcription of the disc's
# `MainMenu_Definition.xml` and is not meant to become one: this project needs
# the menus a PC game has (input bindings, graphics settings) and the original
# had no reason to carry those. See `crates/game/src/menu.rs` for the reasoning
# and for the format.
#
# Rules the loader enforces, so a mistake here is a startup error rather than a
# row that does nothing when pressed:
#
#   - every `target` names a page in this file;
#   - every `action` is one the game handles: launch_race, quit;
#   - every `button` is an abstract button name;
#   - every page is reachable from `root`.
#
# Edit it and run `cargo nextest run -p oag-game menu::` to check it, or pass
# `--menu <path>` to try a copy without rebuilding.
#
# Labels are literal text on purpose. `string_id` is reserved for a build that
# wants the original's own wording out of the disc's string table, and nothing
# reads it yet.
#
# Identifiers in `values` are archive path components, never display names:
# `Assegai` is a directory on the disc. Anything a player should read in their
# own language comes from the source at runtime through `values_from`, so no
# shipped content ever lands in this file. See
# `docs/architecture/adr/0006-no-copyrighted-content.md`.

version = 1
root = "main"

[[page]]
id = "main"
title = "OPENANTIGRAV"

[[page.entry]]
kind = "submenu"
label = "RACE"
target = "race"

[[page.entry]]
kind = "submenu"
label = "OPTIONS"
target = "options"

[[page.entry]]
kind = "action"
label = "QUIT"
action = "quit"

[[page]]
id = "race"
title = "RACE"

# Mode first, because it is the thing that decides what the other rows mean: a
# zone run ignores the lap count a time trial is built around.
#
# `values_from` rather than a list, even though the set is fixed at
# `oag_race::Mode::ALL`: what the row *shows* is the front end's own event text
# off the player's disc, in their language, so it cannot be spelled here. The
# stored values are still the mode tokens.
[[page.entry]]
kind = "choice"
label = "MODE"
setting = "race.mode"
values_from = "race_modes"

# Speed class, team and track are the three things `race::Options` actually
# carries, so all three are live rather than decorative. The values are the
# ones `SpeedClass::from_name` and the disc's own directory layout accept; a
# value this list offers that the source does not have fails at load with the
# entry name in the message, which is the honest failure.
[[page.entry]]
kind = "choice"
label = "SPEED CLASS"
setting = "race.class"
values = ["venom", "flash", "rapier", "phantom"]

# Zone forces the shared Zone hull regardless of team (see
# `oag_game::race::ship_entry_name`), so the row is greyed rather than
# offered as if it still picked the drawn model.
[[page.entry]]
kind = "choice"
label = "TEAM"
setting = "race.team"
values = [
    "AG_Systems",
    "Assegai",
    "EGX",
    "Feisar",
    "Goteki",
    "Piranha",
    "Qirex",
    "Triakis",
]
disabled_by = { setting = "race.mode", value = "zone" }

# The circuits come from the source, not from this file, and so do their names:
# `values_from = "tracks"` reads `Data\Plugins\PI001\Definition.xml` for what
# is raceable and the language's own string table for what to call it. That is
# why there is no list here and no separate LAYOUT row - a reversed circuit is
# its own entry in that file, with its own id and its own name.
[[page.entry]]
kind = "choice"
label = "TRACK"
setting = "race.track"
values_from = "tracks"

[[page.entry]]
kind = "action"
label = "START"
action = "launch_race"

[[page.entry]]
kind = "back"
label = "BACK"

[[page]]
id = "options"
title = "OPTIONS"

# Two pages and not one, and the line between them is whether the renderer
# would notice. DISPLAY is the picture's container and how a finished frame
# reaches a screen; GRAPHICS is how the picture is drawn. Turning vsync off
# changes nothing about the frame, only about when it is shown; halving the
# render scale changes the frame itself. The settings file is split the same
# way, into `[display]` and `[graphics]` - see `crates/game/src/settings.rs`.
[[page.entry]]
kind = "submenu"
label = "DISPLAY"
target = "display"

[[page.entry]]
kind = "submenu"
label = "GRAPHICS"
target = "graphics"

[[page.entry]]
kind = "submenu"
label = "CONTROLS"
target = "controls"

# Also read from the source. Changing it takes effect on the **next launch**:
# the string table is loaded once at boot, and reloading it under a front end
# that has already handed off is work nothing needs yet. Picking a language here
# also means the picker stays skipped, since that is the same setting.
[[page.entry]]
kind = "choice"
label = "LANGUAGE"
setting = "language"
values_from = "languages"

[[page.entry]]
kind = "back"
label = "BACK"

[[page]]
id = "display"
title = "DISPLAY"

# The screens this machine has, read at runtime the way the tracks and the
# languages are: a definition file cannot know them, and a compositor is free to
# rename or unplug one between launches. `default` is always offered and always
# first, because it is the way back from a screen that is no longer there. The
# setting stores a **name**, not an index - see `crates/game/src/display.rs`.
#
# Borderless carries the choice in the fullscreen request; windowed has nothing
# to carry it, so the window is centred on the chosen screen instead. Either
# way the compositor may refuse, and a tiling one will.
[[page.entry]]
kind = "choice"
label = "MONITOR"
setting = "display.monitor"
values_from = "monitors"

# Window mode and size apply the moment they change. A compositor is free to
# ignore a size request, and a tiling one will - nothing depends on it being
# honoured.
[[page.entry]]
kind = "choice"
label = "WINDOW MODE"
setting = "display.window_mode"
values = ["windowed", "borderless"]

[[page.entry]]
kind = "choice"
label = "WINDOW SIZE"
setting = "display.window_size"
values = ["960x544", "1280x720", "1440x816", "1600x900", "1920x1080", "2560x1440"]

# The shape the game is drawn at inside whatever window it got, with the
# leftover left black. `psp` is 480x272, the shape every camera value on the
# disc was authored for; `ps2` is 4:3; `free` fills the window without widening
# the field of view, because nothing on the disc says what the original would
# have shown on a 21:9 screen.
[[page.entry]]
kind = "choice"
label = "ASPECT RATIO"
setting = "display.aspect"
values = ["psp", "ps2", "free"]

# `off` never waits and tears; `on` is classic vsync, which never tears and
# halves the rate when a frame misses a refresh; `smooth` is that miss handled
# properly - the newest finished frame is presented and the rest discarded.
#
# Defaults to `off` with the limit at 240: this is a racing game, vsync costs a
# frame of latency, and 240 is the top of the tier displays are built at so it
# caps nothing common while still bounding a menu page that would otherwise run
# at four figures.
[[page.entry]]
kind = "choice"
label = "VSYNC"
setting = "display.vsync"
values = ["off", "on", "smooth"]

# **Only `on` disables the limiter**, which is why the condition names a value
# rather than just a setting. `off` and `smooth` both leave the loop free to run
# ahead of the display, so a limit is live under either - and under `smooth` it
# is the only thing stopping the GPU rendering frames that get thrown away.
# Greyed and not hidden: a setting that vanishes gives a player no way to find
# out what took it away.
[[page.entry]]
kind = "choice"
label = "FRAME LIMIT"
setting = "display.frame_limit"
disabled_by = { setting = "display.vsync", value = "on" }
values = [
    "unlimited",
    "30",
    "60",
    "70",
    "72",
    "75",
    "90",
    "100",
    "120",
    "144",
    "165",
    "240",
    "360",
    "480",
    "1000",
]

# Both are applied by the blit that puts the finished frame on the surface, so
# both cover every stage and both show on this page as they are changed - which
# is the only way to calibrate a picture. Percentages: 100 leaves the frame
# alone, and both lists offer it so there is a way back.
#
# Brightness multiplies; gamma bends the midtones without moving black or
# white, which is the one that makes a dark corner of a track visible without
# washing out the rest. See `crates/game/src/upscale.rs`.
[[page.entry]]
kind = "choice"
label = "BRIGHTNESS"
setting = "display.brightness"
values = ["50", "75", "90", "100", "110", "125", "150"]

[[page.entry]]
kind = "choice"
label = "GAMMA"
setting = "display.gamma"
values = ["60", "80", "90", "100", "110", "120", "140"]

[[page.entry]]
kind = "back"
label = "BACK"

[[page]]
id = "graphics"
title = "GRAPHICS"

# Which adapter draws the picture. On this page and not DISPLAY because the line
# between the two is whether the renderer would notice, and *what the renderer
# is* is the most direct case of that there could be.
#
# The list is what this machine can present with, supplied at runtime - nothing
# writable here could describe a GPU. `default` is first and always, so there is
# a way back from an adapter that has since been uninstalled.
#
# **An entry marked `(cpu)` renders on the processor.** wgpu has no software
# renderer of its own; that entry appears only when the system has a software
# driver installed - Mesa lavapipe (`vulkan-swrast` on Arch,
# `mesa-vulkan-drivers` on Debian) or WARP on Windows - and is absent otherwise
# rather than being offered and failing. It is a diagnostic path, not a way to
# play: pair it with RENDER SCALE 50 to get something watchable.
#
# The only row on either settings page that cannot take effect this run. The
# device is made once, at boot, and every pipeline and uploaded mesh hangs off
# it. Not greyed and not warned - it is a live setting whose effect is simply
# deferred, which is the same thing LANGUAGE does - so it says so instead, from
# the moment it is moved off the adapter the game is actually drawing with. See
# `docs/architecture/menus.md`.
[[page.entry]]
kind = "choice"
label = "RENDERER"
setting = "graphics.renderer"
values_from = "renderers"
restart_required = "RESTART THE GAME TO DRAW WITH THIS"

# What percentage of the displayed size the game is actually rendered at.
# Below 100 is the usual internal-resolution knob, above it is supersampling,
# and it is measured against the aspect rectangle so it means the same thing at
# every aspect. Applies from the next frame.
[[page.entry]]
kind = "choice"
label = "RENDER SCALE"
setting = "graphics.render_scale"
values = ["50", "75", "100", "125", "150", "200"]

# Which resampler carries the frame onto the surface. Directly below the render
# scale because only that pairing means anything: at 100 % there is nothing to
# upscale and the choice is between a blit and a sharpen. Applies from the next
# frame; the pipelines are built the first time `fsr1` is chosen.
#
# Has no effect at a render scale of 100 % or above: FSR 1 is a magnifier, and
# asked to minify it re-introduces the aliasing supersampling just removed, so
# `upscale::magnifies` declines to run it there.
#
# Warned rather than greyed, and the difference is who caused it. A greyed row
# cannot be changed now because another row rules it out. This one can be
# changed, is stored, and takes effect the moment the render scale comes back
# under 100 - it is the *combination* that does nothing, and greying would say
# "you cannot change this", which is false. The values listed are every one the
# RENDER SCALE row above offers at 100 or above; the loader rejects a value that
# row cannot hold, so this list cannot silently stop matching it.
[[page.entry]]
kind = "choice"
label = "UPSCALER"
setting = "graphics.upscaler"
values = ["off", "fsr1"]
warn_when = { message = "NO EFFECT AT RENDER SCALE 100 OR ABOVE", all = [
    { setting = "graphics.upscaler", value = "fsr1" },
    { setting = "graphics.render_scale", values = ["100", "125", "150", "200"] },
] }

# How hard FSR 1's RCAS pass sharpens, in **stops**: 0 is maximum and each whole
# step halves it, which is upstream FidelityFX's own scale and runs the opposite
# way to what a reader expects. Greyed out on the bilinear path, which has no
# sharpen to adjust.
[[page.entry]]
kind = "choice"
label = "UPSCALER SHARPNESS"
setting = "graphics.upscale_sharpness"
values = ["0.0", "0.2", "0.5", "1.0", "2.0"]
disabled_by = { setting = "graphics.upscaler", value = "off" }

# Which anti-aliasing the scene draws with. MSAA, FXAA and SMAA are three
# different classes - rasterization, and two spatial post-process passes - not
# three quality tiers of one thing; see
# `docs/architecture/adr/0013-anti-aliasing-architecture.md`. There is no `taa`
# choice: temporal reconstruction needs motion vectors, jitter and a history
# buffer that do not exist yet.
#
# `off`, `fxaa` and `smaa` take effect the frame they are chosen, the same as
# UPSCALER: `Framebuffer::resolve` reads this fresh every frame. Only moving
# to or between the two MSAA levels waits for the next race, because that is
# what rebuilds the scene pipelines MSAA's sample count is baked into.
# `restart_required` is the same mechanism RENDERER uses, told from what the
# race on screen was actually built with rather than from the device - see
# `Session::open_menus` for how it tells the two cases above apart, which is
# why the message names a race instead of the game.
#
# Warned rather than greyed against the upscaler, for the same reason UPSCALER
# above warns against RENDER SCALE: FXAA and SMAA are spatial passes that blur
# before FSR 1's edge-adaptive EASU ever sees the picture, fighting the very
# edges it reasons about. The two render scales named are exactly the ones
# `upscale::magnifies` runs FSR 1 at - see
# `the_upscaler_warns_at_exactly_the_scales_it_does_nothing_at` for the
# equivalent pinning on the row above. MSAA is not named here: it resolves
# before any of this runs and composes with FSR 1 rather than fighting it.
[[page.entry]]
kind = "choice"
label = "ANTI-ALIASING"
setting = "graphics.anti_aliasing"
values = ["off", "fxaa", "smaa", "msaa4x"]
restart_required = "TAKES EFFECT THE NEXT TIME A RACE STARTS"
warn_when = { message = "FIGHTS THE UPSCALER'S EDGE-ADAPTIVE RESAMPLE BELOW RENDER SCALE 100", all = [
    { setting = "graphics.anti_aliasing", values = ["fxaa", "smaa"] },
    { setting = "graphics.upscaler", value = "fsr1" },
    { setting = "graphics.render_scale", values = ["50", "75"] },
] }

# Applies to the next race built rather than immediately: the sampler is made
# when a race's pipelines are.
[[page.entry]]
kind = "choice"
label = "ANISOTROPIC FILTERING"
setting = "graphics.anisotropy"
values = ["off", "2x", "4x", "8x", "16x"]

# A **percentage of the field of view the disc's own data authored**, not an
# angle. `<ExternalCameraFar fov>` comes off the disc and its unit is
# unrecovered, so a row that let a player type `90` would be quietly asserting a
# unit this project has not established; a multiplier says what it does without
# claiming to know what the number underneath means. 100 is the authored value,
# and it is the default. Applies from the next frame a race draws.
[[page.entry]]
kind = "choice"
label = "FIELD OF VIEW"
setting = "graphics.fov"
values = ["75", "90", "100", "110", "125", "150", "175"]

# How much a boost pad widens the field of view for a moment. **Invented, not
# recovered** - nothing read out of either binary does this; the force it
# rides on is real, this is authored so the player can feel it. 0 turns it
# off, for comparing against a capture of the original, which has no such
# effect. 8 is the original on/off toggle's subtler "on"; the default is 16,
# one tier stronger, because 8 read as nothing happening to a player not
# already watching for it; 32 is stronger still - see
# `oag_game::display::BoostFovKick`.
#
# `restart_required` here means the same thing it does on ANTI-ALIASING's MSAA
# levels above: the running race already baked this into `Race::start` and
# will not pick up a change until the next one does.
[[page.entry]]
kind = "choice"
label = "BOOST FOV KICK"
setting = "graphics.boost_fov_kick"
values = ["0", "8", "16", "32"]
restart_required = "TAKES EFFECT THE NEXT TIME A RACE STARTS"

# `fps` is one line of numbers; `pacing` adds the graph, which is the one that
# shows uneven frames - an average frame rate is exactly what hides them.
# `dev` adds a third line of scene counts (draw calls, triangles). Drawn over
# every stage from the next frame, into the offscreen target and so at the
# render scale - which is why it is on this page and not DISPLAY. See
# `crates/game/src/perf.rs`.
[[page.entry]]
kind = "choice"
label = "PERFORMANCE OVERLAY"
setting = "graphics.perf_overlay"
values = ["off", "fps", "pacing", "dev"]

[[page.entry]]
kind = "back"
label = "BACK"

[[page]]
id = "controls"
title = "CONTROLS"

# Read-only in this build. `oag_input::keys::map_key` is a hardcoded match, so
# rebinding needs a table, persistence and conflict handling before a row here
# can do anything; these exist so what is bound is visible in the game rather
# than only in that file, and so the format does not have to change when
# rebinding lands.
[[page.entry]]
kind = "binding"
label = "THRUST"
button = "cross"

[[page.entry]]
kind = "binding"
label = "BRAKE"
button = "circle"

[[page.entry]]
kind = "binding"
label = "STEER LEFT"
button = "left"

[[page.entry]]
kind = "binding"
label = "STEER RIGHT"
button = "right"

[[page.entry]]
kind = "binding"
label = "PITCH UP"
button = "up"

[[page.entry]]
kind = "binding"
label = "PITCH DOWN"
button = "down"

[[page.entry]]
kind = "binding"
label = "AIRBRAKE LEFT"
button = "l"

[[page.entry]]
kind = "binding"
label = "AIRBRAKE RIGHT"
button = "r"

# The one row on this page that is not read-only, and the reason it sits below
# the bindings rather than above them: it does not rebind anything. It chooses
# which *gesture* a sideshift takes, which is the original's own `Control_Type`
# and the reason the bindings above differ between the two - veteran spends both
# shoulders on the separate airbrakes, novice gives one of them to the sideshift
# and puts both airbrakes on the other. See
# `docs/ghidra/functions/psp-pulse/input-bindings.md`.
#
# The values are the binary's own tokens, not labels this project chose, so a
# `custom` third value is deliberately absent: in the original that is a
# rebinding of whichever scheme is live, and rebinding is what this page cannot
# do yet.
[[page.entry]]
kind = "choice"
label = "SIDESHIFT"
setting = "controls.scheme"
values = ["veteran", "novice"]

[[page.entry]]
kind = "back"
label = "BACK"
