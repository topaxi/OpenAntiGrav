[[page.entry]]
kind = "choice"
label = "TRACK"
string_id = "OAG_RACE_TRACK"
setting = "remix.track"
values_from = "remix_tracks"

[[page.entry]]
kind = "choice"
label = "CRAFT TITLE"
string_id = "OAG_REMIX_CRAFT_TITLE"
setting = "remix.craft_title"
values_from = "craft_titles"

[[page.entry]]
kind = "choice"
label = "TEAM"
string_id = "OAG_RACE_TEAM"
setting = "remix.team"
values_from = "remix_teams"
disabled_by = { setting = "race.mode", value = "zone" }

# Most teams offer nothing here - `values_from = "remix_variant"` is supplied
# empty for them, the same idiom MUSIC SOURCE uses on a machine with one
# disc, which draws the row unusable rather than lying about having a choice.
# Wipeout 2048's five-team roster and Wipeout HD/Fury's twelve are the ones
# today whose teams carry more than one selectable directory - and 2048
# reships HD/Fury's twelve, so this row is what reaches them there too.
[[page.entry]]
kind = "choice"
label = "VARIANT"
string_id = "OAG_RACE_VARIANT"
setting = "remix.variant"
values_from = "remix_variant"
disabled_by = { setting = "race.mode", value = "zone" }

[[page.entry]]
kind = "action"
label = "START"
string_id = "OAG_RACE_START"
action = "launch_remix"

[[page.entry]]
kind = "back"
label = "BACK"
string_id = "OAG_MENU_BACK"

# **The disc authors this screen too, and this page follows its shape rather
# than inventing one.** `Data\Plugins\PI001\GUI\RecordGrid_Definition.xml`
# (in `Data.wad`, on the same `Skin.xml` `LoadXML` list `docs/formats/
# fe-menu-definitions.md` already named but had not read) is a "Record Grid"
# screen with four sub-screens - Speed Lap, Time Trial, Race and Zone
# Records - each a track picker over a table with one row per speed class
# and a TIME column. See `docs/architecture/menus.md`'s own RECORDS section
# for the read, the confidence score, and exactly which columns this page
# draws against which it leaves out.
#
# MODE stands in for the disc's four separate sub-screens - **that
# collapsing is ours**, since this project's own persisted schema
# (`oag_game::records::Record`) is one row per (track, mode, class), not four
# hand-authored layouts. TRACK and the four per-class rows below it are the
# disc's own shape.
#
# **Shares `race.mode`/`race.track` with the RACE page, and that is all** -
# the same precedent RACE REMIX's own MODE row already set: browsing here
# moves what a launched race would use, which is a feature, not a leak - see
# that page's own comment above.
[[page]]
id = "records"
title = "RACE RECORDS"
title_string_id = "OAG_RECORDS_PAGE_TITLE"

[[page.entry]]
kind = "choice"
label = "MODE"
string_id = "OAG_RACE_MODE"
setting = "race.mode"
values_from = "race_modes"

[[page.entry]]
kind = "choice"
label = "TRACK"
string_id = "OAG_RACE_TRACK"
setting = "race.track"
values_from = "tracks"

[[page.entry]]
kind = "back"
label = "BACK"
string_id = "OAG_MENU_BACK"

[[page]]
id = "options"
title = "OPTIONS"
title_string_id = "OAG_OPTIONS_PAGE_TITLE"

# Two pages and not one, and the line between them is whether the renderer
# would notice. DISPLAY is the picture's container and how a finished frame
# reaches a screen; GRAPHICS is how the picture is drawn. Turning vsync off
# changes nothing about the frame, only about when it is shown; halving the
# render scale changes the frame itself. The settings file is split the same
# way, into `[display]` and `[graphics]` - see `crates/game/src/settings.rs`.
[[page.entry]]
kind = "submenu"
label = "DISPLAY"
string_id = "OAG_OPTIONS_DISPLAY"
target = "display"

[[page.entry]]
kind = "submenu"
label = "GRAPHICS"
string_id = "OAG_OPTIONS_GRAPHICS"
target = "graphics"

[[page.entry]]
kind = "submenu"
label = "AUDIO"
string_id = "OAG_OPTIONS_AUDIO"
target = "audio"

[[page.entry]]
kind = "submenu"
label = "CONTROLS"
string_id = "OAG_OPTIONS_CONTROLS"
target = "controls"

# Ours - no disc has ever shipped a pilot editor, because pilots are this
# project's own invention. See `crates/game/src/pilots.rs`.
[[page.entry]]
kind = "submenu"
label = "AI PILOTS"
string_id = "OAG_PILOT_PAGE_TITLE"
target = "pilots"

# Also read from the source. Applied live, not on the next launch:
# `Session::apply_setting`'s own "language" row calls `Session::resupply_language`,
# which re-reads the source under the language just picked and re-supplies this
# page's own rows (and TEAM/CIRCUIT/RACE MODE's) without losing the player's
# place in the menu - see `docs/architecture/menus.md#switching-language-without-relaunching`.
# Picking a language here also means the picker stays skipped, since that is
# the same setting.
[[page.entry]]
kind = "choice"
label = "LANGUAGE"
string_id = "OAG_OPTIONS_LANGUAGE"
setting = "language"
values_from = "languages"

[[page.entry]]
kind = "back"
label = "BACK"
string_id = "OAG_MENU_BACK"

[[page]]
id = "display"
title = "DISPLAY"
title_string_id = "OAG_OPTIONS_DISPLAY"

# The screens this machine has, read at runtime the way the tracks and the
# languages are: a definition file cannot know them, and a compositor is free to
# rename or unplug one between launches. `default` is always offered and always
# first, because it is the way back from a screen that is no longer there. The
# setting stores a **name**, not an index - see `crates/game/src/display.rs`.
#
# Borderless carries the choice in the fullscreen request; windowed has nothing
# to carry it, so the window is centred on the chosen screen instead. Either
# way the compositor may refuse, and a tiling one will.
[[page.entry]]
kind = "choice"
label = "MONITOR"
string_id = "OAG_DISPLAY_MONITOR"
setting = "display.monitor"
values_from = "monitors"

# Window mode and size apply the moment they change. A compositor is free to
# ignore a size request, and a tiling one will - nothing depends on it being
# honoured.
[[page.entry]]
kind = "choice"
label = "WINDOW MODE"
string_id = "OAG_DISPLAY_WINDOW_MODE"
setting = "display.window_mode"
values = ["windowed", "borderless"]

[[page.entry]]
kind = "choice"
label = "WINDOW SIZE"
string_id = "OAG_DISPLAY_WINDOW_SIZE"
setting = "display.window_size"
values = ["960x544", "1280x720", "1440x816", "1600x900", "1920x1080", "2560x1440"]

# The web build's stand-in for WINDOW SIZE: a page has no window, so this sizes
# the canvas instead, `fit` being the whole page. Dropped on a desktop and
# WINDOW SIZE on the web - see `settings::web`.
[[page.entry]]
kind = "choice"
label = "CANVAS SIZE"
string_id = "OAG_DISPLAY_CANVAS_SIZE"
setting = "display.canvas_size"
values = ["fit", "960x544", "1280x720", "1440x816", "1600x900", "1920x1080", "2560x1440"]

# The shape the game is drawn at inside whatever window it got, with the
# leftover left black. These name *shapes*, not machines: `psp` is 30:17, which
# is the PSP's 480x272 and the Vita's 960x544 both - the same ratio exactly -
# and the shape every camera value on the disc was authored for; `ps2` is 4:3;
# `wide` is 16:9, which is 720p, 1080p and Wipeout HD's own 1920x1080; `free`
# fills the window without widening the field of view, because nothing on the
# disc says what the original would have shown on a 21:9 screen.
#
# A settings file or `--aspect` may also spell any shape as `w:h`. That is not
# offered here because there is no finite list of them to offer.
[[page.entry]]
kind = "choice"
label = "ASPECT RATIO"
string_id = "OAG_DISPLAY_ASPECT_RATIO"
setting = "display.aspect"
values = ["psp", "ps2", "wide", "free"]

# Which of the source's own front-end stylings to draw. The values are the
# *disc's*, not this build's: Wipeout HD's `OPT_FE_STYLE` offers `HD` and
# `FURY`, and that disc ships every loading-screen illustration twice -
# white-and-blue for the base game, black-and-red for Fury. Every other title in
# hand offers one, so the row shows a single value and states the fact rather
# than offering a choice that does nothing.
#
# Applies to the next loading screen, not to the one on screen - the
# illustration is decoded when the setting changes, which is a disc read and so
# happens in the menus rather than mid-load. See
# `Session::reload_loading_assets`.
[[page.entry]]
kind = "choice"
label = "FRONT END STYLE"
string_id = "OAG_DISPLAY_FRONT_END_STYLE"
setting = "display.front_end_style"
values_from = "front_end_styles"

# `off` never waits and tears; `on` is classic vsync, which never tears and
# halves the rate when a frame misses a refresh; `smooth` is that miss handled
# properly - the newest finished frame is presented and the rest discarded.
#
# Defaults to `off` with the limit at 240: this is a racing game, vsync costs a
# frame of latency, and 240 is the top of the tier displays are built at so it
# caps nothing common while still bounding a menu page that would otherwise run
# at four figures.
# On by default (chosen, not measured): a race left running under an alt-tab, a
# notification or the Steam Deck's overlay is a crash nobody saw. Off for a
# player who keeps the game live on a second monitor. Minimising the window
# pauses whatever this says.
[[page.entry]]
kind = "choice"
label = "PAUSE ON FOCUS LOSS"
string_id = "OAG_DISPLAY_PAUSE_ON_FOCUS_LOSS"
setting = "display.pause_on_focus_loss"
values = ["on", "off"]

[[page.entry]]
kind = "choice"
label = "VSYNC"
string_id = "OAG_DISPLAY_VSYNC"
setting = "display.vsync"
values = ["off", "on", "smooth"]

# **Only `on` disables the limiter**, which is why the condition names a value
# rather than just a setting. `off` and `smooth` both leave the loop free to run
# ahead of the display, so a limit is live under either - and under `smooth` it
# is the only thing stopping the GPU rendering frames that get thrown away.
# Greyed and not hidden: a setting that vanishes gives a player no way to find
# out what took it away.
[[page.entry]]
kind = "choice"
label = "FRAME LIMIT"
string_id = "OAG_DISPLAY_FRAME_LIMIT"
setting = "display.frame_limit"
disabled_by = { setting = "display.vsync", value = "on" }
values = [
    "unlimited",
    "30",
    "60",
    "70",
    "72",
    "75",
    "90",
    "100",
    "120",
    "144",
    "165",
    "240",
    "360",
    "480",
    "1000",
]

# Both are applied by the blit that puts the finished frame on the surface, so
# both cover every stage and both show on this page as they are changed - which
# is the only way to calibrate a picture. Percentages: 100 leaves the frame
# alone, and both lists offer it so there is a way back.
#
# Brightness multiplies; gamma bends the midtones without moving black or
# white, which is the one that makes a dark corner of a track visible without
# washing out the rest. See `crates/game/src/upscale.rs`.
[[page.entry]]
kind = "choice"
label = "BRIGHTNESS"
string_id = "OAG_DISPLAY_BRIGHTNESS"
setting = "display.brightness"
values = ["50", "75", "90", "100", "110", "125", "150"]

[[page.entry]]
kind = "choice"
label = "GAMMA"
string_id = "OAG_DISPLAY_GAMMA"
setting = "display.gamma"
values = ["60", "80", "90", "100", "110", "120", "140"]

[[page.entry]]
kind = "back"
label = "BACK"
string_id = "OAG_MENU_BACK"

[[page]]
id = "graphics"
title = "GRAPHICS"
title_string_id = "OAG_OPTIONS_GRAPHICS"

# Which adapter draws the picture. On this page and not DISPLAY because the line
# between the two is whether the renderer would notice, and *what the renderer
# is* is the most direct case of that there could be.
#
# The list is what this machine can present with, supplied at runtime - nothing
# writable here could describe a GPU. `default` is first and always, so there is
# a way back from an adapter that has since been uninstalled.
#
# **An entry marked `(cpu)` renders on the processor.** wgpu has no software
# renderer of its own; that entry appears only when the system has a software
# driver installed - Mesa lavapipe (`vulkan-swrast` on Arch,
# `mesa-vulkan-drivers` on Debian) or WARP on Windows - and is absent otherwise
# rather than being offered and failing. It is a diagnostic path, not a way to
# play: pair it with RENDER SCALE 50 to get something watchable.
#
# The only row on either settings page that cannot take effect this run. The
# device is made once, at boot, and every pipeline and uploaded mesh hangs off
# it. Not greyed and not warned - it is a live setting whose effect is simply
# deferred, which is the same thing LANGUAGE does - so it says so instead, from
# the moment it is moved off the adapter the game is actually drawing with. See
# `docs/architecture/menus.md`.
[[page.entry]]
kind = "choice"
label = "RENDERER"
string_id = "OAG_GRAPHICS_RENDERER"
setting = "graphics.renderer"
values_from = "renderers"
restart_required = "RESTART THE GAME TO DRAW WITH THIS"

# What percentage of the displayed size the game is actually rendered at.
# Below 100 is the usual internal-resolution knob, above it is supersampling,
# and it is measured against the aspect rectangle so it means the same thing at
# every aspect. Applies from the next frame.
#
# **It applies to a race and to nothing else**, since ADR-0038: a stage with no
# 3D scene draws at presentation resolution whatever this says, because scaling
# a menu saves nothing and only makes it blurrier. So a player moving this row
# sees the menu they are standing on not change - which is the one thing about
# it worth a warning, and there is no `warn_when` for "does nothing on this
# screen" as opposed to "does nothing given another row". Left as it is rather
# than stretched; see the ADR's consequences.
[[page.entry]]
kind = "choice"
label = "RENDER SCALE"
string_id = "OAG_GRAPHICS_RENDER_SCALE"
setting = "graphics.render_scale"
values = ["50", "75", "100", "125", "150", "200"]

# The frame rate a resolution controller aims for, and the row that turns it
# on: `off` is one of the values rather than a toggle beside it, because two
# keys that can disagree is a state somebody has to define behaviour for.
# Persisted per title in `[render_profiles.<title>]`, like every other
# render-cost row on this page - the setting key here names the row, not the
# table it lands in.
# Directly under RENDER SCALE because the pairing is the point - while this
# names a rate, that row is the **ceiling**, and the controller reads it and
# never writes it, so a loaded machine cannot make a chosen quality drift
# downward between sessions.
#
# **On an adapter with no GPU timer there is no signal and the extent never
# moves**, whatever this row says. It cannot be greyed out for that:
# `disabled_by` names a *setting*, and an adapter capability is not one - see
# `docs/architecture/menus.md`. The row is stored and inert, which is the same
# thing `restart_required` already means.
[[page.entry]]
kind = "choice"
label = "TARGET FPS"
string_id = "OAG_GRAPHICS_TARGET_FPS"
setting = "graphics.target_fps"
values = ["off", "30", "60", "90", "120", "144"]
warn_when = [
    { message = "HELD TO THE FRAME LIMIT, WHICH IS LOWER THAN THIS", all = [
        { setting = "graphics.target_fps", value = "60" },
        { setting = "display.frame_limit", values = ["30"] },
        { setting = "display.vsync", values = ["off", "smooth"] },
    ] },
    { message = "HELD TO THE FRAME LIMIT, WHICH IS LOWER THAN THIS", all = [
        { setting = "graphics.target_fps", value = "90" },
        { setting = "display.frame_limit", values = ["30", "60", "70", "72", "75"] },
        { setting = "display.vsync", values = ["off", "smooth"] },
    ] },
    { message = "HELD TO THE FRAME LIMIT, WHICH IS LOWER THAN THIS", all = [
        { setting = "graphics.target_fps", value = "120" },
        { setting = "display.frame_limit", values = ["30", "60", "70", "72", "75", "90", "100"] },
        { setting = "display.vsync", values = ["off", "smooth"] },
    ] },
    { message = "HELD TO THE FRAME LIMIT, WHICH IS LOWER THAN THIS", all = [
        { setting = "graphics.target_fps", value = "144" },
        { setting = "display.frame_limit", values = ["30", "60", "70", "72", "75", "90", "100", "120"] },
        { setting = "display.vsync", values = ["off", "smooth"] },
    ] },
]

# Warned *and* clamped when it is above the frame limiter, which are two halves
# of one answer: the row says what was asked for, and `drs::Target::at_most`
# holds the controller to what the loop will actually produce. Without the
# clamp a 144 target behind a 60 limit would drop the resolution permanently to
# buy frames the limiter forbids; without the warning the row would silently
# mean something other than what it says.
#
# Only where the limiter is in force. Under `vsync = on` the *display* is the
# bound and this build cannot ask a surface what its refresh is, so neither
# half fires - a wrong clamp at 60 on a 144 Hz panel is worse than none. The
# pairs are enumerated because `Condition` has no ordering, the same as the
# MINIMUM RESOLUTION row below, and
# `the_target_warns_at_exactly_the_frame_limits_it_is_above` generates the same
# set from `Target::OFFERED` and `FrameLimit::OFFERED`.

# The lowest the controller may fall to, as a percentage of the aspect
# rectangle - the same unit and the same list RENDER SCALE uses, so a player
# can read the two rows against each other. Greyed while TARGET FPS is
# off, because there is then nothing to bound.
#
# Warned rather than refused at a floor that is not below the ceiling: the
# setting is stored and starts working the moment the other row moves, which is
# exactly what UPSCALER's own warning means. `Condition` compares values and
# has no ordering - deliberately, it is what keeps the menu module ignorant of
# what any setting means - so the pairs are enumerated, and
# `the_floor_warns_at_exactly_the_scales_it_cannot_fall_below` generates the
# same set from `Scale::OFFERED` so this list cannot quietly stop matching.
[[page.entry]]
kind = "choice"
label = "MINIMUM RESOLUTION"
string_id = "OAG_GRAPHICS_MINIMUM_RESOLUTION"
setting = "graphics.minimum_resolution"
values = ["50", "75", "100", "125", "150", "200"]
disabled_by = { setting = "graphics.target_fps", value = "off" }
warn_when = [
    { message = "A FLOOR AT OR ABOVE RENDER SCALE LEAVES NOTHING TO MOVE", all = [
        { setting = "graphics.minimum_resolution", value = "50" },
        { setting = "graphics.render_scale", values = ["50"] },
    ] },
    { message = "A FLOOR AT OR ABOVE RENDER SCALE LEAVES NOTHING TO MOVE", all = [
        { setting = "graphics.minimum_resolution", value = "75" },
        { setting = "graphics.render_scale", values = ["50", "75"] },
    ] },
    { message = "A FLOOR AT OR ABOVE RENDER SCALE LEAVES NOTHING TO MOVE", all = [
        { setting = "graphics.minimum_resolution", value = "100" },
        { setting = "graphics.render_scale", values = ["50", "75", "100"] },
    ] },
    { message = "A FLOOR AT OR ABOVE RENDER SCALE LEAVES NOTHING TO MOVE", all = [
        { setting = "graphics.minimum_resolution", value = "125" },
        { setting = "graphics.render_scale", values = ["50", "75", "100", "125"] },
    ] },
    { message = "A FLOOR AT OR ABOVE RENDER SCALE LEAVES NOTHING TO MOVE", all = [
        { setting = "graphics.minimum_resolution", value = "150" },
        { setting = "graphics.render_scale", values = ["50", "75", "100", "125", "150"] },
    ] },
    { message = "A FLOOR AT OR ABOVE RENDER SCALE LEAVES NOTHING TO MOVE", all = [
        { setting = "graphics.minimum_resolution", value = "200" },
        { setting = "graphics.render_scale", values = ["50", "75", "100", "125", "150", "200"] },
    ] },
]

# What resolves the frame onto the surface. Directly below the render scale
# because the pairing is what makes several of these mean anything: at 100 %
# there is nothing to upscale, and the choice is between a blit, a spatial
# anti-aliaser and a temporal reconstruction that has work to do at any scale.
# Applies from the next frame; each value's pipelines are built the first time
# it is chosen.
#
# **One row where there were two**, since
# `docs/architecture/adr/0041-one-row-for-what-resolves-the-frame.md`. An
# ANTI-ALIASING row used to sit below an UPSCALER row and five of this file's
# seven warnings existed to describe how they interacted. Every value here
# answers one question - what carries this frame onto the surface - so at most
# one can be doing it and the wrong pairings are unrepresentable rather than
# warned about. `fxaa` is a value here rather than a toggle beside the row for
# exactly that reason: it is only ever right when nothing else is
# reconstructing, and the ADR records all three cases.
#
# There is no `taa` choice. Temporal reconstruction is `fsr3`, which is what
# ADR-0013 asked for in advance - *"do not expose `Taa` and `Fsr3` as separate
# user-facing concepts unless a real reason turns up to"*.
#
# **`fsr3` is not warned about, and that is not an oversight.** FSR 3.1 is
# temporal: it reconstructs from several previous frames, so even at 100 % it
# has more samples per pixel than one frame carries and is doing real work -
# what upstream calls its native-AA mode. It greys the MSAA row below instead,
# which is a statement about that row rather than about this one.
#
# Warned rather than greyed, and the difference is who caused it. A greyed row
# cannot be changed now because another row rules it out. These warnings can be
# changed, are stored, and take effect the moment the render scale comes back
# under 100 - it is the *combination* that does nothing, and greying would say
# "you cannot change this", which is false. The values listed are every one the
# RENDER SCALE row above offers at 100 or above; the loader rejects a value that
# row cannot hold, so this list cannot silently stop matching it.
[[page.entry]]
kind = "choice"
label = "RECONSTRUCTION"
string_id = "OAG_GRAPHICS_RECONSTRUCTION"
setting = "graphics.reconstruction"
values = ["off", "fxaa", "smaa", "fsr1", "fsr3"]
warn_when = [
    # Two entries for one statement, because `Condition.all` is an AND and
    # this needs an OR: FSR 1 does nothing when the frame can never be drawn
    # smaller than it is presented, and since dynamic resolution that is a
    # question about the **floor** rather than about RENDER SCALE. At a 100 %
    # ceiling with a 50 % minimum the controller drops the extent below the
    # presentation rectangle and FSR 1 magnifies - so warning here would be
    # telling a player a working setting is dead.
    { message = "NO EFFECT AT RENDER SCALE 100 OR ABOVE", all = [
        { setting = "graphics.reconstruction", value = "fsr1" },
        { setting = "graphics.render_scale", values = ["100", "125", "150", "200"] },
        { setting = "graphics.target_fps", value = "off" },
    ] },
    { message = "NO EFFECT AT RENDER SCALE 100 OR ABOVE", all = [
        { setting = "graphics.reconstruction", value = "fsr1" },
        { setting = "graphics.render_scale", values = ["100", "125", "150", "200"] },
        { setting = "graphics.minimum_resolution", values = ["100", "125", "150", "200"] },
    ] },
    # And "redundant on top of supersampling" stops being true the moment the
    # controller may stop supersampling, so it needs the target off. Real
    # product policy per `docs/architecture/adr/0013-anti-aliasing-architecture.md`'s
    # "What the render-scale tiers mean for FXAA/SMAA" section. Only "200" is
    # named because it is the only value RENDER SCALE offers at or above it -
    # see `Scale::OFFERED`.
    { message = "REDUNDANT ON TOP OF 200% RENDER SCALE SUPERSAMPLING", all = [
        { setting = "graphics.reconstruction", values = ["fxaa", "smaa"] },
        { setting = "graphics.render_scale", value = "200" },
        { setting = "graphics.target_fps", value = "off" },
    ] },
    { message = "REDUNDANT ON TOP OF 200% RENDER SCALE SUPERSAMPLING", all = [
        { setting = "graphics.reconstruction", values = ["fxaa", "smaa"] },
        { setting = "graphics.render_scale", value = "200" },
        { setting = "graphics.minimum_resolution", value = "200" },
    ] },
]

# How hard FSR 1's and FSR 3.1's RCAS pass sharpens, in **stops**: 0 is maximum
# and each whole step halves it, which is upstream FidelityFX's own scale and
# runs the opposite way to what a reader expects. Greyed out on the three
# values that run no sharpen at all.
[[page.entry]]
kind = "choice"
label = "UPSCALER SHARPNESS"
string_id = "OAG_GRAPHICS_UPSCALER_SHARPNESS"
setting = "graphics.upscale_sharpness"
values = ["0.0", "0.2", "0.5", "1.0", "2.0"]
disabled_by = { setting = "graphics.reconstruction", values = ["off", "fxaa", "smaa"] }

# How many samples the rasterizer takes. **Its own axis since ADR-0041**, where
# it used to be a fourth value of an anti-aliasing row, competing with two
# fullscreen passes it has nothing in common with: this is a property of the
# rasterizer, read once at `race::Scene::new` and baked into every scene
# pipeline, while everything on the RECONSTRUCTION row reads the *resolved*
# result. It composes with `off`, `fxaa`, `smaa` and `fsr1` rather than
# competing with them - as this file has always recorded, MSAA "resolves before
# any of this runs and composes with FSR 1 rather than fighting it".
#
# **Greyed under `fsr3`, not warned.** That is the reverse of how this file
# treats the RECONSTRUCTION row's own pairings, and the reason is that here the
# other row really does rule this one out: FSR 3.1 anti-aliases the same frame
# temporally, and MSAA on top costs a rasterization pass, a resolve and three
# discarded samples on the depth and velocity attachments - `INPUTS_MULTISAMPLED`
# reads sample 0 only. The niche it would serve is served better by RENDER
# SCALE, which already goes to 200. A greyed row still takes the cursor and
# still shows its stored value, so leaving `fsr3` gives a player their `4x`
# back untouched. ADR-0041 argues the choice.
#
# There is no `2x`: sample count 2 needs
# `wgpu::Features::TEXTURE_ADAPTER_SPECIFIC_FORMAT_FEATURES`, which nothing here
# requests, so a pipeline built at it fails device validation on every adapter -
# see ADR-0013's Consequences.
#
# **Always waits for the next race**, because the whole row is the sample count
# the scene pipelines are built with. That is unconditional now where the old
# combined row had a live half, which is why the note no longer needs
# `Session::open_menus` to tell two cases apart. `restart_required` is the same
# mechanism RENDERER uses, told from what the race on screen was actually built
# with rather than from the device, which is why the message names a race
# instead of the game.
[[page.entry]]
kind = "choice"
label = "MSAA"
string_id = "OAG_GRAPHICS_MSAA"
setting = "graphics.msaa"
values = ["off", "4x"]
restart_required = "TAKES EFFECT THE NEXT TIME A RACE STARTS"
disabled_by = { setting = "graphics.reconstruction", value = "fsr3" }

# A strength, not a boolean - each value is a shutter fraction of one
# simulation tick, and the technique underneath can improve without this row
# or anyone's settings file moving; it already has once, camera reprojection
# to `docs/rendering/motion-blur.md`'s per-object velocity buffer, with no
# migration. Applies live: `Scene::render` reads it fresh each frame, so no
# `restart_required`. No MSAA warning any more - the blur's prepare stage
# reads sample 0 of the multisampled attachments, so the combination works.
[[page.entry]]
kind = "choice"
label = "MOTION BLUR"
string_id = "OAG_GRAPHICS_MOTION_BLUR"
setting = "graphics.motion_blur"
values = ["off", "low", "medium", "high"]

# Where the blur above spends its cost. `half` gathers a quarter of the pixels
# and blends the smear back by depth: about a third of the chain's cost on an
# integrated GPU, and a grainier smear, which is why `full` is the default.
# Applies live, like the strength.
[[page.entry]]
kind = "choice"
label = "BLUR RESOLUTION"
string_id = "OAG_GRAPHICS_MOTION_BLUR_RESOLUTION"
setting = "graphics.motion_blur_resolution"
values = ["full", "half"]

# What casts a shadow, and what draws it. **A technique, not a strength** - the
# ladder is not monotonic in quality, which is what `docs/rendering/shadows.md`
# settled before this row existed: a flat authored hull projected onto the road
# can read worse than a soft circle on a track whose floor curves under the
# craft.
#
# Two of the design's four tiers are missing on purpose. `original` - Pulse's
# 129 `Dynamic Shadow Occluder` hulls, HD's shadow-map jobs - and `mapped`, an
# opt-in cascaded shadow map, are designed and unbuilt, and a row for
# infrastructure that is not there is worse than no row (ADR-0013).
#
# `blob` plays the disc's own silhouette where there is one: Wipeout HD ships
# nine `ambient_shadow.gtf`, one per team. Every other title gets a generated
# falloff, which is this project's and is why `off` is the default.
#
# `original` is the craft's own authored `Dynamic Shadow Occluder` hull,
# projected along the direction the executable authors - and it is built **on
# Pulse only**. On a title with nothing built it draws nothing and the load
# report says so, rather than quietly becoming `blob`; on Wipeout Pure that is
# also the correct picture, since it authors no shadow class at all.
#
# `mapped` is this project's own: a shadow map everything casts into and
# everything reads, offered on every title because it asks the disc for nothing
# but geometry. It is **more** shadows rather than better ones - on a title with
# its own mechanism it ignores what the disc would have drawn, which is why
# `original` stays the one to prefer where it exists.
#
# Applies live: `Scene::render` reads the tier fresh each frame.
[[page.entry]]
kind = "choice"
label = "SHADOWS"
string_id = "OAG_GRAPHICS_SHADOWS"
setting = "graphics.shadows"
values = ["off", "blob", "original", "mapped"]

# How far out an authored `LodGroup` switches to its coarser tiers. `original`
# is the recovered rule - `LodGroup_SelectChild`'s per-frame switch at the
# distances the disc authors, 30 units on a Pulse craft - and the default.
# `high` doubles every distance and `maximum` never switches; both are this
# project's own, chosen rather than measured. One multiplier on the authored
# distances, not a second code path. See `docs/formats/vex.md`, "the switch is
# found". Applies live: the session hands the preset to the race every frame.
[[page.entry]]
kind = "choice"
label = "MODEL DETAIL"
string_id = "OAG_GRAPHICS_MODEL_DETAIL"
setting = "graphics.model_detail"
values = ["original", "high", "maximum"]

# How far out a PSP `.vex` model keeps its finer texture levels. `original` is
# the recovered rule - the GE's slope law, `Gu_TexLodSlope` at 1/256 with bias 1,
# over the mip levels the disc authors: level 1 from 256 units of view depth,
# level 2 from 512 - and the default. `high` doubles the depth of every step and
# `maximum` always samples level 0; both are this project's own, chosen rather
# than measured. One multiplier on the law, not a second code path. See
# `docs/rendering/frame-audit.md`. Applies live: the session hands the preset to
# the race every frame and the fragment stage reads it from the scene uniform.
[[page.entry]]
kind = "choice"
label = "TEXTURE DETAIL"
string_id = "OAG_GRAPHICS_TEXTURE_DETAIL"
setting = "graphics.texture_detail"
values = ["original", "high", "maximum"]

# A simulation of the display the title ran on, drawn over the finished frame
# - menus, HUD and all - just before brightness and gamma. The list is
# supplied at runtime: `off`, the presets built into the binary (the PSP's
# two panels, three kinds of CRT) and every `.wgsl` file in the player's own
# `shaders/` directory beside `settings.toml`, where a copied built-in can be
# tuned or a new one written; a saved edit shows within a second, without a
# restart. See `docs/rendering/screen-filters.md` for the file contract.
#
# On this page and per title, not on DISPLAY beside brightness and gamma where
# "applied after drawing" would otherwise put it: the right filter depends on
# which machine the title ran on, so it lives in `[render_profiles.<title>]`
# like SHADOWS. Applies live, which is the only way to pick one.
[[page.entry]]
kind = "choice"
label = "SCREEN FILTER"
string_id = "OAG_GRAPHICS_SCREEN_FILTER"
setting = "graphics.screen_filter"
values_from = "screen_filters"

# How much of the filter shows: a mix between the untouched frame and the
# filter's output, applied by the pass itself so it means the same for every
# preset. Greyed while no filter is selected.
[[page.entry]]
kind = "choice"
label = "SCREEN FILTER STRENGTH"
string_id = "OAG_GRAPHICS_SCREEN_FILTER_STRENGTH"
setting = "graphics.screen_filter_strength"
disabled_by = { setting = "graphics.screen_filter", value = "off" }
values = ["25", "50", "75", "90", "100"]

# Applies to the next race built rather than immediately: the sampler is made
# when a race's pipelines are.
[[page.entry]]
kind = "choice"
label = "ANISOTROPIC FILTERING"
string_id = "OAG_GRAPHICS_ANISOTROPIC_FILTERING"
setting = "graphics.anisotropy"
values = ["off", "2x", "4x", "8x", "16x"]

# Which of the original's three in-race perspectives to fly with. The set and the
# order are **recovered** (confidence 88): `Camera_UpdatePlayerView` rotates one
# profile setting through exactly these three, in this order, wrapping - see
# `docs/ghidra/functions/psp-pulse-usa/camera.md`. Which one a fresh install
# starts on is *not* recovered; `far` is this project's choice, being what the
# game rendered before the other two existed.
#
# The values are listed in the cycle's own order rather than nearest-first, so
# moving the row and pressing the in-race cycle button (SELECT, or TAB on a
# keyboard) walk the same sequence. No `restart_required`: this one applies to a
# race already running, which is the whole point of there being a button for it.
[[page.entry]]
kind = "choice"
label = "CAMERA VIEW"
string_id = "OAG_GRAPHICS_CAMERA_VIEW"
setting = "graphics.camera_view"
values = ["internal", "close", "far"]

# A **percentage of the field of view the disc's own data authored**, not an
# angle. `<ExternalCameraFar fov>` comes off the disc and its unit is
# unrecovered, so a row that let a player type `90` would be quietly asserting a
# unit this project has not established; a multiplier says what it does without
# claiming to know what the number underneath means. 100 is the authored value,
# and it is the default. Applies from the next frame a race draws.
[[page.entry]]
kind = "choice"
label = "FIELD OF VIEW"
string_id = "OAG_GRAPHICS_FIELD_OF_VIEW"
setting = "graphics.fov"
values = ["75", "90", "100", "110", "125", "150", "175"]

# How much a boost pad widens the field of view for a moment. **Invented, not
# recovered** - nothing read out of either binary does this; the force it
# rides on is real, this is authored so the player can feel it. 0 turns it
# off, for comparing against a capture of the original, which has no such
# effect. 8 is the original on/off toggle's subtler "on"; the default is 16,
# one tier stronger, because 8 read as nothing happening to a player not
# already watching for it; 32 is stronger still - see
# `oag_game::display::BoostFovKick`.
#
# `restart_required` here means the same thing it does on ANTI-ALIASING's MSAA
# levels above: the running race already baked this into `Race::start` and
# will not pick up a change until the next one does.
[[page.entry]]
kind = "choice"
label = "BOOST FOV KICK"
string_id = "OAG_GRAPHICS_BOOST_FOV_KICK"
setting = "graphics.boost_fov_kick"
values = ["0", "8", "16", "32"]
restart_required = "TAKES EFFECT THE NEXT TIME A RACE STARTS"

# `fps` is one line of numbers; `pacing` adds the graph, which is the one that
# shows uneven frames - an average frame rate is exactly what hides them.
# `dev` adds a third line of scene counts (draw calls, triangles). Drawn over
# every stage from the next frame, into the offscreen target and so at the
# render scale - which is why it is on this page and not DISPLAY. See
# `crates/game/src/perf.rs`.
[[page.entry]]
kind = "choice"
label = "PERFORMANCE OVERLAY"
string_id = "OAG_GRAPHICS_PERFORMANCE_OVERLAY"
setting = "graphics.perf_overlay"
values = ["off", "fps", "pacing", "dev"]

[[page.entry]]
kind = "back"
label = "BACK"
string_id = "OAG_MENU_BACK"

[[page]]
id = "audio"
title = "AUDIO"
title_string_id = "OAG_OPTIONS_AUDIO"

# Two bus rows, because the original's options menu has exactly two volumes and
# no more: `"Music Volume"` at `0x08a78658` and `"SFX Volume"` at `0x08a78668`.
# The second one earned its row when the sound banks started decoding - see
# `oag_sound::sfx`.
#
# Applied on the next tick - the change goes straight onto the bus's gain, so it
# is audible on the row the player is standing on rather than after a restart,
# the way BRIGHTNESS is visible on its own page. Zero is offered and means
# silence: unlike a black screen there is no way to get lost in it.
[[page.entry]]
kind = "choice"
label = "MUSIC VOLUME"
string_id = "OAG_AUDIO_MUSIC_VOLUME"
setting = "audio.music_volume"
values = ["0", "25", "50", "75", "90", "100"]

[[page.entry]]
kind = "choice"
label = "SFX VOLUME"
string_id = "OAG_AUDIO_SFX_VOLUME"
setting = "audio.sfx_volume"
values = ["0", "25", "50", "75", "90", "100"]

# The announcer, on its own row because the original puts voice lines in their
# own bank: `shieldactive` is in `speech.bnk` and not beside the `~SHIELD` loop
# it fires with, which is already how `oag_sound::sfx` tells a callout
# from an effect. See `docs/architecture/adr/0027-three-mix-buses.md`.
#
# **Two cues reach it today** - the shield callout and the Autopilot's
# one-second warning - because those are the only voice lines whose trigger has
# been recovered. Moving this row changes nothing in a race where the player
# collects neither.
[[page.entry]]
kind = "choice"
label = "ANNOUNCER VOLUME"
string_id = "OAG_AUDIO_ANNOUNCER_VOLUME"
setting = "audio.speech_volume"
values = ["0", "25", "50", "75", "90", "100"]

# The last is ours, and it is here because the mix has no headroom to give.
# The original's chain runs unity end to end and lets the hardware saturate
# (`docs/ghidra/functions/psp-pulse-usa/audio-levels.md`), and eight craft on
# the grid clear full scale on the effects bus alone - so a player who wants
# the race not to distort should be able to turn *everything* down at once
# instead of keeping the two rows above in step. It moves the same master stage
# the original has and does not expose: group `0x10`, which `Audio_Init` opens
# at `0x400`.
#
# Below the two it scales, which is the order it applies in.
[[page.entry]]
kind = "choice"
label = "MASTER VOLUME"
string_id = "OAG_AUDIO_MASTER_VOLUME"
setting = "audio.master_volume"
values = ["0", "25", "50", "75", "90", "100"]

# Which release's encode of the **soundtrack** plays. Only the sixteen
# soundtrack tracks have a proven counterpart on the other disc - a 16-for-16
# bijection, mean duration gap 11 ms, side-signal correlation +0.98, see
# `docs/formats/ps2-audio.md`. Voice and every `.bnk` stay on the disc the game
# booted from, because nothing pairs them.
#
# **It does not govern the front end's own music, and that is not a bug.** The
# PSP release has menu music written for it, a 28-second loop that is not one of
# the sixteen and has no PS2 counterpart at all, so there is nothing for this
# row to choose between and a PSP boot sounds the same at every value. The PS2
# release has no menu music of its own that has been found and plays soundtrack
# track 0 under its menus, so the row does move that. The asymmetry is the
# discs'; nothing here adds music to a screen that had none.
#
# The values are supplied at runtime rather than listed here, because what is on
# offer depends on which discs the player owns: `auto`, `psp` and `ps2` on a
# machine that has both, and nothing at all on one that has one, where the row
# draws unusable. `auto` is the booted disc - the PSP release is meant to sound
# like the PSP release, compression included.
#
# Changing it **seeks rather than restarts**: the playhead is carried across in
# seconds, and the two encodes of a track agree in length to 11 ms, so the same
# offset lands in the same bar. See `crates/sound/src/lib.rs`.
[[page.entry]]
kind = "choice"
label = "MUSIC SOURCE"
string_id = "OAG_AUDIO_MUSIC_SOURCE"
setting = "audio.music_source"
values_from = "music_sources"

[[page.entry]]
kind = "back"
label = "BACK"
string_id = "OAG_MENU_BACK"

[[page]]
id = "controls"
title = "CONTROLS"
title_string_id = "OAG_OPTIONS_CONTROLS"

# Cross or Start confirms a row below, which waits for the next key pressed
# and gives it exactly that key: `oag_input::bindings::Bindings` steals the
# key from whatever button held it before, and the row that used to hold it
# is left showing whatever it has left, empty included - a real state, not a
# broken one. See `docs/architecture/menus.md`'s rebinding section and
# `crates/game/src/main/rebind.rs`, which decides what a raw key press means
# while a row is waiting.
# FIRE PICKUP and ABSORB PICKUP are chosen text, not measured - neither PSP
# title's front-end XML authors this page at all, see this page's own header.
# Picked to match the game's own vocabulary rather than invent new words:
# `assets/ui/strings/english.toml`'s `OAG_HINTS_RACE_KEYS` already says "C
# fires a pickup and Z absorbs it", and `Race::spend_pickup`
# (`crates/game/src/race/weapons.rs`) reads exactly `Button::Square` for fire
# and `Button::Circle` for absorb - confirmed against that function, not
# assumed from the button names. `circle` used to read "BRAKE" here, which was
# wrong on both counts: there is no brake action anywhere in
# `oag_gameplay::controls::ship_controls` (braking is the airbrakes below, on
# `l`/`r`), and circle absorbs, it does not brake. `square` had no row at all
# before this, so fire was unbindable and undiscoverable from this page.
[[page.entry]]
kind = "binding"
label = "THRUST"
string_id = "OAG_CONTROLS_THRUST"
button = "cross"

[[page.entry]]
kind = "binding"
label = "FIRE PICKUP"
string_id = "OAG_CONTROLS_FIRE_PICKUP"
button = "square"

[[page.entry]]
kind = "binding"
label = "ABSORB PICKUP"
string_id = "OAG_CONTROLS_ABSORB_PICKUP"
button = "circle"

[[page.entry]]
kind = "binding"
label = "STEER LEFT"
string_id = "OAG_CONTROLS_STEER_LEFT"
button = "left"

[[page.entry]]
kind = "binding"
label = "STEER RIGHT"
string_id = "OAG_CONTROLS_STEER_RIGHT"
button = "right"

[[page.entry]]
kind = "binding"
label = "PITCH UP"
string_id = "OAG_CONTROLS_PITCH_UP"
button = "up"

[[page.entry]]
kind = "binding"
label = "PITCH DOWN"
string_id = "OAG_CONTROLS_PITCH_DOWN"
button = "down"

[[page.entry]]
kind = "binding"
label = "AIRBRAKE LEFT"
string_id = "OAG_CONTROLS_AIRBRAKE_LEFT"
button = "l"

[[page.entry]]
kind = "binding"
label = "AIRBRAKE RIGHT"
string_id = "OAG_CONTROLS_AIRBRAKE_RIGHT"
button = "r"

# Not one of the original's eight driving bindings, and listed here anyway: the
# in-race camera cycle is the one control a player has no other way to discover.
# It is bound (SELECT on a pad, TAB on a keyboard, through
# `oag_input::keys::map_key`) and it works, but until this row existed the only
# record of it was a source comment - so the feature was effectively invisible.
# `bound_keys` fills the right-hand column from the input layer, so this row says
# whatever is actually bound rather than a hardcoded key name.
[[page.entry]]
kind = "binding"
label = "CAMERA VIEW"
string_id = "OAG_CONTROLS_CAMERA_VIEW"
button = "select"

# The one row on this page that is not a key binding, and the reason it sits
# below the bindings rather than above them: it does not rebind a key. It
# chooses which *gesture* a sideshift takes, which is the original's own
# `Control_Type` and the reason the bindings above differ between the two -
# veteran spends both shoulders on the separate airbrakes, novice gives one of
# them to the sideshift and puts the airbrakes on the other, which picks its
# side off the steering (both when centred). See
# `docs/ghidra/functions/psp-pulse-usa/input-bindings.md`.
#
# The values are the binary's own tokens, not labels this project chose, so a
# `custom` third value is deliberately absent: in the original that is a
# rebinding of *which abstract button each of its eight actions fires*
# (`ControlMapping2`), a different axis from the key-to-button table the
# bindings above edit, and one with no menu row here yet.
[[page.entry]]
kind = "choice"
label = "SIDESHIFT"
string_id = "OAG_CONTROLS_SIDESHIFT"
setting = "controls.scheme"
values = ["veteran", "novice"]

# The other two rows that are not key bindings, and the only ones on this page
# about hardware the original never had: the PSP has no analog triggers. So
# neither is recovered behaviour, and neither is a rebinding - the shoulders are
# the airbrakes whatever these say. `airbrakes` puts an airbrake on each trigger
# and thrust back on cross alone; `thrust_brake` is the older mapping, where R2
# is a second thrust button and L2 pulls both airbrakes together. See
# `oag_input::pad::TriggerMode`.
[[page.entry]]
kind = "choice"
label = "TRIGGERS"
string_id = "OAG_CONTROLS_TRIGGERS"
setting = "controls.triggers"
values = ["airbrakes", "thrust_brake"]

# Pilot Assist (HD/Fury and 2048's own option): the track's corridor yaws the
# craft off a wall it is about to meet, for a few percent of thrust. Default on
# on Android only (maintainer's rule). See `docs/physics/pilot-assist.md`.
[[page.entry]]
kind = "choice"
label = "PILOT ASSIST"
string_id = "OAG_CONTROLS_PILOT_ASSIST"
setting = "controls.pilot_assist"
values = ["on", "off"]

# How much airbrake a given pull asks for, as a percentage of a linear one.
# Ordered low to high rather than default-first, the way BRIGHTNESS is: the
# first value only decides what the row opens on when nothing *seeds* it, and
# `settings::menu_seeds` seeds this one. The list must agree with
# `settings::TriggerSensitivity::OFFERED`, which a test asserts.
[[page.entry]]
kind = "choice"
label = "TRIGGER SENSITIVITY"
string_id = "OAG_CONTROLS_TRIGGER_SENSITIVITY"
setting = "controls.trigger_sensitivity"
values = ["50", "75", "100", "125", "150", "200"]

# A page of its own, with a live picture of the overlay beside the rows
# (`oag_game::touch_controls::preview`). Only a touchscreen has an overlay to
# set, so `Definition::drop_touch_controls` takes this row away off Android
# unless `OAG_TOUCH_CONTROLS` is set (chosen, not measured).
[[page.entry]]
kind = "submenu"
label = "TOUCH CONTROLS"
string_id = "OAG_CONTROLS_TOUCH_PAGE"
target = "touch_controls"

[[page.entry]]
kind = "back"
label = "BACK"
string_id = "OAG_MENU_BACK"

[[page]]
id = "touch_controls"
title = "TOUCH CONTROLS"
title_string_id = "OAG_CONTROLS_TOUCH_PAGE"

# On by default (chosen, not measured): the on-screen GO button adds the left
# or right airbrake in its bottom corners. Off makes GO thrust alone, for a
# phone where the separate BRAKE buttons suit the hands better.
[[page.entry]]
kind = "choice"
label = "GO BRAKE ZONES"
string_id = "OAG_CONTROLS_TOUCH_GO_ZONES"
setting = "controls.touch_go_zones"
values = ["on", "off"]

# Which on-screen scheme a touchscreen shows (chosen, not measured): standard
# is the stick plus GO with L/R brake corners; easy blends the stick's rim into
# the airbrake and gives GO one BRAKE zone that picks its side off the steering.
[[page.entry]]
kind = "choice"
label = "TOUCH SCHEME"
string_id = "OAG_CONTROLS_TOUCH_SCHEME"
setting = "controls.touch_scheme"
values = ["standard", "easy"]

# How strongly the on-screen racing controls draw, in percent of the design's
# own translucency (chosen, not measured). Only a touchscreen shows them.
[[page.entry]]
kind = "choice"
label = "CONTROLS OPACITY"
string_id = "OAG_CONTROLS_TOUCH_OPACITY"
setting = "controls.touch_opacity"
values = ["40", "60", "80", "100"]

[[page.entry]]
kind = "back"
label = "BACK"
string_id = "OAG_MENU_BACK"

[[page]]
id = "pilots"
title = "AI PILOTS"
title_string_id = "OAG_PILOT_PAGE_TITLE"

# Ours, start to finish - see `crates/game/src/pilots.rs`'s own module doc.
# No disc's front end has anything like it: pilots are ranges this project
# draws opponents from, not something either original game's data authors.
#
# PILOT first, because it decides what AXIS below is even editing - the same
# order TRACK TITLE puts ahead of TRACK on RACE REMIX. **A name with no `*`
# after it is a built-in.** Editing one and saving does not touch the four
# built into the binary - it writes a same-named file that *replaces* the
# built-in the next time pilots are loaded, which is why SAVE always works
# here even on `balanced`, `aggressive`, `passive` or `shy`.
[[page.entry]]
kind = "choice"
label = "PILOT"
string_id = "OAG_PILOT_PILOT"
setting = "pilot.selected"
values_from = "pilots"

# Every axis this format understands, in `crate::pilots::AXES`'s own draw
# order - the same order the file format documents them in.
[[page.entry]]
kind = "choice"
label = "AXIS"
string_id = "OAG_PILOT_AXIS"
setting = "pilot.axis"
values_from = "pilot_axes"

# The two ends of the range PILOT draws AXIS from. Two rows and not one two-
# handle control, because nothing in this menu format has a control with two
# handles - see `crate::pilots.rs`'s own doc on why a range and not a value is
# the format's whole point. Resupplied whenever PILOT or AXIS moves, and
# whichever number the file already held is always one of the options, so
# moving straight to SAVE without touching either changes nothing.
[[page.entry]]
kind = "choice"
label = "LOW"
string_id = "OAG_PILOT_LOW"
setting = "pilot.low"
values_from = "pilot_axis_low"

[[page.entry]]
kind = "choice"
label = "HIGH"
string_id = "OAG_PILOT_HIGH"
setting = "pilot.high"
values_from = "pilot_axis_high"

# Writes PILOT's file with AXIS set to [LOW, HIGH] and nothing else touched -
# every other axis, and every comment a player wrote by hand, survives. See
# `crate::pilots::set_axis`.
#
# Only AXIS's own axis - moving AXIS before pressing this discards an edit
# to the one just left, silently. See `session::pilot_editor`'s module doc.
[[page.entry]]
kind = "action"
label = "SAVE"
string_id = "OAG_PILOT_SAVE"
action = "save_pilot"

# Auto-named (`pilot-1`, `pilot-2`, ...) rather than asking for a name.
# **Kept now that RENAME exists**, not superseded by it: copying a pilot to
# tinker with is one press this way and a name typed on a grid the other, and
# the fast path is the one somebody experimenting uses twenty times an hour.
# Copies whichever pilot PILOT currently holds.
[[page.entry]]
kind = "action"
label = "NEW FROM PILOT"
string_id = "OAG_PILOT_NEW"
action = "new_pilot"

# Opens the on-screen keyboard (`crate::prompt::Keyboard`) on PILOT's current
# name and, on accept, **moves** the file - so every comment, blank line and
# number spelling in it survives, by never having been read. See
# `crate::pilots::rename_pilot`.
#
# Refused for a pilot with no file of its own: an untouched built-in lives in
# the binary and there is nothing on disk to move. That gate is in Rust off
# `pilots::Entry::from_file` and deliberately **not** a `disabled_by` on the
# four built-in names - the moment a player saves an edit to `aggressive` a
# file exists, and renaming that file is perfectly legitimate.
[[page.entry]]
kind = "action"
label = "RENAME"
string_id = "OAG_PILOT_RENAME"
action = "rename_pilot"

# Asks first (`crate::prompt::Confirm`), because this destroys a file - and
# because for a file named after one of the four built-ins, "delete" is not
# what happens. `aggressive.toml` *replaces* the built-in of that name rather
# than adding a pilot, so removing it **restores** the built-in and
# `aggressive` goes on existing with the numbers the binary ships. The confirm
# says that, naming the pilot, which is the only place it can be said with the
# name in hand: a `warn_when` here would need two conditions by design (see
# `menu/definition.rs`) and there is only one fact to test.
[[page.entry]]
kind = "action"
label = "DELETE"
string_id = "OAG_PILOT_DELETE"
action = "delete_pilot"

[[page.entry]]
kind = "back"
label = "BACK"
string_id = "OAG_MENU_BACK"
