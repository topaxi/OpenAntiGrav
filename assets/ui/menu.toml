# OpenAntiGrav's menu tree.
#
# This file is OURS. It is not a transcription of the disc's
# `MainMenu_Definition.xml` and is not meant to become one: this project needs
# the menus a PC game has (input bindings, graphics settings) and the original
# had no reason to carry those. See `crates/game/src/menu.rs` for the reasoning
# and for the format.
#
# Rules the loader enforces, so a mistake here is a startup error rather than a
# row that does nothing when pressed:
#
#   - every `target` names a page in this file;
#   - every `action` is one the game handles: launch_race, launch_remix, quit,
#     save_pilot, new_pilot, rename_pilot, delete_pilot, open_campaign;
#   - every `button` is an abstract button name;
#   - every page is reachable from `root`.
#
# Edit it and run `cargo nextest run -p oag-game menu::` to check it, or pass
# `--menu <path>` to try a copy without rebuilding.
#
# A row may carry `string_id`, and a page may carry `title_string_id` -  an id
# `crate::menu::definition::resolved` looks up in a project-owned
# `assets/ui/strings/<language>.toml` and shows in place of `label`/`title`
# when found, falling back to the literal text otherwise - see
# `crate::strings`.
#
# A row may also carry `subtitle` (with an optional `subtitle_string_id`,
# resolved the same way): a second line, shown only under the *selected* row,
# on a title whose skin measured where one goes - see
# `docs/architecture/menus.md#a-per-row-subtitle`. Omit it and the row simply
# draws with none, the same as before this field existed.
#
# **A new row or page needs its `string_id`/`title_string_id` and the
# matching English entry in `assets/ui/strings/english.toml`, in the same
# change.** `just check-strings` (`scripts/check-strings.py`) enforces this at
# gate time: a label or title with no id is a hard failure unless it is one of
# the rows this script's own `BASELINE_LABELS`/`BASELINE_TITLES` names, which
# is the pre-existing debt most of this file still is - a ratchet, the same
# shape `check-size`'s file-length ceiling already is, so old debt is bounded
# and visible rather than blocking, and *new* UI cannot add to it silently.
#
# Identifiers in `values` are archive path components, never display names:
# `Assegai` is a directory on the disc. Anything a player should read in their
# own language comes from the source at runtime through `values_from`, so no
# shipped content ever lands in this file. See
# `docs/architecture/adr/0006-no-copyrighted-content.md`.

version = 1
root = "main"

[[page]]
id = "main"
title = "OPENANTIGRAV"
title_string_id = "OAG_MENU_MAIN_TITLE"

# **Ordered and worded to match `MainMenu_Definition.xml`'s own first two
# rows**, `FE_RACE_CAM` then `FE_RACEBOX` - see
# `docs/formats/fe-menu-definitions.md#the-seven-rows-and-their-help-text-read-in-full`.
# Opens `Grid Selection` over the menus rather than a submenu page of our
# own. The disc authors `Grid Selection`/`Cell Selection` in
# `CellMode_Definition.xml` the same way it authors `Track Creation`/`Team
# Selection`, and `oag_ui_screens::campaign` draws them the same way
# `oag_ui_screens::picker` draws those - so this is `kind = "action"`, like START on
# the RACEBOX page, not a page in this tree. A source whose campaign has not
# been read (everything but Wipeout Pulse today) logs why and leaves the
# menus open, per `crate::session::campaign::open_campaign`'s own doc.
[[page.entry]]
kind = "action"
label = "RACE CAMPAIGN"
string_id = "OAG_MENU_RACE_CAMPAIGN"
action = "open_campaign"
subtitle = "The story mode: work your way up the tournament grid"
subtitle_string_id = "OAG_MENU_RACE_CAMPAIGN_SUBTITLE"

# **Renamed from `RACE` to match the disc's own `FE_RACEBOX` naming for this
# row** - a custom single race or split-screen match, the same thing the
# original's Racebox sets up. The page this targets (`race`, below) is
# unchanged; only the row's own label and place in the list moved.
[[page.entry]]
kind = "submenu"
label = "RACEBOX"
string_id = "OAG_MENU_RACEBOX"
target = "race"
subtitle = "Set up your own race, split screen included"
subtitle_string_id = "OAG_MENU_RACEBOX_SUBTITLE"

# **Shown unconditionally, not gated on "more than one title available".**
# The menu definition has no way to ask that question - `disabled_by` only
# ever reads another row's own held value (`Menu::held`), never an
# externally-seeded fact, and it refuses to apply to anything but a `choice`
# or a `toggle` in the first place, which a `submenu` entry is neither. With
# one title on this machine, TRACK TITLE and CRAFT TITLE on the `remix` page
# each offer exactly one row and the page degrades to an ordinary custom
# race - nothing broken, nothing misleading, the same page doing less.
[[page.entry]]
kind = "submenu"
label = "REMIX"
string_id = "OAG_MENU_REMIX"
target = "remix"
subtitle = "Mix tracks and ships across every title you own"
subtitle_string_id = "OAG_MENU_REMIX_SUBTITLE"

[[page.entry]]
kind = "submenu"
label = "RECORDS"
string_id = "OAG_MENU_RECORDS"
target = "records"
subtitle = "Your best times and scores, by track and class"
subtitle_string_id = "OAG_MENU_RECORDS_SUBTITLE"

[[page.entry]]
kind = "submenu"
label = "OPTIONS"
string_id = "OAG_MENU_OPTIONS"
target = "options"
subtitle = "Display, audio and control settings"
subtitle_string_id = "OAG_MENU_OPTIONS_SUBTITLE"

[[page.entry]]
kind = "action"
label = "QUIT"
string_id = "OAG_MENU_QUIT"
action = "quit"
subtitle = "Exit to the desktop"
subtitle_string_id = "OAG_MENU_QUIT_SUBTITLE"

[[page]]
id = "race"
title = "RACE"
title_string_id = "OAG_RACE_PAGE_TITLE"

# Mode first, because it is the thing that decides what the other rows mean: a
# zone run ignores the lap count a time trial is built around.
#
# `values_from` rather than a list, even though the set is fixed at
# `oag_race::Mode::ALL`: what the row *shows* is the front end's own event text
# off the player's disc, in their language, so it cannot be spelled here. The
# stored values are still the mode tokens.
[[page.entry]]
kind = "choice"
label = "MODE"
string_id = "OAG_RACE_MODE"
setting = "race.mode"
values_from = "race_modes"

# Speed class, team and track are the three things `race::Options` actually
# carries, so all three are live rather than decorative.
#
# `values_from` rather than a list, because the ladder is the *release's*:
# Wipeout Pure's per-team `handlingstats.xml` authors five `<Class>` rungs
# where Wipeout Pulse's authors four, each measured on its own disc. A literal
# list here would have to be either wrong for Pure or silently reused as if
# someone had checked - see `oag_title::SpeedClasses`. This row offers the
# booted title's own ladder; RACE REMIX below unions every available title's.
[[page.entry]]
kind = "choice"
label = "SPEED CLASS"
string_id = "OAG_RACE_SPEED_CLASS"
setting = "race.class"
values_from = "speed_classes"

# **TEAM, VARIANT and TRACK are dropped on a title whose front end authors its
# own selection screens** - Wipeout Pulse, where START opens Track Select and
# then Ship Select and all three are picked there, preview and all. The rows
# stay for Pure, HD and 2048, which have no such screens read yet, and START
# launches straight off them. See
# `oag_ui::menu::Definition::drop_rows_picked_on_screen` and
# `docs/ui/selection-screens.md`.
#
# The roster comes from the source for the same reason the circuits below do,
# and one more: it is not fixed. A player who owns a downloadable pack has teams
# no list in this repository could have named, and `values_from = "teams"` reads
# the plugin definition and every mounted pack's manifest for them. The value
# stored is the team id - the folder under `Data\Ships\` - and the label is that
# id in the language's own string table, which is not always the same word.
#
# Zone forces the shared Zone hull regardless of team (see
# `oag_livery::ship_entry_name`), so the row is greyed rather than
# offered as if it still picked the drawn model.
# Only a single race fields opponents, so this greys to N/A in the other three
# modes. `disabled_by` matches positively, so the list is the modes *without* a
# grid rather than a negation of the one with it - keep it in step with
# `oag_race::Mode::ALL`.
# The race box's `WEAPONS` row, third in the original too. Its two options are the
# disc's own `Weapons` list (`oag_game::boot::RaceSetup::weapons`, stored `On`/`Off`).
# Only a single race lets the player move it: the original greys it in every other
# mode and shows the mode's own answer, `Off` for Time Trial, Speed Lap and Zone and
# `On` for Eliminator (`FUN_088e715c`, `docs/formats/race-setup.md`), which is what
# `pinned` does - the player's own pick is untouched and returns with the mode.
# `Mode::weapons_enabled` is the same answer on the simulation's side.
[[page.entry]]
kind = "choice"
label = "WEAPONS"
string_id = "OAG_RACE_WEAPONS"
setting = "race.weapons"
values_from = "weapons"
pinned = [
    { setting = "race.mode", values = ["time_trial", "speed_lap", "zone"], shows = "Off" },
    { setting = "race.mode", value = "eliminator", shows = "On" },
]

[[page.entry]]
kind = "choice"
label = "AI DIFFICULTY"
string_id = "OAG_RACE_AI_DIFFICULTY"
setting = "ai.difficulty"
values = ["novice", "skilled", "elite", "ace"]
disabled_by = { setting = "race.mode", values = ["time_trial", "speed_lap", "zone"] }

# The race box's `KILLS` row: the values are the disc's own `Eliminations` list
# (`oag_game::boot::screens::read_race_setup`); a title that reads none has the
# row dropped (`Definition::drop_rows_picked_on_screen`) instead of offering
# numbers nothing authored. The
# original draws the row greyed in every mode but Eliminator and enables it
# there (`docs/formats/race-setup.md`), which is what `disabled_by` does here.
[[page.entry]]
kind = "choice"
label = "KILLS"
string_id = "OAG_RACE_KILLS"
setting = "race.kill_target"
values_from = "kill_targets"
disabled_by = { setting = "race.mode", values = ["time_trial", "speed_lap", "zone", "single_race"] }

[[page.entry]]
kind = "choice"
label = "TEAM"
string_id = "OAG_RACE_TEAM"
setting = "race.team"
values_from = "teams"
disabled_by = { setting = "race.mode", value = "zone" }

# Most teams offer nothing here - `values_from = "race_variant"` is supplied
# empty for them, the same idiom MUSIC SOURCE uses on a machine with one
# disc, which draws the row unusable rather than lying about having a
# choice. Wipeout 2048's five-team roster and Wipeout HD/Fury's twelve are
# the ones today whose teams carry more than one selectable directory.
[[page.entry]]
kind = "choice"
label = "VARIANT"
string_id = "OAG_RACE_VARIANT"
setting = "race.variant"
values_from = "race_variant"
disabled_by = { setting = "race.mode", value = "zone" }

# The circuits come from the source, not from this file, and so do their names:
# `values_from = "tracks"` reads `Data\Plugins\PI001\Definition.xml` for what
# is raceable and the language's own string table for what to call it. That is
# why there is no list here and no separate LAYOUT row - a reversed circuit is
# its own entry in that file, with its own id and its own name.
[[page.entry]]
kind = "choice"
label = "TRACK"
string_id = "OAG_RACE_TRACK"
setting = "race.track"
values_from = "tracks"

[[page.entry]]
kind = "action"
label = "START"
string_id = "OAG_RACE_START"
action = "launch_race"

[[page.entry]]
kind = "back"
label = "BACK"
string_id = "OAG_MENU_BACK"

[[page]]
id = "remix"
title = "RACE REMIX"
title_string_id = "OAG_REMIX_PAGE_TITLE"

# Mode and AI difficulty are title-agnostic and shared with the ordinary RACE
# page verbatim - same settings keys, same values, same `disabled_by`.
# Nothing about racing a mixed grid changes what a mode or a difficulty means.
#
# **SPEED CLASS is no longer one of them.** It shares the settings key, and
# that is all: the RACE page offers the booted title's ladder and the row
# below offers the union across every title this machine can open. A mixed
# grid is exactly the case where one title's four rungs are the wrong list.
[[page.entry]]
kind = "choice"
label = "MODE"
string_id = "OAG_RACE_MODE"
setting = "race.mode"
values_from = "race_modes"

# The union of every available title's ladder, not this one title's - the row
# that makes RACE REMIX a cross-title surface for the class the way TRACK
# TITLE and CRAFT TITLE already are for the circuit and the craft. Built from
# whichever titles this machine can actually open a source for, so a class
# whose title is absent is not offered at all rather than offered and then
# unable to load. See `oag_title::SpeedClasses::union`.
[[page.entry]]
kind = "choice"
label = "SPEED CLASS"
string_id = "OAG_RACE_SPEED_CLASS"
setting = "race.class"
values_from = "remix_speed_classes"

[[page.entry]]
kind = "choice"
label = "AI DIFFICULTY"
string_id = "OAG_RACE_AI_DIFFICULTY"
setting = "ai.difficulty"
values = ["novice", "skilled", "elite", "ace"]
disabled_by = { setting = "race.mode", values = ["time_trial", "speed_lap", "zone"] }

# Title first, then a title-scoped list, on both halves - the shape the
# feature's own request asked for. TRACK TITLE and CRAFT TITLE are the same
# `values_from` (every title this machine can open a source for); TRACK and
# TEAM are resupplied every time the title above them changes, which is what
# makes them different rows from the ordinary RACE page's `tracks`/`teams`
# rather than the same ones reused.
[[page.entry]]
kind = "choice"
