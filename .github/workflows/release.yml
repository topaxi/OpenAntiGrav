name: Release

# Builds the player-facing artifacts. docs/tools/releases.md is the reference:
# artifact names, what each contains, and how a release is cut.
#
# Triggers: a pushed `v*` tag, or a manual run from the Actions tab. A manual
# run builds and uploads the same artifacts as workflow artifacts (so a branch
# can be tried without tagging) and never creates a GitHub Release; the
# `release` job at the bottom runs for a tag only.
#
# nightly.yml calls this workflow with `nightly: true`: the same Linux, Deck and
# Windows jobs plus the Android APK, a `nightly-<date>-<sha7>` version, and
# `-nightly` in `oag-game --version`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      nightly:
        description: "A nightly build: dated version, -nightly suffix"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

# Every Linux job runs on `ubuntu-24.04`, not `ubuntu-latest`: GitHub moves
# the label to Ubuntu 26.04 on 2026-10-19, and the apt package names, the
# Android SDK/NDK paths and the container tooling these jobs lean on were only
# checked on 24.04. The shipped AppImage's glibc floor does not come from the
# runner (it is built in Debian bookworm, glibc 2.34 symbols), but the tarball
# and the host-built icon helper do. Moving to 26.04 is a decision, not a
# surprise: bump the pin on purpose. See docs/tools/releases.md.

# Read-only for every build job. Only `release` is granted write access.
permissions:
  contents: read

jobs:
  version:
    name: resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      suffix: ${{ steps.v.outputs.suffix }}
    steps:
      # `v0.1.0` becomes `0.1.0`; a manual run is `dev-<sha7>` so a trial build
      # can never be mistaken for a release. A nightly is `nightly-<date>-<sha7>`
      # and its binaries report `-nightly` (OAG_VERSION_SUFFIX, see build.rs).
      - id: v
        env:
          NIGHTLY: ${{ inputs.nightly }}
        run: |
          if [[ "$NIGHTLY" == "true" ]]; then
            echo "version=nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "suffix=-nightly" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  # Both Linux flavours go through scripts/build-appimage.sh --container, the
  # one packaging path this project has: Debian bookworm's glibc 2.36, so the
  # result loads on SteamOS (every SteamOS branch ships a newer glibc) and on
  # any desktop distribution of the last three years. See
  # docs/tools/packaging.md#glibc.
  linux:
    name: linux (${{ matrix.flavour }})
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Baseline x86-64: any 64-bit PC.
          - flavour: linux
            cpu_args: ""
          # Zen 2 (`-C target-cpu=znver2`): the Steam Deck's core. Refuses to
          # start on a CPU without AVX2/FMA/BMI2, so it is not offered as the
          # general download. See docs/tools/packaging.md, "A CPU-tier build".
          - flavour: steamdeck
            cpu_args: "--target-cpu znver2"
    env:
      VERSION: ${{ needs.version.outputs.version }}
      OAG_VERSION_SUFFIX: ${{ needs.version.outputs.suffix }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the AppImage in the bookworm container
        run: |
          mkdir -p dist
          scripts/build-appimage.sh --container ${{ matrix.cpu_args }} \
            --out "dist/OpenAntiGrav-${VERSION}-${{ matrix.flavour }}-x86_64.AppImage"
      # The tarball is the same binary as the AppImage (for a distribution
      # package or a machine without FUSE). Only the general flavour gets one:
      # the Deck's CPU-tier build is an AppImage for the Deck.
      - name: Cut the tarball
        if: matrix.flavour == 'linux'
        run: |
          name="OpenAntiGrav-${VERSION}-linux-x86_64"
          stage="stage/${name}"
          mkdir -p "$stage"
          binary="data/appimage/container/target/dist/oag-game"
          install -m 755 "$binary" "$stage/oag-game"
          strip "$stage/oag-game"
          cp LICENSE-MIT LICENSE-APACHE "$stage/"
          cp -r licences "$stage/licences"
          cp packaging/appimage/oag-game.desktop "$stage/"
          # The binary links libpipewire, which this runner does not have, so
          # it cannot run here: reuse the icon the AppImage build rasterised
          # inside the container.
          cp data/appimage/AppDir/oag-game.png "$stage/oag-game.png"
          tar -C stage -czf "dist/${name}.tar.gz" "$name"
      # The engine and nothing else: the same extension list `just
      # audit-leakage` uses, run over what was actually built rather than over
      # the git tree.
      - name: No game content in the artifacts
        run: |
          for f in dist/*.AppImage; do
            rm -rf unpacked && mkdir unpacked
            (cd unpacked && "$GITHUB_WORKSPACE/$f" --appimage-extract >/dev/null)
            python3 scripts/check-leakage.py --dir unpacked/squashfs-root
          done
          for f in dist/*.tar.gz; do
            [[ -e $f ]] || continue
            rm -rf unpacked && mkdir unpacked
            tar -C unpacked -xzf "$f"
            # The one top-level directory is the artifact root.
            python3 scripts/check-leakage.py --dir unpacked/OpenAntiGrav-*
          done
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.flavour }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: windows
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      # Same pinned toolchain as ci.yml; rust-toolchain.toml names it too.
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: cargo build --profile dist -p oag-game
        env:
          OAG_VERSION_SUFFIX: ${{ needs.version.outputs.suffix }}
      - name: Stage the zip
        shell: bash
        run: |
          name="OpenAntiGrav-${VERSION}-windows-x86_64"
          mkdir -p "stage/${name}" dist
          cp target/dist/oag-game.exe "stage/${name}/"
          cp LICENSE-MIT LICENSE-APACHE "stage/${name}/"
          cp -r licences "stage/${name}/licences"
          (cd stage && 7z a -tzip "../dist/${name}.zip" "${name}" >/dev/null)
      - name: No game content in the artifact
        shell: bash
        run: |
          mkdir unpacked
          7z x -ounpacked dist/*.zip >/dev/null
          python3 scripts/check-leakage.py --dir unpacked/OpenAntiGrav-*
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  # The Android APK: oag-game as a NativeActivity cdylib, built by
  # scripts/build-apk.sh (the same script `just apk` runs). The runner image
  # ships the SDK, build-tools and a platform; the NDK is pinned here. The
  # script unpacks the APK and runs check-leakage.py over it, so nothing
  # extracted can ride along. Signed with the repository's stored sideload key
  # (secrets OAG_APK_KEYSTORE_B64 / OAG_APK_KEYSTORE_PASS) so each build installs
  # over the last without an uninstall; a throwaway key when the secret is absent.
  android:
    name: android (arm64)
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      KEYSTORE_B64: ${{ secrets.OAG_APK_KEYSTORE_B64 }}
      OAG_APK_KEYSTORE_PASS: ${{ secrets.OAG_APK_KEYSTORE_PASS }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # build-apk.sh builds and runs the host oag-game to rasterise the
      # launcher icon, so the host needs what ci.yml's jobs install.
      - name: Install libpipewire and ALSA
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libasound2-dev libudev-dev libclang-dev pkg-config
      - name: NDK and cargo-ndk
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - name: Stored signing key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/oag.keystore"
          echo "OAG_APK_KEYSTORE=$RUNNER_TEMP/oag.keystore" >> "$GITHUB_ENV"
      - name: Build the APK
        run: |
          scripts/build-apk.sh --version "$VERSION"
          mkdir -p dist
          cp target/apk/OpenAntiGrav-*-android-arm64.apk dist/
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  # A Release is only ever created from a pushed tag, and as a draft: the
  # maintainer reads the notes and artifacts, then publishes by hand.
  # Later artifacts (anything an AUR `-bin` package consumes) are another `needs:` entry and another artifact directory; the
  # file names are `OpenAntiGrav-<version>-<platform>.<ext>` throughout.
  release:
    name: draft GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, linux, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum OpenAntiGrav-* > SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
            --title "OpenAntiGrav ${GITHUB_REF_NAME#v}"
