name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test / dependency rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # `oag-audio` builds `cpal` with its PipeWire host, which links
      # libpipewire-0.3 through pkg-config, and its ALSA backend needs
      # libasound2-dev. The runner image ships neither (the 2026-10-06 run died
      # in alsa-sys), so without both the audio crate does not compile at all.
      - name: Install libpipewire and ALSA
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libasound2-dev libudev-dev libclang-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace
      - name: Assert the two architecture dependency rules still hold
        run: python3 scripts/check-dependency-rules.py
      # Cheap and early: a transcendental in simulation code is a divergence
      # the determinism job below would only find after three matrix runs, and
      # only if somebody reads which hash moved.
      - name: Assert no platform transcendental reaches simulation code
        run: python3 scripts/check-transcendentals.py
      - name: Assert no Rust file or inline test module grew past its ceiling
        run: python3 scripts/check-file-size.py
      # `just apply-names` makes these same checks, but only ever with a Ghidra
      # bridge up - which CI has not got, so until this step nothing here read
      # names.tsv at all.
      - name: Assert every names.tsv row still matches its evidence page
        run: python3 scripts/check-ghidra-names.py
      # The captured databases are the only record of what the Ghidra projects
      # held beyond names.tsv, and the PSP ones they describe no longer exist.
      # This also catches a captured comment citing a docs page nobody wrote,
      # which the documentation job below cannot see - it walks prose, not TSV.
      - name: Assert docs/ghidra/captures matches its own measurement table
        run: python3 scripts/check-ghidra-captures.py
      - name: Assert HANDOVER.md is still under the Read tool's 256 KiB ceiling
        run: python3 scripts/check-handover-size.py
      - name: Assert every menu.toml row/title has a string_id and its english.toml text
        run: python3 scripts/check-strings.py

  docs:
    name: documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-doc-links.py

  # Cargo.toml's `rust-version` is a promise nothing else checks. `cargo
  # +<toolchain>` is required rather than a plain `cargo build`: rustup's
  # override precedence puts rust-toolchain.toml above whatever toolchain
  # this job just installed, so an unprefixed `cargo build` would silently
  # build with the pinned dev toolchain above and never test the floor at
  # all - which is exactly the "decorative MSRV" failure mode this job
  # exists to catch. If the two ever diverge, this job is the one that is
  # supposed to fail.
  msrv:
    name: MSRV build (1.97.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        id: msrv-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Install libpipewire and ALSA
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libasound2-dev libudev-dev libclang-dev pkg-config
      - run: cargo +${{ steps.msrv-toolchain.outputs.name }} build --workspace

  # The simulation must produce bit-identical results on every target we ship.
  # This job exists from day one on purpose: a determinism gate added later can
  # only ratify whatever drift already happened.
  determinism:
    name: determinism (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - name: Print determinism hashes (release)
        run: cargo run -q -p oag-core --example core_determinism_report
      - name: Assert hashes match the committed reference (release)
        run: cargo test -p oag-core --release determinism -- --nocapture
      # The math foundation above is not the simulation. These two cover the
      # real force law, over a synthetic world so they need no disc image.
      - name: Print simulation determinism hashes (release)
        run: cargo run -q -p oag-physics --example physics_determinism_report
      - name: Assert simulation hashes match the committed reference (release)
        run: cargo test -p oag-physics --release --test determinism -- --nocapture
      # What a race carries around the dynamics: the inventory, the
      # projectiles, the lap state and the generator's position. It needs no
      # disc image either, so it belongs on all three targets rather than only
      # in the Linux-only workspace run.
      - name: Assert race-level hashes match the committed reference (release)
        run: cargo test -p oag-gameplay --release --test determinism -- --nocapture
      # The force law above is driven by a *scripted* input, so no controller
      # decision is in its hash. This one drives the drivers, which is where
      # `Line::curvature` lives - the platform `acos` it used to call was
      # outside every gate for exactly this reason.
      - name: Print driver determinism hashes (release)
        run: cargo run -q -p oag-ai --example ai_determinism_report
      - name: Assert driver hashes match the committed reference (release)
        run: cargo test -p oag-ai --release --test determinism -- --nocapture
      # determinism.md requires bit-identical state in debug too, not just
      # release. Linux-debug is also covered by the `check` job's `cargo
      # nextest run --workspace`; these three make Windows-debug and
      # macOS-debug actually run instead of being claimed by the doc alone.
      - name: Assert hashes match the committed reference (debug)
        run: cargo test -p oag-core determinism -- --nocapture
      - name: Assert simulation hashes match the committed reference (debug)
        run: cargo test -p oag-physics --test determinism -- --nocapture
      - name: Assert race-level hashes match the committed reference (debug)
        run: cargo test -p oag-gameplay --test determinism -- --nocapture
      - name: Assert driver hashes match the committed reference (debug)
        run: cargo test -p oag-ai --test determinism -- --nocapture

  leakage:
    name: no game content committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert no game content (or a reproduction this project writes) is tracked
        run: python3 scripts/check-leakage.py
