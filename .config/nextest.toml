# Test-runner configuration. Scheduling only - nothing here changes whether a
# test runs or what it asserts.
#
# `just test-data` is tail-bound rather than throughput-bound: the tests over 16
# cores finish in about the time the *slowest single test* takes, so what
# matters is that the long ones are already running while the short ones fill in
# around them. Every ground-truth test that walks a disc takes tens of seconds;
# almost every other test takes milliseconds. Left to the default order the
# suite ends with a handful of long tests running alone on an otherwise idle
# machine.
#
# **This file is the second-order fix, and it stops paying once one test is the
# whole tail.** On 2026-09-09 only 62s of a 587s run was not overlapped with a
# single 525s test, so nothing schedulable here could have helped: the fix was
# splitting that test. See `scripts/check-test-budget.py`, which fails the run
# when a single test passes 300s, and `docs/architecture/workspace-layout.md`
# for the measurements.
#
# Priority runs from -100 to 100 and higher goes first.

# The one test that transcodes a PS2 intro prefix with `refresh: true`, which is
# load-bearing for what it asserts, so the work cannot be cached away. It is
# one of the longer tests, so it starts first. This override sits above the
# general ground-truth one because nextest applies the first override that
# matches a test for each setting, so a later priority never wins.
[[profile.default.overrides]]
filter = 'test(an_uncapped_transcode_still_reports_a_total_to_divide_by)'
priority = 100

# The ground-truth binaries are the ones that need `data/images`, and so the ones
# that are `#[ignore]`d in the ordinary run. Under plain `just test` they are
# skipped and this ordering costs nothing. Most crates link every `tests/*.rs`
# into one `it` binary or a few `it_*` ones (a crate's `tests/it*.rs`),
# where a file's tests sit behind its module, so the file name is matched in
# the test name too.
[[profile.default.overrides]]
filter = 'binary(~ground_truth) | test(~ground_truth::)'
priority = 50

# Selecting a subset for local iteration - nextest's own filtersets already do
# this, so no extra tool (`cargo-test-changed`, `cargo-difftests`) is needed:
#
#   cargo nextest run -E 'rdeps(oag-rcs)'          # oag-rcs and its dependents
#   cargo nextest run -p oag-raceplay ai_roll_ground_truth::  # one ground-truth file
#
# A member's gate is a selection too, since 2026-10-07: `just gate-affected` and
# `just test-data-affected` hand `cargo nextest` the packages
# `scripts/affected.py` picks - those a branch changed and every package that
# depends on one, which is what `rdeps()` above selects (checked: an `oag-mesh`
# change, 2,904 tests either way). That is why the cross-crate surprise this
# comment used to warn with is still caught: narrowing
# `VertexDecl::vertex_colour()` in `oag-rcs` broke `hd_engine_flare_ground_truth`
# in `oag-game`, and `oag-game` is among `oag-rcs`'s dependents. What a
# selection cannot see is two branches that are each green on their own and red
# together, which is what the lead's full `just test-data` per merge batch is for.
